<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영어 문법 마스터</title>
<style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #fff9f0; color: #555; margin: 0; padding: 0; line-height: 1.6; overflow-x: hidden; }
    #container { max-width: 720px; margin: 0 auto; padding: 80px 20px 120px 20px; }
    h1 { text-align: center; font-size: 2rem; color: #444; margin-bottom: 40px; font-weight: 800; letter-spacing: -1px; }
    #menu-toggle-btn { position: fixed; top: 20px; left: 20px; z-index: 1001; background-color: #444; color: #fff; border: none; padding: 12px 24px; border-radius: 30px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.2s; }
    #menu-toggle-btn:hover { transform: scale(1.05); background-color: #222; }
    .topic-buttons { position: fixed; top: 0; left: -320px; width: 300px; height: 100vh; background: #fff; z-index: 1000; box-shadow: 5px 0 30px rgba(0,0,0,0.05); display: flex; flex-direction: column; transition: left 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
    .topic-buttons.active { left: 0; }
    .menu-header { padding: 80px 20px 20px; background: #fff4e6; border-bottom: 2px solid #ffec99; }
    .menu-list { flex: 1; overflow-y: auto; padding: 20px; }
    .menu-list button { width: 100%; text-align: left; padding: 14px 15px; margin-bottom: 8px; border: none; background: transparent; border-radius: 15px; font-weight: 600; color: #666; cursor: pointer; transition: 0.2s; font-size: 0.95rem; }
    .menu-list button:hover { background: #fff9db; color: #e67700; padding-left: 20px; }
    span[id^="count-"] { float: right; font-size: 0.8rem; font-weight: bold; background: #fff3bf; color: #e67700; padding: 3px 8px; border-radius: 12px; }
    .topic-section, #verb-container, #quiz-container, #exam-container, #history-container { background: #ffffff; padding: 40px; border-radius: 35px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); margin-bottom: 30px; border: 4px solid #fff; animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: none; position: relative; }
    .quiz-option, .exam-option { display: block; width: 100%; box-sizing: border-box; text-align: left; padding: 18px 24px; margin: 12px 0; background: #fff; border: 3px solid #f1f3f5; border-radius: 25px; font-size: 1.1rem; color: #555; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .quiz-option:hover, .exam-option:hover { border-color: #ffec99; background-color: #fffbeb; color: #f08c00; transform: translateY(-3px) scale(1.01); box-shadow: 0 8px 20px rgba(255, 212, 59, 0.25); }
    .quiz-option:disabled, .exam-option:disabled { cursor: default; transform: none; }
    #score-display, #exam-score { display: inline-block; background-color: #e6fcf5; color: #0ca678; padding: 10px 30px; border-radius: 50px; font-weight: 800; font-size: 1.2rem; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(12, 166, 120, 0.15); }
    .quiz-item p, #exam-question-text { font-size: 1.4rem; font-weight: 800; color: #343a40; margin-bottom: 30px; text-align: left; background: #f8f9fa; padding: 30px; border-radius: 25px; line-height: 1.6; border-left: 8px solid #ffec99; }
    .feedback { margin-top: 25px; padding: 20px; border-radius: 20px; text-align: center; font-weight: bold; font-size: 1.1rem; animation: slideDown 0.3s; }
    .feedback.correct { background: #d3f9d8; color: #2b8a3e; border: 2px solid #b2f2bb; }
    .feedback.wrong { background: #ffe3e3; color: #e03131; border: 2px solid #ffc9c9; }
    .toggle-content-btn { position: absolute; top: 30px; right: 30px; background: #f1f3f5; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; color: #868e96; font-size: 1.2rem; transition: 0.2s; }
    .toggle-content-btn:hover { background-color: #e9ecef; color: #333; }
    #menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 900; display: none; backdrop-filter: blur(4px); }
    #menu-overlay.active { display: block; }
    @keyframes popUp { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<button id="menu-toggle-btn" onclick="toggleMenu()">☰ 목차 열기</button>
<div id="menu-overlay" onclick="closeMenu()"></div>
<div class="topic-buttons">
    <div class="menu-header"><h3 style="margin:0; color:#444;">📚 학습 메뉴</h3><p style="font-size:0.85rem; color:#888;">포기하지 말고 끝까지!</p></div>
    <div class="menu-list">
        <button onclick="toggleVerbTable()" style="color:#e67700;">1) 불규칙 동사표</button>
        <button onclick="showQuizSelection()" style="color:#e03131;">2) 연습 퀴즈 (Quiz)</button>
        <button onclick="startFinalExam()" style="color:#2b8a3e;">3) 최종 평가 (Exam)</button>
        <button onclick="showTopic('pronoun')">1. 대명사 <span id="count-pronoun"></span></button>
        <button onclick="showTopic('agreement')">2. 수 일치 <span id="count-agreement"></span></button>
        <button onclick="showTopic('sentence12')">3. 1,2 형식 <span id="count-sentence12"></span></button>
        <button onclick="showTopic('sentence3')">4. 3 형식 <span id="count-sentence3"></span></button>
        <button onclick="showTopic('sentence4')">5. 4 형식 <span id="count-sentence4"></span></button>
        <button onclick="showTopic('sentence5')">6. 5 형식 <span id="count-sentence5"></span></button>
        <button onclick="showTopic('basicTense')">7. 기본 시제 <span id="count-basicTense"></span></button>
        <button onclick="showTopic('modal')">8. 조동사 <span id="count-modal"></span></button>
        <button onclick="showTopic('presentPerfect')">9. 현재완료 <span id="count-presentPerfect"></span></button>
        <button onclick="showTopic('passive')">10. 수동태 <span id="count-passive"></span></button>
        <button onclick="showTopic('preposition')">11. 전치사 <span id="count-preposition"></span></button>
        <button onclick="showTopic('conjunction')">12. 접속사 <span id="count-conjunction"></span></button>
        <button onclick="showTopic('relative')">13. 관계대명사 <span id="count-relative"></span></button>
        <button onclick="showTopic('relativeAdverb')">14. 관계부사 <span id="count-relativeAdverb"></span></button>
        <button onclick="showTopic('toinf')">15. To 부정사 <span id="count-toinf"></span></button>
        <button onclick="showTopic('gerund')">16. 동명사 <span id="count-gerund"></span></button>
        <button onclick="showTopic('participle')">17. 분사구문 <span id="count-participle"></span></button>
        <button onclick="showTopic('nounParticiple')">18. 명사 수식 분사 <span id="count-nounParticiple"></span></button>
        <button onclick="showTopic('comparison')">19. 비교급 <span id="count-comparison"></span></button>
        <button onclick="showTopic('causative')">20. 사역동사 <span id="count-causative"></span></button>
        <button onclick="showTopic('perception')">21. 지각동사 <span id="count-perception"></span></button>
        <button onclick="showTopic('conditionalPresent')">22. 가정법 현재 <span id="count-conditionalPresent"></span></button>
        <button onclick="showTopic('conditionalPast')">23. 가정법 과거 <span id="count-conditionalPast"></span></button>
        <button onclick="showTopic('conditionalPastPerfect')">24. 가정법 과거완료 <span id="count-conditionalPastPerfect"></span></button>
        <button onclick="showTopic('emphasis')">25. 강조 구문 <span id="count-emphasis"></span></button>
    </div>
</div>
<div id="container">
    <h1>📝 영어 문법 마스터</h1>
    <div id="verb-container">
        <h3 style="font-size:1.5rem; margin-bottom:25px; color:#e67700; border-bottom:3px solid #ffec99; display:inline-block;">📋 불규칙 동사표</h3>
        <div style="background:#fff9db; padding:30px; border-radius:25px; text-align:center; margin-bottom:30px;">
            <p id="verbQuizQuestion" style="font-size:1.3rem; font-weight:800; color:#444; margin-bottom:20px;">(로딩 중...)</p>
            <div style="display:flex; justify-content:center; gap:10px; margin-bottom:15px;">
                <input type="text" id="verbQuizAnswer" placeholder="정답 입력" style="padding:12px; border-radius:15px; border:2px solid #ffe066; width:50%; font-size:1.1rem; text-align:center; outline:none;">
                <button onclick="checkVerbQuiz()" style="padding:12px 25px; background:#444; color:white; border:none; border-radius:15px; font-weight:bold; cursor:pointer;">확인</button>
            </div>
            <p id="verbQuizResult" style="min-height:24px; font-weight:bold;"></p>
            <div style="margin-top:20px; border-top:1px dashed #e6c88e; padding-top:20px;">
                <button onclick="startVerbQuiz()" style="background:#fab005; color:white; border:none; padding:10px 20px; border-radius:20px; font-weight:bold; cursor:pointer; font-size:1rem;">🎲 새 문제</button>
                <select id="verbQuizType" style="padding:10px; border-radius:15px; border:1px solid #e6c88e; margin-left:10px; background:white;">
                    <option value="past">과거형 맞추기</option>
                    <option value="pp">과거분사 맞추기</option>
                    <option value="base">원형 맞추기</option>
                </select>
            </div>
        </div>
        <div style="overflow-x:auto;">
            <table style="width:100%; border-collapse:collapse; background:white; border-radius:15px; overflow:hidden;">
                <thead><tr style="background:#f1f3f5; color:#666;"><th style="padding:15px;">원형</th><th>과거</th><th>P.P</th><th>뜻</th></tr></thead>
                <tbody id="verbTableBody"></tbody>
            </table>
        </div>
    </div>
    <div id="quiz-container">
        <h3 style="margin-bottom:30px; color:#1c7ed6; border-bottom:3px solid #a5d8ff; display:inline-block;">✍ Practice Quiz</h3>
        <div id="quiz-select-menu">
            <p style="text-align:center; color:#888; margin-bottom:25px; font-size:1.1rem;">풀고 싶은 문제 유형을 선택하세요!</p>
            <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap:12px; max-height:450px; overflow-y:auto; padding:5px;">
                <button onclick="startQuiz('pronoun')" class="quiz-option">1. 대명사</button>
                <button onclick="startQuiz('agreement')" class="quiz-option">2. 수 일치</button>
                <button onclick="startQuiz('sentence12')" class="quiz-option">3. 1,2 형식</button>
                <button onclick="startQuiz('sentence3')" class="quiz-option">4. 3 형식</button>
                <button onclick="startQuiz('sentence4')" class="quiz-option">5. 4 형식</button>
                <button onclick="startQuiz('sentence5')" class="quiz-option">6. 5 형식</button>
                <button onclick="startQuiz('basicTense')" class="quiz-option">7. 기본 시제</button>
                <button onclick="startQuiz('modal')" class="quiz-option">8. 조동사</button>
                <button onclick="startQuiz('presentPerfect')" class="quiz-option">9. 현재완료</button>
                <button onclick="startQuiz('passive')" class="quiz-option">10. 수동태</button>
                <button onclick="startQuiz('preposition')" class="quiz-option">11. 전치사</button>
                <button onclick="startQuiz('conjunction')" class="quiz-option">12. 접속사</button>
                <button onclick="startQuiz('relative')" class="quiz-option">13. 관계대명사</button>
                <button onclick="startQuiz('relativeAdverb')" class="quiz-option">14. 관계부사</button>
                <button onclick="startQuiz('toinf')" class="quiz-option">15. To 부정사</button>
                <button onclick="startQuiz('gerund')" class="quiz-option">16. 동명사</button>
                <button onclick="startQuiz('participle')" class="quiz-option">17. 분사구문</button>
                <button onclick="startQuiz('nounParticiple')" class="quiz-option">18. 명사 수식</button>
                <button onclick="startQuiz('comparison')" class="quiz-option">19. 비교급</button>
                <button onclick="startQuiz('causative')" class="quiz-option">20. 사역동사</button>
                <button onclick="startQuiz('perception')" class="quiz-option">21. 지각동사</button>
                <button onclick="startQuiz('conditionalPresent')" class="quiz-option">22. 가정법 현재</button>
                <button onclick="startQuiz('conditionalPast')" class="quiz-option">23. 가정법 과거</button>
                <button onclick="startQuiz('conditionalPastPerfect')" class="quiz-option">24. 가정법 과완</button>
                <button onclick="startQuiz('emphasis')" class="quiz-option">25. 강조 구문</button>
            </div>
            <div style="margin-top:20px;">
                <button onclick="startQuiz('random')" class="quiz-option" style="background:#e7f5ff; border-color:#339af0; color:#1c7ed6; text-align:center;">🎲 전체 랜덤 퀴즈 (10문제)</button>
            </div>
        </div>
        <div id="quiz-solve-area" style="display:none; text-align:center;">
            <div id="score-display">Score: 0</div>
            <div class="quiz-item">
                <p id="quiz-question-text"></p>
                <div id="quiz-options-area"></div>
            </div>
            <div id="quiz-feedback" class="feedback"></div>
            <div style="margin-top:30px;">
                <button onclick="showQuizSelection()" style="padding:12px 30px; border-radius:30px; border:none; background:#f1f3f5; cursor:pointer; font-weight:bold; margin-right:10px;">목록으로</button>
                <button id="next-quiz-btn" onclick="nextQuizQuestion()" style="display:none; padding:12px 40px; border-radius:30px; border:none; background:#1c7ed6; color:white; font-weight:bold; cursor:pointer; box-shadow:0 4px 10px rgba(28, 126, 214, 0.3);">다음 문제 ➔</button>
            </div>
        </div>
    </div>
    <div id="exam-container">
        <h3 style="margin-bottom:30px; color:#fa5252; border-bottom:3px solid #ff8787; display:inline-block;">🎓 Final Evaluation</h3>
        <div id="exam-start-screen" style="text-align:center; padding:50px 30px; background:#fff5f5; border-radius:30px; border:2px solid #ffe3e3;">
            <h2 style="color:#fa5252; margin-bottom:15px;">종합 실력 평가</h2>
            <p style="color:#555; margin-bottom:40px; font-size:1.1rem;">총 <b>20문제</b>가 무작위로 출제됩니다.<br>당신의 진짜 실력을 확인해보세요!</p>
            <button onclick="startFinalExam()" style="padding:18px 50px; border-radius:50px; background:#fa5252; color:white; border:none; font-size:1.3rem; font-weight:800; cursor:pointer; box-shadow:0 8px 20px rgba(250,82,82,0.3); transition:transform 0.2s;">시험 시작 (Start)</button>
        </div>
        <div id="exam-progress-area" style="display:none;">
            <div style="text-align:center; font-weight:800; color:#fa5252; margin-bottom:25px; font-size:1.2rem;">Question <span id="exam-current-num">1</span></div>
            <div id="exam-question-box">
                <h4 id="exam-question-text" style="font-size:1.3rem; font-weight:800; color:#343a40; background:#f8f9fa; padding:25px; border-radius:20px; border-left:8px solid #ff8787;"></h4>
                <div id="exam-options-area"></div>
            </div>
        </div>
    </div>
    <div id="history-container">
        <h3 style="margin-bottom:30px; color:#40c057; border-bottom:3px solid #69db7c; display:inline-block;">📊 시험 결과</h3>
        <div id="exam-result-view" style="display:none; text-align:center;">
            <div id="exam-score"></div>
            <p id="exam-message" style="font-size:1.3rem; font-weight:800; margin-bottom:20px; color:#555;"></p>
            <div id="retry-btn-area" style="margin-bottom:20px;"></div>
            <div style="display:flex; justify-content:center; gap:15px; margin-bottom:40px;">
                <button onclick="startFinalExam()" style="padding:12px 30px; background:#333; color:white; border:none; border-radius:30px; font-weight:bold; cursor:pointer;">새 시험 치기</button>
            </div>
            <div style="text-align:left; background:#f8f9fa; padding:30px; border-radius:25px;">
                <h4 style="margin-top:0; border-bottom:2px solid #e9ecef; padding-bottom:15px;">📝 오답 노트 (Review)</h4>
                <div id="exam-review-list"></div>
            </div>
        </div>
        <div id="history-list-view">
            <p style="text-align:center; color:#888; padding:30px;">(아직 시험 기록이 없습니다. 도전을 시작해보세요!)</p>
            <div style="text-align:center; margin-top:20px;">
                <button onclick="startFinalExam()" style="padding:15px 40px; background:#40c057; color:white; border:none; border-radius:30px; font-weight:bold; cursor:pointer; font-size:1.1rem; box-shadow:0 4px 15px rgba(64, 192, 87, 0.3);">첫 시험 시작하기</button>
            </div>
        </div>
    </div>
</div>
<script>
    const verbs = [
        { base: "be", past: "was/were", pp: "been", ko: "있다, 이다" },
        { base: "become", past: "became", pp: "become", ko: "되다" },
        { base: "begin", past: "began", pp: "begun", ko: "시작하다" },
        { base: "break", past: "broke", pp: "broken", ko: "깨다" },
        { base: "bring", past: "brought", pp: "brought", ko: "가져오다" },
        { base: "build", past: "built", pp: "built", ko: "짓다" },
        { base: "buy", past: "bought", pp: "bought", ko: "사다" },
        { base: "catch", past: "caught", pp: "caught", ko: "잡다" },
        { base: "come", past: "came", pp: "come", ko: "오다" },
        { base: "do", past: "did", pp: "done", ko: "하다" },
        { base: "eat", past: "ate", pp: "eaten", ko: "먹다" },
        { base: "fall", past: "fell", pp: "fallen", ko: "떨어지다" },
        { base: "feel", past: "felt", pp: "felt", ko: "느끼다" },
        { base: "find", past: "found", pp: "found", ko: "찾다" },
        { base: "fly", past: "flew", pp: "flown", ko: "날다" },
        { base: "get", past: "got", pp: "got/gotten", ko: "얻다" },
        { base: "give", past: "gave", pp: "given", ko: "주다" },
        { base: "go", past: "went", pp: "gone", ko: "가다" },
        { base: "have", past: "had", pp: "had", ko: "가지다" },
        { base: "hear", past: "heard", pp: "heard", ko: "듣다" },
        { base: "know", past: "knew", pp: "known", ko: "알다" },
        { base: "leave", past: "left", pp: "left", ko: "떠나다" },
        { base: "make", past: "made", pp: "made", ko: "만들다" },
        { base: "meet", past: "met", pp: "met", ko: "만나다" },
        { base: "run", past: "ran", pp: "run", ko: "달리다" },
        { base: "say", past: "said", pp: "said", ko: "말하다" },
        { base: "see", past: "saw", pp: "seen", ko: "보다" },
        { base: "send", past: "sent", pp: "sent", ko: "보내다" },
        { base: "sit", past: "sat", pp: "sat", ko: "앉다" },
        { base: "sleep", past: "slept", pp: "slept", ko: "자다" },
        { base: "speak", past: "spoke", pp: "spoken", ko: "말하다" },
        { base: "take", past: "took", pp: "taken", ko: "가져가다" },
        { base: "teach", past: "taught", pp: "taught", ko: "가르치다" },
        { base: "tell", past: "told", pp: "told", ko: "말하다" },
        { base: "think", past: "thought", pp: "thought", ko: "생각하다" },
        { base: "write", past: "wrote", pp: "written", ko: "쓰다" }
    ];
    const grammarQuestions = [
  { id:101, topic:"verbs", en:"I ____ to school yesterday.", ko:"나는 어제 학교에 갔다.", options:["go","went","gone","going"], answer:"went", explanation:"[초급] go(가다)의 과거형은 went입니다." },
  { id:102, topic:"verbs", en:"She ____ a movie last night.", ko:"그녀는 지난밤에 영화를 보았다.", options:["see","saw","seen","seeing"], answer:"saw", explanation:"[초급] see(보다)의 과거형은 saw입니다." },
  { id:103, topic:"verbs", en:"We ____ pizza for lunch.", ko:"우리는 점심으로 피자를 먹었다.", options:["eat","ate","eaten","eating"], answer:"ate", explanation:"[초급] eat(먹다)의 과거형은 ate입니다." },
  { id:104, topic:"verbs", en:"He ____ his homework.", ko:"그는 그의 숙제를 했다.", options:["do","did","done","doing"], answer:"did", explanation:"[초급] do(하다)의 과거형은 did입니다." },
  { id:105, topic:"verbs", en:"My mom ____ a cake.", ko:"엄마는 케이크를 만들었다.", options:["make","made","making","makes"], answer:"made", explanation:"[초급] make(만들다)의 과거형은 made입니다." },
  { id:106, topic:"verbs", en:"I ____ a new bag.", ko:"나는 새 가방을 샀다.", options:["buy","bought","buying","buys"], answer:"bought", explanation:"[초급] buy(사다)의 과거형은 bought입니다." },

  { id:618, topic:"sentence4", en:"Can you ____ me some water?", ko:"나에게 물 좀 갖다 줄래?", options:["get","got","getting","gets"], answer:"get", explanation:"[중급] get + 사람 + 사물 = ~에게 ~를 갖다 주다." },
  { id:619, topic:"sentence4", en:"He ____ me a nice tie.", ko:"그는 나에게 멋진 넥타이를 골라주었다.", options:["chose","choose","choosing","choice"], answer:"chose", explanation:"[중급] choose + 사람 + 사물 = ~에게 ~를 골라주다." },
  { id:620, topic:"sentence4", en:"The teacher ____ us the answer.", ko:"선생님은 우리에게 정답을 주지 않았다.", options:["refused","refuse","refusing","deny"], answer:"refused", explanation:"[중급] refuse/deny + 사람 + 사물 = ~에게 ~를 거절하다." },
  { id:621, topic:"sentence4", en:"This car ____ me a lot of money.", ko:"이 차는 나에게 많은 돈이 들게 했다.", options:["cost","spent","paid","used"], answer:"cost", explanation:"[고급] cost(비용이 들다)는 4형식 동사이며, 3형식으로 바꿀 수 없습니다." },
  { id:622, topic:"sentence4", en:"I ____ you your success.", ko:"나는 너의 성공이 부럽다.", options:["envy","jealous","like","hate"], answer:"envy", explanation:"[고급] envy는 'envy + 사람 + 대상' 형태의 4형식으로 씁니다." },
  { id:623, topic:"sentence4", en:"Please ____ me my sin.", ko:"제 죄를 용서해 주십시오.", options:["forgive","excuse","apologize","sorry"], answer:"forgive", explanation:"[고급] forgive + 사람 + 죄 = ~의 ~를 용서하다." },
  { id:624, topic:"sentence4", en:"This machine ____ you time and energy.", ko:"이 기계는 너의 시간과 에너지를 아껴준다.", options:["saves","save","saving","saved"], answer:"saves", explanation:"[고급] save(덜어주다)는 'save + 사람 + 수고/시간' 형태로 쓰입니다." },
  { id:625, topic:"sentence4", en:"I ____ him a promise.", ko:"나는 그에게 약속을 했다.", options:["made","did","gave","took"], answer:"made", explanation:"[고급] make a promise를 4형식으로: make him a promise." },
  { id:626, topic:"sentence4", en:"He ____ me the truth.", ko:"그는 나에게 사실을 말해주었다.", options:["told","said","explained","introduced"], answer:"told", explanation:"[고급] say, explain, introduce는 4형식 불가 동사이므로 답은 told." },
  { id:627, topic:"sentence4", en:"I found ____ a nice house.", ko:"나는 그에게 좋은 집을 찾아주었다.", options:["him","to him","for him","he"], answer:"him", explanation:"[고급] 4형식 어순: find + 간접목적어(him) + 직접목적어(a nice house)." },
  { id:628, topic:"sentence4", en:"She wrote ____ a letter.", ko:"그녀는 나에게 편지를 썼다.", options:["me","to me","for me","my"], answer:"me", explanation:"[고급] 4형식 어순: wrote + 사람(me) + 사물(a letter)." },
  { id:629, topic:"sentence4", en:"The police ____ him a fine.", ko:"경찰은 그에게 벌금을 부과했다.", options:["charged","cost","priced","valued"], answer:"charged", explanation:"[고급] charge + 사람 + 금액 = ~에게 ~를 청구하다." },
  { id:630, topic:"sentence4", en:"Promise ____ you won't tell.", ko:"말하지 않겠다고 나에게 약속해.", options:["me","to me","for me","with me"], answer:"me", explanation:"[고급] promise + 사람 + 내용(that...) = ~에게 ~를 약속하다." },

  { id:651, topic:"sentence5", en:"You ____ me happy.", ko:"너는 나를 행복하게 만든다.", options:["make","makes","making","made"], answer:"make", explanation:"[초급] 목적어(me)의 상태를 설명하는 형용사(happy) 보어." },
  { id:652, topic:"sentence5", en:"We ____ him a genius.", ko:"우리는 그를 천재라고 부른다.", options:["call","called","calling","calls"], answer:"call", explanation:"[초급] 목적어(him) = 명사보어(a genius)." },
  { id:653, topic:"sentence5", en:"The news ____ me sad.", ko:"그 소식은 나를 슬프게 만들었다.", options:["made","make","making","makes"], answer:"made", explanation:"[초급] make + 목적어 + 형용사(sad)." },
  { id:654, topic:"sentence5", en:"He ____ the door open.", ko:"그는 문을 열어 두었다.", options:["kept","keep","keeping","keeps"], answer:"kept", explanation:"[초급] keep + 목적어 + 형용사(open: 열린 상태)." },
  { id:655, topic:"sentence5", en:"She ____ her dog Max.", ko:"그녀는 그녀의 개를 Max라고 이름 지었다.", options:["named","name","naming","names"], answer:"named", explanation:"[초급] name + 목적어 + 명사(이름)." },
  { id:656, topic:"sentence5", en:"Please ____ the room clean.", ko:"방을 깨끗하게 유지해 주세요.", options:["keep","keeps","keeping","kept"], answer:"keep", explanation:"[초급] keep + 목적어(room) + 형용사(clean)." },
  { id:657, topic:"sentence5", en:"They ____ him captain.", ko:"그들은 그를 주장으로 선출했다.", options:["elected","elect","electing","elects"], answer:"elected", explanation:"[초급] elect + 목적어 + 명사(직책)." },
  { id:658, topic:"sentence5", en:"I ____ the movie boring.", ko:"나는 그 영화가 지루하다는 것을 알았다(생각했다).", options:["found","find","finding","finds"], answer:"found", explanation:"[초급] find가 5형식으로 쓰이면 '알게 되다/생각하다'는 뜻." },
  { id:659, topic:"sentence5", en:"Don't ____ me alone.", ko:"나를 혼자 두지 마.", options:["leave","leaves","leaving","left"], answer:"leave", explanation:"[초급] leave + 목적어 + 형용사(alone: 혼자인 상태)." },
  { id:660, topic:"sentence5", en:"We ____ the baby Angel.", ko:"우리는 그 아기를 천사라고 부른다.", options:["call","calls","called","calling"], answer:"call", explanation:"[초급] call A B (A를 B라고 부르다)." },
  { id:661, topic:"sentence5", en:"The sun ____ us warm.", ko:"태양은 우리를 따뜻하게 해준다(유지시킨다).", options:["keeps","keep","keeping","kept"], answer:"keeps", explanation:"[초급] 3인칭 단수 주어(The sun) + keeps." },
  { id:662, topic:"sentence5", en:"I ____ it easy.", ko:"나는 그것이 쉽다고 생각한다.", options:["think","thinks","thinking","thought"], answer:"think", explanation:"[초급] think + 목적어 + 형용사(easy)." },
  { id:663, topic:"sentence5", en:"He ____ his room blue.", ko:"그는 방을 파란색으로 칠했다.", options:["painted","paint","painting","paints"], answer:"painted", explanation:"[초급] paint + 목적어 + 형용사(색깔)." },
  { id:664, topic:"sentence5", en:"She ____ her hair short.", ko:"그녀는 머리를 짧게 잘랐다.", options:["cut","cuts","cutting","to cut"], answer:"cut", explanation:"[초급] cut + 목적어 + 형용사(short)." },
  { id:665, topic:"sentence5", en:"Music ____ me relax.", ko:"음악은 나를 편안하게 해준다(돕는다).", options:["helps","help","helping","helped"], answer:"helps", explanation:"[초급] help + 목적어 + 동사원형(relax)." },
  // --- [중급: 동작 보어 (to부정사/원형) - 시험 출제 포인트] (15문제) ---
  { id:666, topic:"sentence5", en:"I want him ____ go.", ko:"나는 그가 가기를 원한다.", options:["to","for","of","at"], answer:"to", explanation:"[중급] want는 목적보어로 to부정사를 취합니다." },
  { id:667, topic:"sentence5", en:"She told me ____ study hard.", ko:"그녀는 나에게 열심히 공부하라고 말했다.", options:["to","that","for","of"], answer:"to", explanation:"[중급] tell + 사람 + to부정사 (명령/지시)." },
  { id:668, topic:"sentence5", en:"My mom made me ____ my room.", ko:"엄마는 나에게 방 청소를 시켰다.", options:["clean","to clean","cleaning","cleaned"], answer:"clean", explanation:"[중급] 사역동사 make + 목적어 + 동사원형." },
  { id:669, topic:"sentence5", en:"I saw him ____ in the park.", ko:"나는 그가 공원에서 달리는 것을 보았다.", options:["running","run","to run","ran"], answer:"running", explanation:"[중급] 지각동사 see + 목적어 + 현재분사(-ing)는 진행 강조." },
  { id:670, topic:"sentence5", en:"He asked me ____ help him.", ko:"그는 나에게 도와달라고 요청했다.", options:["to","for","that","of"], answer:"to", explanation:"[중급] ask + 사람 + to부정사 (요청하다)." },
  { id:671, topic:"sentence5", en:"Let me ____ it.", ko:"내가 그걸 하게 해줘.", options:["do","to do","doing","done"], answer:"do", explanation:"[중급] 사역동사 Let + 목적어 + 동사원형." },
  { id:672, topic:"sentence5", en:"I expect you ____ succeed.", ko:"나는 네가 성공하기를 기대한다.", options:["to","for","that","of"], answer:"to", explanation:"[중급] expect + 목적어 + to부정사." },
  { id:673, topic:"sentence5", en:"She allowed him ____ use her car.", ko:"그녀는 그가 차를 쓰는 것을 허락했다.", options:["to","for","that","of"], answer:"to", explanation:"[중급] allow + 목적어 + to부정사." },
  { id:674, topic:"sentence5", en:"He advised me ____ stop smoking.", ko:"그는 나에게 담배를 끊으라고 충고했다.", options:["to","for","that","of"], answer:"to", explanation:"[중급] advise + 사람 + to부정사." },
  { id:675, topic:"sentence5", en:"I heard someone ____ my name.", ko:"나는 누군가 내 이름을 부르는 것을 들었다.", options:["call","called","to call","calls"], answer:"call", explanation:"[중급] 지각동사 hear + 목적어 + 동사원형." },
  { id:676, topic:"sentence5", en:"The teacher ordered us ____ be quiet.", ko:"선생님은 우리에게 조용히 하라고 명령했다.", options:["to","that","for","of"], answer:"to", explanation:"[중급] order + 사람 + to부정사." },
  { id:677, topic:"sentence5", en:"I had my car ____.", ko:"나는 내 차를 수리했다(수리되게 시켰다).", options:["repaired","repair","repairing","to repair"], answer:"repaired", explanation:"[중급] 사역동사 have + 사물(car) + p.p.(수동)." },
  { id:678, topic:"sentence5", en:"We encouraged him ____ try again.", ko:"우리는 그에게 다시 시도해보라고 격려했다.", options:["to","for","that","of"], answer:"to", explanation:"[중급] encourage + 목적어 + to부정사." },
  { id:679, topic:"sentence5", en:"I saw the window ____.", ko:"나는 창문이 깨진 것을 보았다.", options:["broken","break","breaking","to break"], answer:"broken", explanation:"[중급] 지각동사라도 목적어가 사물(수동)이면 p.p." },
  { id:680, topic:"sentence5", en:"She helped me ____ the box.", ko:"그녀는 내가 상자 옮기는 것을 도왔다.", options:["carry","carrying","carried","carries"], answer:"carry", explanation:"[중급] help는 동사원형 또는 to부정사 가능." },
// 8. 기본 시제 (ID: 801 ~ 830) - [번호 정정: 700단위 -> 800단위]
  // --- [초급: 단순 시제 (현재/과거/미래)와 명확한 힌트] (15문제) ---
  { id:801, topic:"basicTense", en:"I ____ to school yesterday.", ko:"나는 어제 학교에 갔다.", options:["went","go","gone","going"], answer:"went", explanation:"[초급] 명백한 과거 시점(yesterday)이므로 과거형 went를 씁니다." },
  { id:802, topic:"basicTense", en:"She ____ TV now.", ko:"그녀는 지금 TV를 보고 있다.", options:["is watching","watches","watched","watch"], answer:"is watching", explanation:"[초급] 지금(now) 하고 있는 동작은 현재진행형(be + -ing)을 씁니다." },
  { id:803, topic:"basicTense", en:"The earth ____ round.", ko:"지구는 둥글다.", options:["is","was","will be","being"], answer:"is", explanation:"[초급] 불변의 진리나 과학적 사실은 항상 현재시제를 씁니다." },
  { id:804, topic:"basicTense", en:"I ____ meet him tomorrow.", ko:"나는 내일 그를 만날 것이다.", options:["will","did","do","have"], answer:"will", explanation:"[초급] 미래(tomorrow)의 일은 조동사 will을 사용합니다." },
  { id:805, topic:"basicTense", en:"He usually ____ up early.", ko:"그는 보통 일찍 일어난다.", options:["gets","get","getting","got"], answer:"gets", explanation:"[초급] '보통(usually)' 반복되는 습관은 단순 현재시제(3인칭 단수)를 씁니다." },
  { id:806, topic:"basicTense", en:"They ____ soccer last Sunday.", ko:"그들은 지난 일요일에 축구를 했다.", options:["played","play","playing","plays"], answer:"played", explanation:"[초급] 지난 일요일(last Sunday)은 과거이므로 played를 씁니다." },
  { id:807, topic:"basicTense", en:"Look! The bird ____.", ko:"봐! 새가 날고 있어.", options:["is flying","flies","fly","flew"], answer:"is flying", explanation:"[초급] 'Look!' 처럼 주의를 끌 때는 지금 벌어지는 일이므로 현재진행형을 씁니다." },
  { id:808, topic:"basicTense", en:"We ____ busy yesterday.", ko:"우리는 어제 바빴다.", options:["were","are","was","will be"], answer:"were", explanation:"[초급] 과거(yesterday)이고 주어가 복수(We)이므로 be동사는 were." },
  { id:809, topic:"basicTense", en:"It ____ rain tomorrow.", ko:"내일 비가 올 것이다.", options:["will","is","did","was"], answer:"will", explanation:"[초급] 미래의 날씨 예측은 will을 사용합니다." },
  { id:810, topic:"basicTense", en:"I ____ pizza very much.", ko:"나는 피자를 매우 좋아한다.", options:["like","liking","liked","likes"], answer:"like", explanation:"[초급] 현재의 상태나 기호(좋아함)는 단순 현재시제를 씁니다." },
  { id:811, topic:"basicTense", en:"She ____ a bag two days ago.", ko:"그녀는 이틀 전에 가방을 샀다.", options:["bought","buy","buys","buying"], answer:"bought", explanation:"[초급] ~전(ago)은 명백한 과거 시점이므로 bought를 씁니다." },
  { id:812, topic:"basicTense", en:"He ____ his homework every day.", ko:"그는 매일 숙제를 한다.", options:["does","do","did","doing"], answer:"does", explanation:"[초급] 매일(every day) 반복되는 일은 현재시제 3인칭 단수(does)를 씁니다." },
  { id:813, topic:"basicTense", en:"The sun ____ in the east.", ko:"해는 동쪽에서 뜬다.", options:["rises","rise","rose","rising"], answer:"rises", explanation:"[초급] 자연의 법칙(해는 뜬다)은 항상 현재시제입니다." },
  { id:814, topic:"basicTense", en:"____ you go to the park yesterday?", ko:"너 어제 공원에 갔니?", options:["Did","Do","Does","Will"], answer:"Did", explanation:"[초급] 일반동사의 과거 의문문은 Did를 사용합니다." },
  { id:815, topic:"basicTense", en:"I ____ not hungry now.", ko:"나는 지금 배고프지 않다.", options:["am","do","will","did"], answer:"am", explanation:"[초급] 현재 상태(now)를 나타내는 be동사 am." },
  // --- [중급: 진행형, 미래표현, 과거진행, 상태동사] (15문제) ---
  { id:816, topic:"basicTense", en:"I ____ sleeping when you called.", ko:"네가 전화했을 때 나는 자고 있었다.", options:["was","am","were","did"], answer:"was", explanation:"[중급] 과거의 특정 시점에 진행 중이던 동작은 과거진행형(was/were -ing)을 씁니다." },
  { id:817, topic:"basicTense", en:"He ____ going to visit his grandma.", ko:"그는 할머니 댁을 방문할 예정이다.", options:["is","will","was","does"], answer:"is", explanation:"[중급] 이미 계획된 미래는 'be going to'를 씁니다. 주어가 He이므로 is." },
  { id:818, topic:"basicTense", en:"I ____ him very well.", ko:"나는 그를 아주 잘 안다.", options:["know","am knowing","knew","known"], answer:"know", explanation:"[중급] know(알다)는 상태동사이므로 진행형(am knowing)으로 쓰지 않습니다." },
  { id:819, topic:"basicTense", en:"While I was walking, I ____ a dog.", ko:"걷고 있는 동안, 나는 개 한 마리를 보았다.", options:["saw","see","seeing","was seeing"], answer:"saw", explanation:"[중급] 걷고 있던(진행) 도중에 일어난 사건(단순 과거)은 과거시제를 씁니다." },
  { id:820, topic:"basicTense", en:"Look at the clouds. It ____ rain.", ko:"저 구름 좀 봐. 비가 올 것 같아.", options:["is going to","will","is","was"], answer:"is going to", explanation:"[중급] 현재의 징조(구름)를 보고 미래를 예측할 때는 will보다 be going to가 적절합니다." },
  { id:821, topic:"basicTense", en:"She ____ have a car.", ko:"그녀는 차를 가지고 있지 않다.", options:["doesn't","don't","isn't","didn't"], answer:"doesn't", explanation:"[중급] 일반동사(have)의 현재 부정문은 don't/doesn't를 씁니다." },
  { id:822, topic:"basicTense", en:"We ____ having dinner at 7 p.m. last night.", ko:"우리는 어젯밤 7시에 저녁을 먹고 있었다.", options:["were","are","was","did"], answer:"were", explanation:"[중급] 과거의 구체적인 시간(at 7 p.m. last night)은 과거진행형을 씁니다." },
  { id:823, topic:"basicTense", en:"He ____ like spiders.", ko:"그는 거미를 좋아하지 않는다.", options:["doesn't","isn't","don't","didn't"], answer:"doesn't", explanation:"[중급] like(좋아하다)는 상태동사이므로 진행형(isn't liking)이 아닌 단순시제 부정을 씁니다." },
  { id:824, topic:"basicTense", en:"What ____ you do last weekend?", ko:"지난 주말에 무엇을 했니?", options:["did","do","were","are"], answer:"did", explanation:"[중급] 과거 시점(last weekend)의 의문문은 Did를 씁니다." },
  { id:825, topic:"basicTense", en:"The train ____ at 9 o'clock every morning.", ko:"그 기차는 매일 아침 9시에 떠난다.", options:["leaves","is leaving","left","will leave"], answer:"leaves", explanation:"[중급] 정해진 시간표(스케줄)는 미래의 일이라도 단순 현재시제를 씁니다." },
  { id:826, topic:"basicTense", en:"I will call you when he ____.", ko:"그가 오면 너에게 전화할게.", options:["comes","will come","come","came"], answer:"comes", explanation:"[중급] 시간/조건의 부사절(when)에서는 현재시제가 미래를 대신합니다." },
  { id:827, topic:"basicTense", en:"Where ____ you going now?", ko:"너 지금 어디 가는 중이니?", options:["are","do","did","will"], answer:"are", explanation:"[중급] 현재진행형 의문문: Where + be동사 + 주어 + -ing?" },
  { id:828, topic:"basicTense", en:"He ____ a teacher 5 years ago.", ko:"그는 5년 전에 선생님이었다.", options:["was","is","were","been"], answer:"was", explanation:"[중급] 5년 전(ago)의 상태는 과거시제(was)를 씁니다." },
  { id:829, topic:"basicTense", en:"I ____ to music right now.", ko:"나는 지금 바로 음악을 듣고 있다.", options:["am listening","listen","listened","listening"], answer:"am listening", explanation:"[중급] right now(지금 당장)는 현재진행형과 짝꿍입니다." },
  { id:830, topic:"basicTense", en:"She ____ happy yesterday, but she is sad now.", ko:"그녀는 어제는 행복했지만, 지금은 슬프다.", options:["was","is","were","did"], answer:"was", explanation:"[중급] 과거의 상태(yesterday)는 과거형(was), 현재(now)는 현재형(is)을 써야 합니다." },
// 9. 조동사 (ID: 901 ~ 930) - [번호 정정: 800단위 -> 900단위]
  
  // --- [1] Can / Could (능력, 허가, 요청) - 초급 ---
  { id:901, topic:"modal", en:"I ____ swim very fast.", ko:"나는 수영을 매우 빠르게 할 수 있다.", options:["can","must","should","may"], answer:"can", explanation:"[초급] 능력(할 수 있다)을 나타내는 가장 기본적인 조동사 can." },
  { id:902, topic:"modal", en:"____ you open the window?", ko:"창문 좀 열어주시겠어요?", options:["Can","Must","Should","May"], answer:"Can", explanation:"[초급] 'Can you~?'는 가벼운 부탁이나 요청을 나타냅니다." },
  { id:903, topic:"modal", en:"You ____ use my phone.", ko:"너는 내 전화기를 써도 좋아.", options:["can","must","will","should"], answer:"can", explanation:"[초급] 허가(해도 좋다)의 의미로 쓰인 can (=may)." },
  { id:904, topic:"modal", en:"I ____ ride a bike when I was five.", ko:"나는 5살 때 자전거를 탈 수 있었다.", options:["could","can","may","must"], answer:"could", explanation:"[초급] '과거'의 능력(when I was five)이므로 can의 과거형 could." },
  { id:905, topic:"modal", en:"Penguins ____ fly.", ko:"펭귄은 날 수 없다.", options:["cannot","must not","should not","may not"], answer:"cannot", explanation:"[초급] 능력의 부정(할 수 없다)은 cannot (can't)." },
  // --- [2] May / Might (약한 추측, 허가) - 초급/중급 ---
  { id:906, topic:"modal", en:"____ I go to the bathroom?", ko:"화장실에 가도 될까요?", options:["May","Will","Must","Should"], answer:"May", explanation:"[초급] 격식 있는 허가 요청에는 'May I ~?'를 씁니다." },
  { id:907, topic:"modal", en:"It ____ rain this afternoon.", ko:"오늘 오후에 비가 올지도 모른다.", options:["may","must","should","have to"], answer:"may", explanation:"[초급] 불확실한 약한 추측(~일지도 모른다)은 may 또는 might." },
  { id:908, topic:"modal", en:"He ____ be at home now.", ko:"그는 지금 집에 있을지도 모른다.", options:["might","can","must","should"], answer:"might", explanation:"[중급] may보다 더 불확실한 추측에는 might를 씁니다." },
  { id:909, topic:"modal", en:"You ____ sit here if you want.", ko:"원한다면 여기 앉으셔도 됩니다.", options:["may","must","will","should"], answer:"may", explanation:"[중급] 상대방에게 정중하게 허가할 때 may 사용." },
  { id:910, topic:"modal", en:"The rumor ____ not be true.", ko:"그 소문은 사실이 아닐지도 모른다.", options:["may","must","should","can"], answer:"may", explanation:"[중급] 부정 추측: may not (~아닐지도 모른다)." },
  // --- [3] Must / Have to (의무, 강한 추측) - 중급 ---
  { id:911, topic:"modal", en:"You ____ wear a seatbelt.", ko:"너는 안전벨트를 매야 한다.", options:["must","may","might","could"], answer:"must", explanation:"[중급] 법이나 규칙 같은 강한 의무는 must." },
  { id:912, topic:"modal", en:"She ____ clean her room.", ko:"그녀는 그녀의 방을 청소해야 한다.", options:["has to","have to","musts","had to"], answer:"has to", explanation:"[중급] must와 같은 뜻인 have to는 주어가 3인칭 단수일 때 has to로 씁니다." },
  { id:913, topic:"modal", en:"You ____ be hungry after the hike.", ko:"하이킹 후라 너는 배가 고픔에 틀림없다.", options:["must","should","can","may"], answer:"must", explanation:"[중급] 강한 추측(~임에 틀림없다)의 must." },
  { id:914, topic:"modal", en:"I ____ go to the dentist yesterday.", ko:"나는 어제 치과에 가야만 했다.", options:["had to","must","have to","should"], answer:"had to", explanation:"[중급] must의 과거형은 없으므로 had to를 씁니다." },
  { id:915, topic:"modal", en:"It cannot be true. He ____ be lying.", ko:"그게 사실일 리 없어. 그는 거짓말하고 있는 게 틀림없어.", options:["must","cannot","should","may"], answer:"must", explanation:"[중급] cannot be(~일 리가 없다)의 반대말은 must be(~임에 틀림없다)." },
  // --- [4] Should / Had better (조언, 충고) - 중급 ---
  { id:916, topic:"modal", en:"You ____ brush your teeth.", ko:"너는 이를 닦아야 한다(닦는 게 좋다).", options:["should","may","might","would"], answer:"should", explanation:"[중급] 일반적인 조언이나 충고는 should." },
  { id:917, topic:"modal", en:"We ____ respect old people.", ko:"우리는 노인을 공경해야 한다.", options:["should","may","might","could"], answer:"should", explanation:"[중급] 도덕적 의무나 당연한 일은 should." },
  { id:918, topic:"modal", en:"You ____ not eat too much fast food.", ko:"너는 패스트푸드를 너무 많이 먹지 않는 게 좋다.", options:["should","must","don't","need"], answer:"should", explanation:"[중급] 하지 않는 게 좋겠다는 충고는 should not." },
  { id:919, topic:"modal", en:"You ____ better study hard.", ko:"너는 열심히 공부하는 게 좋을 거다(경고).", options:["had","have","did","were"], answer:"had", explanation:"[중급] should보다 강한 어조의 충고/경고는 'had better'." },
  { id:920, topic:"modal", en:"Drivers ____ to be careful.", ko:"운전자들은 주의해야 한다.", options:["ought","should","must","have"], answer:"ought", explanation:"[중급] ought to는 should와 같은 뜻입니다." },
  // --- [5] Will / Would (미래, 의지, 제안) - 초급/중급 ---
  { id:921, topic:"modal", en:"I ____ be 14 years old next year.", ko:"나는 내년에 14살이 될 것이다.", options:["will","can","must","should"], answer:"will", explanation:"[초급] 단순한 미래를 나타내는 will." },
  { id:922, topic:"modal", en:"____ you like some tea?", ko:"차 좀 드시겠어요?", options:["Would","Will","Can","Should"], answer:"Would", explanation:"[초급] 정중한 제안: Would you like ~?" },
  { id:923, topic:"modal", en:"I ____ do my best.", ko:"나는 최선을 다할 것이다.", options:["will","may","might","could"], answer:"will", explanation:"[중급] 주어의 강한 의지를 나타내는 will." },
  { id:924, topic:"modal", en:"He said he ____ come.", ko:"그는 오겠다고 말했다.", options:["would","will","can","may"], answer:"would", explanation:"[중급] 시제 일치: 주절이 과거(said)이므로 will의 과거형 would 사용." },
  { id:925, topic:"modal", en:"____ you please pass the salt?", ko:"소금 좀 건네주시겠어요?", options:["Would","Should","Must","May"], answer:"Would", explanation:"[중급] 정중한 부탁: Would you ~? (Will you보다 공손)" },
  // --- [6] 헷갈리는 부정문 & 기타 (Must not vs Don't have to) - 고급 ---
  { id:926, topic:"modal", en:"You ____ smoke in the hospital.", ko:"병원에서는 담배를 피우면 안 된다.", options:["must not","don't have to","need not","should not"], answer:"must not", explanation:"[고급] 금지(절대 안 돼)는 must not." },
  { id:927, topic:"modal", en:"You ____ hurry. We have time.", ko:"서두를 필요 없어. 우리 시간 있어.", options:["don't have to","must not","cannot","should not"], answer:"don't have to", explanation:"[고급] 불필요(할 필요 없다)는 don't have to (=need not)." },
  { id:928, topic:"modal", en:"I ____ to go now.", ko:"나는 지금 가야 한다.", options:["have","must","should","can"], answer:"have", explanation:"[고급] 뒤에 to가 있으므로 have to (must to는 불가)." },
  { id:929, topic:"modal", en:"She ____ used to eating spicy food.", ko:"그녀는 매운 음식을 먹는 데 익숙하다.", options:["is","got","used","has"], answer:"is", explanation:"[고급] be used to -ing (~에 익숙하다). 조동사 used to(하곤 했다)와 구별!" },
  { id:930, topic:"modal", en:"I ____ to play soccer when I was young.", ko:"나는 어렸을 때 축구를 하곤 했다.", options:["used","use","would","should"], answer:"used", explanation:"[고급] 과거의 습관: used to + 동사원형." },

  { id:1002, topic:"presentPerfect", en:"She ____ arrived at the airport.", ko:"그녀는 공항에 도착했다.", options:["has","have","is","was"], answer:"has", explanation:"[초급] 주어가 3인칭 단수(She)이므로 has를 씁니다." },

  { id:1004, topic:"presentPerfect", en:"____ you seen this movie?", ko:"이 영화 본 적 있니?", options:["Have","Has","Do","Did"], answer:"Have", explanation:"[초급] 현재완료 의문문은 'Have + 주어 + p.p.'로 시작합니다." },
  { id:1005, topic:"presentPerfect", en:"He has ____ his bag.", ko:"그는 가방을 잃어버렸다.", options:["lost","lose","losing","loses"], answer:"lost", explanation:"[초급] lose(잃어버리다)의 과거분사형은 lost입니다." },
  { id:1006, topic:"presentPerfect", en:"They ____ lived here for 2 years.", ko:"그들은 2년 동안 여기서 살았다.", options:["have","has","are","were"], answer:"have", explanation:"[초급] 주어가 복수(They)이므로 have를 씁니다." },
  { id:1007, topic:"presentPerfect", en:"It ____ stopped raining.", ko:"비가 그쳤다.", options:["has","have","is","was"], answer:"has", explanation:"[초급] 주어가 3인칭 단수(It)이므로 has." },
  { id:1008, topic:"presentPerfect", en:"I ____ not met him yet.", ko:"나는 아직 그를 만나지 못했다.", options:["have","has","did","do"], answer:"have", explanation:"[초급] 현재완료 부정문: have not p.p." },
  { id:1009, topic:"presentPerfect", en:"She has ____ a teacher.", ko:"그녀는 선생님이 되었다.", options:["become","became","becomes","becoming"], answer:"become", explanation:"[초급] become의 과거분사는 원형과 같은 become입니다. (become-became-become)" },
  { id:1010, topic:"presentPerfect", en:"Tom and I ____ been friends.", ko:"톰과 나는 친구로 지내왔다.", options:["have","has","are","were"], answer:"have", explanation:"[초급] 주어가 '톰과 나'(=We) 복수이므로 have." },
  // --- [중급: '경험' & '계속' 용법 (힌트 단어 찾기)] (10문제) ---
  { id:1011, topic:"presentPerfect", en:"Have you ____ visited Paris?", ko:"파리를 방문해 본 적이 있니?", options:["ever","never","yet","just"], answer:"ever", explanation:"[중급-경험] 의문문에서 경험을 물을 때는 'ever'를 씁니다." },
  { id:1012, topic:"presentPerfect", en:"I have ____ eaten insects.", ko:"나는 곤충을 먹어본 적이 없다.", options:["never","ever","yet","already"], answer:"never", explanation:"[중급-경험] '해본 적 없다'는 부정의 경험은 'never'를 씁니다." },
  { id:1013, topic:"presentPerfect", en:"She has met him ____.", ko:"그녀는 전에 그를 만난 적이 있다.", options:["before","ago","yesterday","last year"], answer:"before", explanation:"[중급-경험] 현재완료와 어울리는 '전에'는 before입니다. (ago는 과거시제용)" },
  { id:1014, topic:"presentPerfect", en:"I have seen that movie ____.", ko:"나는 저 영화를 세 번 봤다.", options:["three times","three","thrice time","three time"], answer:"three times", explanation:"[중급-경험] 횟수를 나타내는 표현(once, twice, ~times)은 경험 용법입니다." },
  { id:1015, topic:"presentPerfect", en:"He has been sick ____ yesterday.", ko:"그는 어제부터 아팠다.", options:["since","for","from","at"], answer:"since", explanation:"[중급-계속] 시작 시점(yesterday) 앞에는 since를 씁니다." },
  { id:1016, topic:"presentPerfect", en:"We have known each other ____ 10 years.", ko:"우리는 10년 동안 알고 지냈다.", options:["for","since","during","while"], answer:"for", explanation:"[중급-계속] 숫자로 된 기간(10 years) 앞에는 for를 씁니다." },
  { id:1017, topic:"presentPerfect", en:"How ____ have you stayed here?", ko:"여기 얼마나 오래 머물렀니?", options:["long","often","much","many"], answer:"long", explanation:"[중급-계속] 기간을 묻는 'How long'은 현재완료 계속 용법과 짝꿍입니다." },
  { id:1018, topic:"presentPerfect", en:"I have lived here ____ I was born.", ko:"나는 태어난 이후로 쭉 여기서 살았다.", options:["since","for","when","from"], answer:"since", explanation:"[중급-계속] 'Since + 주어 + 과거동사' 형태로도 쓰입니다." },
  { id:1019, topic:"presentPerfect", en:"He has ____ to America.", ko:"그는 미국에 가본 적이 있다.", options:["been","gone","went","go"], answer:"been", explanation:"[중급-경험] '가본 적 있다'는 have been to입니다. (gone은 가버렸다)" },
  { id:1020, topic:"presentPerfect", en:"I have read this book ____.", ko:"나는 이 책을 한 번 읽어봤다.", options:["once","one","just","yet"], answer:"once", explanation:"[중급-경험] 횟수(한 번)를 나타내는 once." },
  // --- [중급: '완료' & '결과' 용법 및 주의사항] (10문제) ---
  { id:1021, topic:"presentPerfect", en:"I have ____ finished lunch.", ko:"나는 방금 점심을 다 먹었다.", options:["just","yet","ever","never"], answer:"just", explanation:"[중급-완료] '방금/막' 완료했다는 의미는 just." },
  { id:1022, topic:"presentPerfect", en:"He has ____ done his homework.", ko:"그는 이미 숙제를 다 했다.", options:["already","yet","just","still"], answer:"already", explanation:"[중급-완료] 긍정문에서 '이미/벌써'는 already." },
  { id:1023, topic:"presentPerfect", en:"Have you finished it ____?", ko:"그거 벌써 다 끝냈니?", options:["yet","already","just","ever"], answer:"yet", explanation:"[중급-완료] 의문문 끝에서 '벌써'는 yet을 씁니다." },
  { id:1024, topic:"presentPerfect", en:"I haven't decided ____.", ko:"나는 아직 결정하지 못했다.", options:["yet","just","already","never"], answer:"yet", explanation:"[중급-완료] 부정문 끝에서 '아직'은 yet을 씁니다." },
  { id:1025, topic:"presentPerfect", en:"She has ____ her key.", ko:"그녀는 열쇠를 잃어버렸다. (그래서 지금 없다)", options:["lost","loses","losing","lose"], answer:"lost", explanation:"[중급-결과] 과거에 잃어버려서 현재도 없는 상태(결과)." },
  { id:1026, topic:"presentPerfect", en:"He has ____ to London.", ko:"그는 런던으로 떠나버렸다. (여기 없다)", options:["gone","been","went","go"], answer:"gone", explanation:"[중급-결과] '가버리고 없다'는 have gone to." },
  { id:1027, topic:"presentPerfect", en:"Someone has ____ the window.", ko:"누군가 창문을 깼다. (그래서 지금 깨져있다)", options:["broken","broke","breaking","break"], answer:"broken", explanation:"[중급-결과] 깨진 상태가 지속됨을 나타냄." },
  { id:1028, topic:"presentPerfect", en:"I have bought a new car. (의미는?)", ko:"나는 새 차를 샀다.", options:["I have a car now.","I don't have a car.","I sold the car.","I will buy a car."], answer:"I have a car now.", explanation:"[중급-결과] 현재완료는 과거의 행동(샀다)으로 인해 현재(가지고 있다)의 상태를 설명합니다." },
  { id:1029, topic:"presentPerfect", en:"Spring has ____.", ko:"봄이 왔다. (그래서 지금 봄이다)", options:["come","came","coming","comes"], answer:"come", explanation:"[중급-결과] come의 p.p.는 come입니다." },
  { id:1030, topic:"presentPerfect", en:"(오류찾기) I have seen him ____.", ko:"나는 어제 그를 보았다. (어법상 틀린 단어는?)", options:["yesterday","before","once","recently"], answer:"yesterday", explanation:"[중급-주의] yesterday 같은 명백한 과거 부사는 현재완료와 함께 쓸 수 없습니다. (I saw him yesterday가 맞음)" },

  { id:1101, topic:"passive", en:"The window ____ broken by the ball.", ko:"창문이 공에 의해 깨졌다.", options:["was","did","has","is"], answer:"was", explanation:"[초급] 과거 시점의 수동태이며 주어가 단수(Window)이므로 was." },
  { id:1102, topic:"passive", en:"The room is ____ every day.", ko:"그 방은 매일 청소된다.", options:["cleaned","clean","cleans","cleaning"], answer:"cleaned", explanation:"[초급] 수동태 공식: be동사 + 과거분사(p.p.)." },
  { id:1103, topic:"passive", en:"This book was ____ by J.K. Rowling.", ko:"이 책은 J.K. 롤링에 의해 쓰였다.", options:["written","wrote","write","writing"], answer:"written", explanation:"[초급] write(쓰다)의 과거분사는 written입니다." },
  { id:1104, topic:"passive", en:"English is ____ in many countries.", ko:"영어는 많은 나라에서 쓰인다(말해진다).", options:["spoken","spoke","speak","speaking"], answer:"spoken", explanation:"[초급] speak(말하다)의 과거분사는 spoken입니다." },
  { id:1105, topic:"passive", en:"The car is ____ by my dad.", ko:"그 차는 아빠에 의해 세차된다.", options:["washed","wash","washes","washing"], answer:"washed", explanation:"[초급] 규칙 동사 wash의 과거분사는 washed." },
  { id:1106, topic:"passive", en:"The cake was ____ by mom.", ko:"그 케이크는 엄마에 의해 만들어졌다.", options:["made","make","making","makes"], answer:"made", explanation:"[초급] make(만들다)의 과거분사는 made." },
  { id:1107, topic:"passive", en:"The letter was ____ yesterday.", ko:"그 편지는 어제 보내졌다.", options:["sent","send","sending","sends"], answer:"sent", explanation:"[초급] send(보내다)의 과거분사는 sent." },
  { id:1108, topic:"passive", en:"The house was ____ last year.", ko:"그 집은 작년에 지어졌다.", options:["built","build","building","builds"], answer:"built", explanation:"[초급] build(짓다)의 과거분사는 built." },
  { id:1109, topic:"passive", en:"This picture was ____ by Picasso.", ko:"이 그림은 피카소에 의해 그려졌다.", options:["painted","paint","painting","paints"], answer:"painted", explanation:"[초급] paint(그리다)의 과거분사는 painted." },
  { id:1110, topic:"passive", en:"Homework is ____ by students.", ko:"숙제는 학생들에 의해 행해진다.", options:["done","do","did","doing"], answer:"done", explanation:"[초급] do(하다)의 과거분사는 done." },
  { id:1111, topic:"passive", en:"The door was ____.", ko:"문이 열렸다.", options:["opened","open","opening","opens"], answer:"opened", explanation:"[초급] open(열다)의 수동태는 be opened." },
  { id:1112, topic:"passive", en:"Computers are ____ everywhere.", ko:"컴퓨터는 어디서나 사용된다.", options:["used","use","using","uses"], answer:"used", explanation:"[초급] use(사용하다)의 수동태는 be used." },
  { id:1113, topic:"passive", en:"The song was ____ by BTS.", ko:"그 노래는 BTS에 의해 불려졌다.", options:["sung","sang","sing","singing"], answer:"sung", explanation:"[초급] sing(노래하다)의 3단 변화: sing-sang-sung." },
  { id:1114, topic:"passive", en:"Cheese is ____ from milk.", ko:"치즈는 우유로 만들어진다.", options:["made","make","making","makes"], answer:"made", explanation:"[초급] be made from (~로 만들어지다)." },
  { id:1115, topic:"passive", en:"We were ____ to the party.", ko:"우리는 파티에 초대되었다.", options:["invited","invite","inviting","invites"], answer:"invited", explanation:"[초급] invite(초대하다)의 수동태 be invited." },
  { id:1116, topic:"passive", en:"The box was ____ to the table.", ko:"그 상자는 탁자로 옮겨졌다.", options:["moved","move","moving","moves"], answer:"moved", explanation:"[초급] move(옮기다)의 수동태 be moved." },
  { id:1117, topic:"passive", en:"Flowers are ____ in the morning.", ko:"꽃들은 아침에 물이 주어진다.", options:["watered","water","watering","waters"], answer:"watered", explanation:"[초급] water가 동사로 쓰이면 '물을 주다'입니다." },
  { id:1118, topic:"passive", en:"The bike was ____ by him.", ko:"그 자전거는 그에 의해 고쳐졌다.", options:["fixed","fix","fixing","fixes"], answer:"fixed", explanation:"[초급] fix(고치다)의 수동태 be fixed." },
  { id:1119, topic:"passive", en:"I am ____ by my parents.", ko:"나는 부모님께 사랑받는다.", options:["loved","love","loving","loves"], answer:"loved", explanation:"[초급] love(사랑하다)의 수동태 be loved." },
  { id:1120, topic:"passive", en:"A mouse was ____ by the cat.", ko:"쥐 한 마리가 고양이에게 잡혔다.", options:["caught","catch","catching","catches"], answer:"caught", explanation:"[초급] catch(잡다)의 과거분사는 caught." },
  // --- [중급: 시제 확장(미래/진행/완료) & 관용 표현] (10문제) ---
  { id:1121, topic:"passive", en:"The work will ____ finished soon.", ko:"그 일은 곧 끝마쳐질 것이다.", options:["be","is","was","been"], answer:"be", explanation:"[중급] 미래 수동태: 조동사 will 뒤에는 동사원형 be가 옵니다." },
  { id:1122, topic:"passive", en:"The bridge is ____ built now.", ko:"그 다리는 지금 지어지는 중이다.", options:["being","be","been","is"], answer:"being", explanation:"[중급] 진행 수동태: be + being + p.p. (~되는 중이다)." },
  { id:1123, topic:"passive", en:"The problem can ____ solved.", ko:"그 문제는 해결될 수 있다.", options:["be","is","was","been"], answer:"be", explanation:"[중급] 조동사(can)가 있는 수동태: 조동사 + be + p.p." },
  { id:1124, topic:"passive", en:"The car has ____ repaired.", ko:"그 차는 수리되었다(완료).", options:["been","be","being","was"], answer:"been", explanation:"[중급] 완료 수동태: have/has + been + p.p." },
  { id:1125, topic:"passive", en:"I am interested ____ history.", ko:"나는 역사에 관심이 있다.", options:["in","at","on","by"], answer:"in", explanation:"[중급] 관용구: be interested in (by를 쓰지 않음)." },
  { id:1126, topic:"passive", en:"The mountain is covered ____ snow.", ko:"산은 눈으로 덮여 있다.", options:["with","by","in","at"], answer:"with", explanation:"[중급] 관용구: be covered with (~로 덮이다)." },
  { id:1127, topic:"passive", en:"The bottle is filled ____ water.", ko:"병은 물로 가득 차 있다.", options:["with","of","in","by"], answer:"with", explanation:"[중급] 관용구: be filled with (~로 가득 차다)." },
  { id:1128, topic:"passive", en:"The room was ____ cleaned yesterday.", ko:"그 방은 어제 청소되지 않았다.", options:["not","no","never","don't"], answer:"not", explanation:"[중급] 수동태의 부정문: be동사 뒤에 not을 붙입니다." },
  { id:1129, topic:"passive", en:"When ____ Hangeul invented?", ko:"한글은 언제 창제되었나요?", options:["was","is","did","were"], answer:"was", explanation:"[중급] 수동태 의문문: 의문사 + be동사 + 주어 + p.p.?" },
  { id:1130, topic:"passive", en:"Stars can be ____ at night.", ko:"별들은 밤에 볼 수 있다(보여진다).", options:["seen","see","saw","seeing"], answer:"seen", explanation:"[중급] 조동사 can + be + p.p.(seen)." },
// 12. 전치사 (ID: 1201 ~ 1240) - [번호 정정: 1100단위 -> 1200단위]
  
  // --- [초급: 기초 시간/장소/방향] (20문제) ---
  { id:1201, topic:"preposition", en:"See you ____ Monday.", ko:"월요일에 보자.", options:["on","at","in","to"], answer:"on", explanation:"[초급] 요일이나 특정한 날짜 앞에는 on을 씁니다." },
  { id:1202, topic:"preposition", en:"The meeting is ____ 5 p.m.", ko:"회의는 오후 5시에 있다.", options:["at","on","in","for"], answer:"at", explanation:"[초급] 구체적인 시각(몇 시) 앞에는 at을 씁니다." },
  { id:1203, topic:"preposition", en:"My birthday is ____ May.", ko:"내 생일은 5월이다.", options:["in","on","at","of"], answer:"in", explanation:"[초급] 월(Month), 계절, 연도 앞에는 in을 씁니다." },
  { id:1204, topic:"preposition", en:"Put the cup ____ the table.", ko:"컵을 탁자 위에 놓아라.", options:["on","in","at","to"], answer:"on", explanation:"[초급] 표면에 접촉해서 위에 있을 때는 on." },
  { id:1205, topic:"preposition", en:"He is ____ the room.", ko:"그는 방 안에 있다.", options:["in","on","at","to"], answer:"in", explanation:"[초급] 공간의 내부(안에)는 in." },
  { id:1206, topic:"preposition", en:"The cat is ____ the chair.", ko:"고양이가 의자 아래에 있다.", options:["under","on","in","up"], answer:"under", explanation:"[초급] 바로 아래쪽은 under." },
  { id:1207, topic:"preposition", en:"I go ____ school by bus.", ko:"나는 버스를 타고 학교에 간다.", options:["to","at","on","in"], answer:"to", explanation:"[초급] 방향/도착지(~로)를 나타낼 때는 to." },
  { id:1208, topic:"preposition", en:"She is standing ____ me.", ko:"그녀는 내 옆에 서 있다.", options:["next to","next","near to","on"], answer:"next to", explanation:"[초급] '~의 옆에'는 next to." },
  { id:1209, topic:"preposition", en:"Look ____ the blackboard.", ko:"칠판을 봐라.", options:["at","on","in","to"], answer:"at", explanation:"[초급] 'Look at'은 '~을 보다'라는 짝꿍 표현입니다." },
  { id:1210, topic:"preposition", en:"We play soccer ____ the afternoon.", ko:"우리는 오후에 축구를 한다.", options:["in","at","on","for"], answer:"in", explanation:"[초급] 하루의 때(morning, afternoon, evening)는 in을 씁니다." },
  { id:1211, topic:"preposition", en:"I sleep ____ night.", ko:"나는 밤에 잔다.", options:["at","in","on","to"], answer:"at", explanation:"[초급] 예외: '밤에'는 in the night이 아니라 at night을 씁니다." },
  { id:1212, topic:"preposition", en:"There is a tree ____ front of the house.", ko:"집 앞에 나무가 있다.", options:["in","at","on","to"], answer:"in", explanation:"[초급] '~의 앞에'는 in front of." },
  { id:1213, topic:"preposition", en:"He is hiding ____ the door.", ko:"그는 문 뒤에 숨어 있다.", options:["behind","under","in","on"], answer:"behind", explanation:"[초급] '~의 뒤에'는 behind." },
  { id:1214, topic:"preposition", en:"I usually get up ____ 7 o'clock.", ko:"나는 보통 7시에 일어난다.", options:["at","on","in","to"], answer:"at", explanation:"[초급] 시각 앞에는 at." },
  { id:1215, topic:"preposition", en:"Birds fly ____ the sky.", ko:"새들이 하늘을(하늘 안에서) 난다.", options:["in","on","at","to"], answer:"in", explanation:"[초급] 하늘이라는 공간 안에서 날기 때문에 in." },
  { id:1216, topic:"preposition", en:"He goes to work ____ car.", ko:"그는 차를 타고 출근한다.", options:["by","in","on","with"], answer:"by", explanation:"[초급] 교통수단은 'by + 교통수단(관사 없음)'." },
  { id:1217, topic:"preposition", en:"I sit ____ Tom and Jerry.", ko:"나는 톰과 제리 사이에 앉는다.", options:["between","among","in","at"], answer:"between", explanation:"[초급] 둘 사이는 between." },
  { id:1218, topic:"preposition", en:"The apple is ____ the box.", ko:"사과가 상자 안에 있다.", options:["in","on","at","to"], answer:"in", explanation:"[초급] 내부 공간 in." },
  { id:1219, topic:"preposition", en:"Let's meet ____ Sunday.", ko:"일요일에 만나자.", options:["on","in","at","to"], answer:"on", explanation:"[초급] 요일 앞에는 on." },
  { id:1220, topic:"preposition", en:"Summer starts ____ June.", ko:"여름은 6월에 시작한다.", options:["in","on","at","to"], answer:"in", explanation:"[초급] 달(Month) 앞에는 in." },
  // --- [중급: 기간/완료/숙어/뉘앙스 차이] (20문제) ---
  { id:1221, topic:"preposition", en:"I have lived here ____ 3 years.", ko:"나는 여기서 3년 동안 살았다.", options:["for","during","while","since"], answer:"for", explanation:"[중급] '숫자'로 된 기간 앞에는 for를 씁니다." },
  { id:1222, topic:"preposition", en:"I fell asleep ____ the movie.", ko:"나는 영화 보는 동안 잠이 들었다.", options:["during","for","while","at"], answer:"during", explanation:"[중급] '특정한 사건/명사' 기간 동안은 during." },
  { id:1223, topic:"preposition", en:"Finish your homework ____ 6 p.m.", ko:"오후 6시까지 숙제를 끝내라.", options:["by","until","to","on"], answer:"by", explanation:"[중급] 마감 기한(완료)을 나타낼 때는 by." },
  { id:1224, topic:"preposition", en:"I will wait ____ you come back.", ko:"네가 돌아올 때까지 기다릴게.", options:["until","by","to","on"], answer:"until", explanation:"[중급] 동작이 그때까지 '계속'될 때는 until." },
  { id:1225, topic:"preposition", en:"He is interested ____ science.", ko:"그는 과학에 흥미가 있다.", options:["in","on","at","with"], answer:"in", explanation:"[중급] 숙어: be interested in (~에 흥미가 있다)." },
  { id:1226, topic:"preposition", en:"She is good ____ math.", ko:"그녀는 수학을 잘한다.", options:["at","in","on","for"], answer:"at", explanation:"[중급] 숙어: be good at (~을 잘하다)." },
  { id:1227, topic:"preposition", en:"This desk is made ____ wood.", ko:"이 책상은 나무로 만들어졌다.", options:["of","from","by","in"], answer:"of", explanation:"[중급] 물리적 변화(재료의 성질 유지)는 be made of." },
  { id:1228, topic:"preposition", en:"Cheese is made ____ milk.", ko:"치즈는 우유로 만들어진다.", options:["from","of","by","with"], answer:"from", explanation:"[중급] 화학적 변화(성질이 바뀜)는 be made from." },
  { id:1229, topic:"preposition", en:"I am looking ____ my lost key.", ko:"나는 잃어버린 열쇠를 찾고 있다.", options:["for","at","after","to"], answer:"for", explanation:"[중급] look for (~을 찾다)." },
  { id:1230, topic:"preposition", en:"Please listen ____ me.", ko:"내 말을 들어봐.", options:["to","at","on","for"], answer:"to", explanation:"[중급] listen to (~을 듣다)." },
  { id:1231, topic:"preposition", en:"He walked ____ the street.", ko:"그는 길을 건너갔다.", options:["across","through","along","over"], answer:"across", explanation:"[중급] 평면을 가로질러 건너는 것은 across." },
  { id:1232, topic:"preposition", en:"The train went ____ the tunnel.", ko:"기차가 터널을 통과해 지나갔다.", options:["through","across","over","into"], answer:"through", explanation:"[중급] 입체적인 공간을 관통할 때는 through." },
  { id:1233, topic:"preposition", en:"We walked ____ the river.", ko:"우리는 강을 따라 걸었다.", options:["along","across","through","with"], answer:"along", explanation:"[중급] 긴 선을 따라가는 것은 along." },
  { id:1234, topic:"preposition", en:"I agree ____ you.", ko:"나는 네 말에 동의해.", options:["with","to","on","at"], answer:"with", explanation:"[중급] 사람에게 동의할 때는 agree with." },
  { id:1235, topic:"preposition", en:"He is afraid ____ dogs.", ko:"그는 개를 무서워한다.", options:["of","at","with","on"], answer:"of", explanation:"[중급] 숙어: be afraid of (~을 두려워하다)." },
  { id:1236, topic:"preposition", en:"I am proud ____ you.", ko:"나는 네가 자랑스럽다.", options:["of","in","at","on"], answer:"of", explanation:"[중급] 숙어: be proud of (~을 자랑스러워하다)." },
  { id:1237, topic:"preposition", en:"The bird flew ____ the mountain.", ko:"새가 산 위로(넘어서) 날아갔다.", options:["over","on","in","under"], answer:"over", explanation:"[중급] 접촉하지 않고 바로 위를 넘어가면 over." },
  { id:1238, topic:"preposition", en:"He sat ____ the students.", ko:"그는 학생들 사이에(무리에 섞여) 앉았다.", options:["among","between","in","at"], answer:"among", explanation:"[중급] 셋 이상 사이(무리)는 among." },
  { id:1239, topic:"preposition", en:"Write in pencil, not ____ ink.", ko:"잉크 말고 연필로 써라.", options:["in","by","with","on"], answer:"in", explanation:"[중급] 언어나 재료(잉크 등)로 쓸 때는 in을 씁니다." },
  { id:1240, topic:"preposition", en:"Korea is different ____ America.", ko:"한국은 미국과 다르다.", options:["from","with","to","than"], answer:"from", explanation:"[중급] be different from (~와 다르다)." }, 
  // 13. 접속사 (ID: 1301 ~ 1399)
  { id:1301, topic:"conjunction", en:"I like apples, ____ I don't like bananas.", ko:"나는 사과는 좋아하지만 바나나는 좋아하지 않는다.", options:["but","and","so","or"], answer:"but", explanation:"앞뒤 내용이 반대되므로 but." },
  { id:1302, topic:"conjunction", en:"It was raining, ____ I stayed home.", ko:"비가 왔다, 그래서 나는 집에 있었다.", options:["so","because","but","if"], answer:"so", explanation:"인과 관계(원인->결과)는 so." },
  { id:1303, topic:"conjunction", en:"____ you are busy, I will go alone.", ko:"네가 바쁘기 때문에, 나 혼자 갈게.", options:["Because","Although","If","Before"], answer:"Because", explanation:"이유를 나타내는 접속사 Because." },
  { id:1304, topic:"conjunction", en:"Wait here ____ I come back.", ko:"내가 돌아올 때까지 기다려.", options:["until","if","because","so"], answer:"until", explanation:"시간의 한계(~까지)는 until." },
  { id:1305, topic:"conjunction", en:"Study hard, ____ you will pass.", ko:"열심히 공부해라, 그러면 합격할 것이다.", options:["and","or","but","so"], answer:"and", explanation:"명령문 + and (~해라, 그러면)." },
  { id:1306, topic:"conjunction", en:"Hurry up, ____ you will be late.", ko:"서둘러라, 그렇지 않으면 늦을 것이다.", options:["or","and","but","so"], answer:"or", explanation:"명령문 + or (~해라, 그렇지 않으면)." },
  { id:1307, topic:"conjunction", en:"I was tired, ____ I went to bed early.", ko:"나는 피곤해서 일찍 잠자리에 들었다.", options:["so","but","or","and"], answer:"so", explanation:"원인→결과를 연결하는 접속사 so." },
  { id:1308, topic:"conjunction", en:"He is rich ____ not happy.", ko:"그는 부자이지만 행복하지는 않다.", options:["but","and","so","or"], answer:"but", explanation:"대조/반전을 나타내는 접속사 but." },
  { id:1309, topic:"conjunction", en:"____ it was cold, she wore a T-shirt.", ko:"추웠지만 그녀는 티셔츠를 입었다.", options:["Although","Because","If","When"], answer:"Although", explanation:"양보(~에도 불구하고)를 나타내는 접속사 Although." },
  { id:1310, topic:"conjunction", en:"I will stay home ____ it rains.", ko:"비가 오면 나는 집에 있을 것이다.", options:["if","because","although","so"], answer:"if", explanation:"조건(만약 ~라면)을 나타내는 접속사 if." },
  { id:1311, topic:"conjunction", en:"____ I was sleeping, the phone rang.", ko:"내가 자고 있는 동안 전화가 울렸다.", options:["While","Because","If","So"], answer:"While", explanation:"동시 진행(~하는 동안)을 나타내는 접속사 While." },
  { id:1312, topic:"conjunction", en:"Wash your hands ____ you eat.", ko:"먹기 전에 손을 씻어라.", options:["before","after","while","until"], answer:"before", explanation:"시간 순서(~하기 전에)를 나타내는 접속사 before." },
  { id:1313, topic:"conjunction", en:"I went home ____ the class ended.", ko:"수업이 끝난 후에 나는 집에 갔다.", options:["after","before","while","until"], answer:"after", explanation:"시간 순서(~한 후에)를 나타내는 접속사 after." },
  { id:1314, topic:"conjunction", en:"She likes tea ____ coffee.", ko:"그녀는 차와 커피를 좋아한다.", options:["and","but","or","so"], answer:"and", explanation:"병렬 연결(~와/과)을 나타내는 접속사 and." },
  { id:1315, topic:"conjunction", en:"Do you want juice ____ milk?", ko:"주스를 원하니 아니면 우유를 원하니?", options:["or","and","but","so"], answer:"or", explanation:"선택(~또는)을 나타내는 접속사 or." },
  { id:1316, topic:"conjunction", en:"He didn't come ____ he was sick.", ko:"그는 아파서 오지 않았다.", options:["because","although","if","so"], answer:"because", explanation:"이유(~때문에)를 나타내는 접속사 because." },
  { id:1317, topic:"conjunction", en:"I will call you ____ I arrive.", ko:"도착하자마자 너에게 전화할게.", options:["as soon as","while","before","until"], answer:"as soon as", explanation:"즉시(~하자마자)를 나타내는 접속사 as soon as." },
  { id:1318, topic:"conjunction", en:"You can't go out ____ you finish homework.", ko:"숙제를 끝내지 않으면 나갈 수 없다.", options:["unless","if","because","although"], answer:"unless", explanation:"unless = if ~ not (~하지 않는 한)." },
  { id:1319, topic:"conjunction", en:"____ he is young, he is very wise.", ko:"비록 어리지만 그는 매우 현명하다.", options:["Though","Because","If","When"], answer:"Though", explanation:"양보(비록 ~이지만)를 나타내는 접속사 Though (=Although)." },
  { id:1320, topic:"conjunction", en:"I have lived here ____ I was born.", ko:"나는 태어난 이후로 여기에 살았다.", options:["since","for","while","until"], answer:"since", explanation:"시간의 시작점(~이래로)을 나타내는 접속사 since." },
  { id:1321, topic:"conjunction", en:"He studied hard ____ he could pass.", ko:"합격할 수 있도록 그는 열심히 공부했다.", options:["so that","because","although","unless"], answer:"so that", explanation:"목적(~하기 위해서)을 나타내는 접속사 so that." },
  { id:1322, topic:"conjunction", en:"She talks ____ she knows everything.", ko:"그녀는 마치 모든 것을 아는 것처럼 말한다.", options:["as if","because","so that","unless"], answer:"as if", explanation:"가정적 비유(마치 ~인 것처럼)를 나타내는 접속사 as if." },
  { id:1323, topic:"conjunction", en:"____ rich nor poor, he was content.", ko:"부자도 가난하지도 않았지만 만족했다.", options:["Neither","Either","Both","Not only"], answer:"Neither", explanation:"Neither A nor B (A도 B도 아닌)." },
  { id:1324, topic:"conjunction", en:"____ you study or not, it's your choice.", ko:"공부하든 안 하든, 그건 네 선택이다.", options:["Whether","If","Because","Although"], answer:"Whether", explanation:"Whether A or B (~이든 아니든)." },
  { id:1325, topic:"conjunction", en:"He is not only smart ____ also kind.", ko:"그는 똑똑할 뿐만 아니라 친절하기도 하다.", options:["but","and","or","so"], answer:"but", explanation:"not only A but also B (A뿐만 아니라 B도)." },
  { id:1326, topic:"conjunction", en:"Both Tom ____ Jerry are friends.", ko:"톰과 제리 둘 다 친구이다.", options:["and","or","but","nor"], answer:"and", explanation:"Both A and B (A와 B 둘 다)." },
  { id:1327, topic:"conjunction", en:"____ you leave, turn off the lights.", ko:"떠나기 전에 불을 꺼라.", options:["Before","After","While","Since"], answer:"Before", explanation:"시간(~하기 전에) 접속사 Before." },
  { id:1328, topic:"conjunction", en:"I like him ____ he is honest.", ko:"나는 그가 정직하기 때문에 좋아한다.", options:["because","although","unless","if"], answer:"because", explanation:"이유를 나타내는 접속사 because." },
  { id:1329, topic:"conjunction", en:"____ it rained heavily, the game continued.", ko:"비가 많이 왔음에도 불구하고 경기는 계속되었다.", options:["Even though","Because","So that","Unless"], answer:"Even though", explanation:"강한 양보(~에도 불구하고)를 나타내는 접속사 Even though." },
  { id:1330, topic:"conjunction", en:"I will wait ____ she comes back.", ko:"그녀가 돌아올 때까지 기다리겠다.", options:["until","while","since","before"], answer:"until", explanation:"시간의 끝(~까지)을 나타내는 접속사 until." },
  // 13. 관계대명사 (ID: 1401 ~ 1440) - [번호 정정: 1300단위 -> 1400단위]
  
  // --- [초급: 선행사(사람/사물) 구별 및 기본 주격/목적격] (15문제) ---
  { id:1401, topic:"relative", en:"I met a girl ____ is very kind.", ko:"나는 매우 친절한 소녀를 만났다.", options:["who","which","whose","what"], answer:"who", explanation:"[초급] 선행사가 사람(girl)이고 뒤에 동사(is)가 오므로 주격 'who'입니다." },
  { id:1402, topic:"relative", en:"This is the book ____ I bought.", ko:"이것은 내가 샀던 책이다.", options:["which","who","whom","whose"], answer:"which", explanation:"[초급] 선행사가 사물(book)이므로 'which'를 씁니다." },
  { id:1403, topic:"relative", en:"I have a dog ____ runs fast.", ko:"나는 빨리 달리는 개를 가지고 있다.", options:["that","who","whom","what"], answer:"that", explanation:"[초급] 동물은 'which'나 'that'을 씁니다." },
  { id:1404, topic:"relative", en:"Look at the man ____ is dancing.", ko:"춤추고 있는 저 남자를 봐라.", options:["who","which","whose","what"], answer:"who", explanation:"[초급] 선행사가 사람(man)이므로 'who'." },
  { id:1405, topic:"relative", en:"The car ____ is red is mine.", ko:"빨간색인 그 차는 내 것이다.", options:["which","who","whom","whose"], answer:"which", explanation:"[초급] 선행사가 사물(car)이므로 'which'." },
  { id:1406, topic:"relative", en:"Do you know the boy ____ likes pizza?", ko:"피자를 좋아하는 저 소년을 아니?", options:["that","which","whose","what"], answer:"that", explanation:"[초급] 사람 선행사(boy)에는 'who' 또는 'that'을 쓸 수 있습니다." },
  { id:1407, topic:"relative", en:"The cake ____ my mom made is delicious.", ko:"엄마가 만든 케이크는 맛있다.", options:["which","who","whom","what"], answer:"which", explanation:"[초급] 선행사가 사물(cake)이므로 'which'." },
  { id:1408, topic:"relative", en:"He is the teacher ____ teaches English.", ko:"그는 영어를 가르치는 선생님이다.", options:["who","which","what","whose"], answer:"who", explanation:"[초급] 선행사가 사람(teacher)이므로 'who'." },
  { id:1409, topic:"relative", en:"I saw a movie ____ was very sad.", ko:"나는 매우 슬픈 영화를 보았다.", options:["that","who","whom","whose"], answer:"that", explanation:"[초급] 사물 선행사(movie)에는 'which' 또는 'that'." },
  { id:1410, topic:"relative", en:"This is the house ____ Jack built.", ko:"이것은 잭이 지은 집이다.", options:["which","who","whom","what"], answer:"which", explanation:"[초급] 선행사가 사물(house)이므로 'which'." },
  { id:1411, topic:"relative", en:"The student ____ studies hard will pass.", ko:"열심히 공부하는 학생은 합격할 것이다.", options:["who","which","what","whose"], answer:"who", explanation:"[초급] 사람(student) 주격 관계대명사 'who'." },
  { id:1412, topic:"relative", en:"I lost the pen ____ you gave me.", ko:"나는 네가 준 펜을 잃어버렸다.", options:["that","who","whom","what"], answer:"that", explanation:"[초급] 사물(pen) 목적격 관계대명사 'that' (또는 which)." },
  { id:1413, topic:"relative", en:"The robot ____ can walk is expensive.", ko:"걸을 수 있는 그 로봇은 비싸다.", options:["which","who","whom","whose"], answer:"which", explanation:"[초급] 사물(robot) 주격 관계대명사 'which'." },
  { id:1414, topic:"relative", en:"Where is the girl ____ called you?", ko:"너에게 전화했던 소녀는 어디 있니?", options:["who","which","whose","whom"], answer:"who", explanation:"[초급] 사람(girl) 주격 관계대명사 'who'." },
  { id:1415, topic:"relative", en:"I like the picture ____ hangs on the wall.", ko:"나는 벽에 걸린 그 그림을 좋아한다.", options:["which","who","whom","what"], answer:"which", explanation:"[초급] 사물(picture) 주격 관계대명사 'which'." },
  // --- [중급: 소유격, What, That의 특별용법, 생략] (15문제) ---
  { id:1416, topic:"relative", en:"I met a man ____ name is Tom.", ko:"나는 이름이 톰인 남자를 만났다.", options:["whose","who","whom","which"], answer:"whose", explanation:"[중급] '그 남자의 이름'이므로 소유격 'whose'가 필요합니다." },
  { id:1417, topic:"relative", en:"This is ____ I want.", ko:"이것이 내가 원하는 것이다.", options:["what","that","which","who"], answer:"what", explanation:"[중급] 선행사가 없고 '~하는 것'으로 해석되므로 'what'입니다." },
  { id:1418, topic:"relative", en:"Do you understand ____ I said?", ko:"내가 말한 것을 이해하니?", options:["what","that","which","who"], answer:"what", explanation:"[중급] 선행사를 포함한 관계대명사 'what' (the thing which)." },
  { id:1419, topic:"relative", en:"Look at the house ____ roof is red.", ko:"지붕이 빨간 저 집을 봐라.", options:["whose","which","who","that"], answer:"whose", explanation:"[중급] 사물의 소유격도 'whose'를 씁니다. (그 집의 지붕)." },
  { id:1420, topic:"relative", en:"He is the only friend ____ I trust.", ko:"그는 내가 믿는 유일한 친구다.", options:["that","who","whom","which"], answer:"that", explanation:"[중급] 선행사에 'the only'가 있으면 'that'을 선호합니다." },
  { id:1421, topic:"relative", en:"This is the best movie ____ I have ever seen.", ko:"이것은 내가 본 최고의 영화다.", options:["that","which","who","what"], answer:"that", explanation:"[중급] 최상급(the best) 수식을 받으면 'that'을 주로 씁니다." },
  { id:1422, topic:"relative", en:"Look at the boy and the dog ____ are running.", ko:"뛰고 있는 소년과 개를 봐라.", options:["that","who","which","whom"], answer:"that", explanation:"[중급] 선행사가 '사람+동물'일 때는 'that'을 씁니다." },
  { id:1423, topic:"relative", en:"Tell me ____ happened.", ko:"무슨 일이 있었는지(일어난 것을) 말해줘.", options:["what","that","which","who"], answer:"what", explanation:"[중급] 선행사가 없으므로 'what'." },
  { id:1424, topic:"relative", en:"I have a friend ____ lives in NY.", ko:"나는 뉴욕에 사는 친구가 있다.", options:["who","whose","whom","which"], answer:"who", explanation:"[중급] 주격 관계대명사는 생략할 수 없습니다." },
  { id:1425, topic:"relative", en:"The girl ____ I met yesterday was smart.", ko:"내가 어제 만난 소녀는 똑똑했다.", options:["whom","whose","which","what"], answer:"whom", explanation:"[중급] 목적격 관계대명사(whom/who/that) 자리입니다. 생략도 가능합니다." },
  { id:1426, topic:"relative", en:"Everything ____ glitters is not gold.", ko:"반짝인다고 다 금은 아니다.", options:["that","what","which","who"], answer:"that", explanation:"[중급] 선행사가 -thing으로 끝나는 부정대명사일 때 'that'을 씁니다." },
  { id:1427, topic:"relative", en:"Is this the book ____ cover is torn?", ko:"표지가 찢어진 책이 이건가요?", options:["whose","who","which","that"], answer:"whose", explanation:"[중급] '그 책의 표지' = 소유격 'whose'." },
  { id:1428, topic:"relative", en:"____ makes me happy is music.", ko:"나를 행복하게 만드는 것은 음악이다.", options:["What","That","Which","Who"], answer:"What", explanation:"[중급] 주어 자리에 쓰인 관계대명사 What (~하는 것)." },
  { id:1429, topic:"relative", en:"There is no one ____ likes him.", ko:"그를 좋아하는 사람은 아무도 없다.", options:["that","what","which","whose"], answer:"that", explanation:"[중급] 선행사가 사람(no one)이지만 부정대명사이므로 that을 주로 씁니다." },
  { id:1430, topic:"relative", en:"This is the very ring ____ I lost.", ko:"이게 바로 내가 잃어버린 그 반지다.", options:["that","what","who","whose"], answer:"that", explanation:"[중급] 'the very(바로 그)'가 선행사를 꾸미면 'that'을 씁니다." },
  // --- [고급: 전치사+관계사, 계속적 용법, 복합관계사] (10문제) ---
  { id:1431, topic:"relative", en:"This is the house ____ I live.", ko:"이곳은 내가 사는 집이다.", options:["in which","which","that","who"], answer:"in which", explanation:"[고급] live in the house이므로 전치사 in이 앞으로 나와 'in which'가 됩니다. (=where)" },
  { id:1432, topic:"relative", en:"He is the man ____ whom I talked.", ko:"그는 내가 함께 이야기했던 남자다.", options:["with","at","on","in"], answer:"with", explanation:"[고급] talk with(~와 이야기하다) -> with whom." },
  { id:1433, topic:"relative", en:"I have two sons, ____ are doctors.", ko:"나는 아들이 둘 있는데, (그들은 모두) 의사이다.", options:["who","that","what","which"], answer:"who", explanation:"[고급] 콤마(,) 뒤의 계속적 용법에는 'that'을 쓸 수 없습니다. 사람이므로 'who'." },
  { id:1434, topic:"relative", en:"He said nothing, ____ made her angry.", ko:"그는 아무 말도 하지 않았는데, 그것이 그녀를 화나게 했다.", options:["which","that","what","who"], answer:"which", explanation:"[고급] 앞 문장 전체를 선행사로 받는 계속적 용법 'which'." },
  { id:1435, topic:"relative", en:"This is the chair on ____ I sat.", ko:"이것은 내가 앉았던 의자다.", options:["which","that","who","where"], answer:"which", explanation:"[고급] 전치사(on) 뒤에는 관계대명사 'that'을 쓸 수 없습니다." },
  { id:1436, topic:"relative", en:"She has many books, some of ____ are old.", ko:"그녀는 책이 많은데, 그중 몇 권은 낡았다.", options:["which","them","that","who"], answer:"which", explanation:"[고급] 접속사가 없으므로 대명사(them) 대신 관계대명사(which)를 써야 문장이 연결됩니다." },
  { id:1437, topic:"relative", en:"There are many students, most of ____ are smart.", ko:"학생들이 많은데, 그들 대부분은 똑똑하다.", options:["whom","them","who","that"], answer:"whom", explanation:"[고급] 전치사(of) 뒤이므로 목적격 'whom'을 써야 합니다." },
  { id:1438, topic:"relative", en:"____ comes is welcome.", ko:"오는 사람은 누구든지 환영한다.", options:["Whoever","Who","Whatever","Which"], answer:"Whoever", explanation:"[고급] 'Anyone who'의 의미를 가진 복합관계대명사 'Whoever'." },
  { id:1439, topic:"relative", en:"You can take ____ you want.", ko:"네가 원하는 것은 무엇이든지 가져도 좋다.", options:["whatever","what","which","that"], answer:"whatever", explanation:"[고급] 'Anything that'의 의미를 가진 복합관계대명사 'whatever'." },
  { id:1440, topic:"relative", en:"The man ____ I thought was honest lied to me.", ko:"정직하다고 내가 생각했던 그 남자가 나에게 거짓말을 했다.", options:["who","whom","which","what"], answer:"who", explanation:"[고급] 삽입절(I thought)을 제외하면 'The man (who) was honest' 구조이므로 주격 who가 맞습니다." },
 // 14. 관계부사 (ID: 1501 ~ 1530) - [번호 정정: 1400단위 -> 1500단위]
  
  // --- [초급: 선행사 보고 짝꿍 찾기 (장소/시간/이유)] (10문제) ---
  { id:1501, topic:"relativeAdverb", en:"This is the house ____ I live.", ko:"이곳은 내가 사는 집이다.", options:["where","when","why","how"], answer:"where", explanation:"[초급] 선행사가 장소(house)이므로 where." },
  { id:1502, topic:"relativeAdverb", en:"I remember the day ____ we met.", ko:"나는 우리가 만난 날을 기억한다.", options:["when","where","why","how"], answer:"when", explanation:"[초급] 선행사가 시간(day)이므로 when." },
  { id:1503, topic:"relativeAdverb", en:"Tell me the reason ____ you are late.", ko:"네가 늦은 이유를 말해줘.", options:["why","where","when","how"], answer:"why", explanation:"[초급] 선행사가 이유(reason)이므로 why." },
  { id:1504, topic:"relativeAdverb", en:"This is the park ____ we played.", ko:"이곳은 우리가 놀았던 공원이다.", options:["where","when","why","how"], answer:"where", explanation:"[초급] 선행사가 장소(park)이므로 where." },
  { id:1505, topic:"relativeAdverb", en:"Spring is the season ____ flowers bloom.", ko:"봄은 꽃이 피는 계절이다.", options:["when","where","why","how"], answer:"when", explanation:"[초급] 선행사가 시간/계절(season)이므로 when." },
  { id:1506, topic:"relativeAdverb", en:"Do you know the city ____ he was born?", ko:"그가 태어난 도시를 아니?", options:["where","when","why","how"], answer:"where", explanation:"[초급] 선행사가 장소(city)이므로 where." },
  { id:1507, topic:"relativeAdverb", en:"Friday is the day ____ I am happy.", ko:"금요일은 내가 행복한 날이다.", options:["when","where","why","how"], answer:"when", explanation:"[초급] 선행사가 시간(day)이므로 when." },
  { id:1508, topic:"relativeAdverb", en:"I don't know the reason ____ she is crying.", ko:"나는 그녀가 우는 이유를 모른다.", options:["why","where","when","how"], answer:"why", explanation:"[초급] 선행사가 이유(reason)이므로 why." },
  { id:1509, topic:"relativeAdverb", en:"This is the school ____ I study.", ko:"이곳은 내가 공부하는 학교다.", options:["where","when","why","how"], answer:"where", explanation:"[초급] 선행사가 장소(school)이므로 where." },
  { id:1510, topic:"relativeAdverb", en:"2002 was the year ____ we won.", ko:"2002년은 우리가 이겼던 해이다.", options:["when","where","why","how"], answer:"when", explanation:"[초급] 선행사가 시간(year)이므로 when." },
  // --- [중급: The way/How 규칙 & 전치사+관계대명사] (10문제) ---
  { id:1511, topic:"relativeAdverb", en:"This is ____ I solved the problem.", ko:"이것이 내가 문제를 푼 방법이다.", options:["how","the way how","where","when"], answer:"how", explanation:"[중급] 'the way'와 'how'는 절대로 함께 쓸 수 없습니다. 둘 중 하나만 써야 합니다." },
  { id:1512, topic:"relativeAdverb", en:"I like the way ____ he talks.", ko:"나는 그가 말하는 방식이 좋다.", options:["that","how","which","where"], answer:"that", explanation:"[중급] the way 뒤에는 how를 못 쓰지만, 대신 관계부사 대용의 'that'이나 'in which'는 쓸 수 있습니다." },
  { id:1513, topic:"relativeAdverb", en:"This is the house ____ which I live.", ko:"이곳은 내가 사는 집이다.", options:["in","on","at","to"], answer:"in", explanation:"[중급] live in the house이므로 'in which' (=where)." },
  { id:1514, topic:"relativeAdverb", en:"Tell me the reason ____ which you did it.", ko:"네가 그걸 한 이유를 말해줘.", options:["for","at","in","on"], answer:"for", explanation:"[중급] for the reason이므로 'for which' (=why)." },
  { id:1515, topic:"relativeAdverb", en:"Monday is the day ____ which we start work.", ko:"월요일은 우리가 일을 시작하는 날이다.", options:["on","at","in","for"], answer:"on", explanation:"[중급] on the day이므로 'on which' (=when)." },
  { id:1516, topic:"relativeAdverb", en:"This is the place ____ I hid the key.", ko:"이곳은 내가 열쇠를 숨긴 장소다.", options:["where","which","who","what"], answer:"where", explanation:"[중급] 뒤에 '내가 열쇠를 숨겼다(완전한 문장)'가 오므로 관계부사 where." },
  { id:1517, topic:"relativeAdverb", en:"Do you know ____ he fixed the car?", ko:"그가 어떻게 차를 고쳤는지 아니?", options:["how","the way how","where","when"], answer:"how", explanation:"[중급] 방법을 물을 때는 how (또는 the way)." },
