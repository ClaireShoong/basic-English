  { id:1518, topic:"relativeAdverb", en:"That is the reason ____ I like him.", ko:"그것이 내가 그를 좋아하는 이유다.", options:["why","which","where","when"], answer:"why", explanation:"[중급] 선행사 the reason 뒤에는 why." },
  { id:1519, topic:"relativeAdverb", en:"I don't like ____ she treats people.", ko:"나는 그녀가 사람들을 대하는 방식이 싫다.", options:["the way","the way how","where","when"], answer:"the way", explanation:"[중급] how 대신 the way를 쓸 수 있습니다. (함께는 불가)" },
  { id:1520, topic:"relativeAdverb", en:"Is this the time ____ we should leave?", ko:"지금이 우리가 떠나야 할 때인가요?", options:["when","which","where","why"], answer:"when", explanation:"[중급] 선행사가 time이고 뒷문장이 완전하므로 when." },
  // --- [고급: 관계대명사 vs 관계부사 구별 (뒷문장 완결성)] (10문제) ---
  { id:1521, topic:"relativeAdverb", en:"This is the house ____ I bought.", ko:"이것은 내가 산 집이다. (주의!)", options:["which","where","when","who"], answer:"which", explanation:"[고급] 뒤에 'I bought(목적어 없음)' 불완전한 문장이므로 관계대명사 which가 정답. (집을 산 것)" },
  { id:1522, topic:"relativeAdverb", en:"This is the house ____ I live.", ko:"이곳은 내가 사는 집이다.", options:["where","which","that","who"], answer:"where", explanation:"[고급] 뒤에 'I live(완전한 문장/자동사)'가 오므로 관계부사 where가 정답. (집에서 사는 것)" },
  { id:1523, topic:"relativeAdverb", en:"I remember the day ____ we spent together.", ko:"나는 우리가 함께 보냈던 그 날을 기억한다.", options:["which","when","where","why"], answer:"which", explanation:"[고급] spend는 타동사인데 목적어가 빠져 있으므로(불완전), 관계대명사 which가 맞습니다." },
  { id:1524, topic:"relativeAdverb", en:"I remember the day ____ we met.", ko:"나는 우리가 만났던 날을 기억한다.", options:["when","which","where","why"], answer:"when", explanation:"[고급] meet은 여기서 자동사(서로 만나다)로 쓰여 문장이 완전하므로 관계부사 when." },
  { id:1525, topic:"relativeAdverb", en:"Tell me the reason ____ you suggested.", ko:"네가 제시했던 그 이유를 말해줘.", options:["which","why","where","when"], answer:"which", explanation:"[고급] suggest(제안하다)의 목적어가 없으므로 관계대명사 which." },
  { id:1526, topic:"relativeAdverb", en:"We went to the park, ____ we had lunch.", ko:"우리는 공원에 갔고, 거기서 점심을 먹었다.", options:["where","which","when","that"], answer:"where", explanation:"[고급] 계속적 용법. 'and there(거기서)'의 의미이므로 where." },
  { id:1527, topic:"relativeAdverb", en:"Point implies a position ____ has no size.", ko:"점은 크기가 없는 위치를 의미한다.", options:["which","where","when","why"], answer:"which", explanation:"[고급] 장소(position) 뒤지만 주어가 없는 불완전한 문장이므로 주격 관계대명사 which." },
  { id:1528, topic:"relativeAdverb", en:"He was in a situation ____ was dangerous.", ko:"그는 위험한 상황에 처해 있었다.", options:["which","where","when","why"], answer:"which", explanation:"[고급] 상황(situation)은 추상적 장소지만, 뒤에 주어가 없으므로 관계대명사 which." },
  { id:1529, topic:"relativeAdverb", en:"He was in a situation ____ he couldn't escape.", ko:"그는 탈출할 수 없는 상황에 처해 있었다.", options:["where","which","who","that"], answer:"where", explanation:"[고급] 뒤에 완전한 문장이 오므로, 상황(situation)을 장소 개념으로 보아 where 사용." },
  { id:1530, topic:"relativeAdverb", en:"That's ____ I love you.", ko:"그게 바로 내가 너를 사랑하는 이유야.", options:["why","which","where","when"], answer:"why", explanation:"[고급] 선행사(the reason)가 생략된 형태. That is why ~." },
 // 15. to부정사 (ID: 1601 ~ 1640) - [번호 정정: 1500단위 -> 1600단위]
  
  // --- [초급: 기본 용법 (명사/형용사/부사) 구별] (20문제) ---
  { id:1601, topic:"toinf", en:"I want ____ a teacher.", ko:"나는 선생님이 되고 싶다.", options:["to be","be","being","been"], answer:"to be", explanation:"[초급] want는 to부정사를 목적어로 취합니다." },
  { id:1602, topic:"toinf", en:"My hobby is ____ coins.", ko:"내 취미는 동전을 모으는 것이다.", options:["to collect","collect","collected","collects"], answer:"to collect", explanation:"[초급] 주어(취미)를 설명하는 보어 자리에 쓰인 명사적 용법." },
  { id:1603, topic:"toinf", en:"I have a book ____ read.", ko:"나는 읽을 책이 있다.", options:["to","for","of","in"], answer:"to", explanation:"[초급] 명사(book) 뒤에서 꾸며주는 형용사적 용법 (to read)." },
  { id:1604, topic:"toinf", en:"He went there ____ meet her.", ko:"그는 그녀를 만나기 위해 거기에 갔다.", options:["to","for","of","at"], answer:"to", explanation:"[초급] 목적(~하기 위해)을 나타내는 부사적 용법." },
  { id:1605, topic:"toinf", en:"I decided ____ go home.", ko:"나는 집에 가기로 결심했다.", options:["to","for","of","in"], answer:"to", explanation:"[초급] decide는 to부정사를 목적어로 취합니다." },
  { id:1606, topic:"toinf", en:"It is time ____ go to bed.", ko:"잠자러 갈 시간이다.", options:["to","for","of","in"], answer:"to", explanation:"[초급] 명사(time)를 꾸며주는 형용사적 용법 (~할 시간)." },
  { id:1607, topic:"toinf", en:"I am glad ____ see you.", ko:"너를 봐서 기쁘다.", options:["to","for","of","in"], answer:"to", explanation:"[초급] 감정(glad)의 원인을 나타내는 부사적 용법." },
  { id:1608, topic:"toinf", en:"____ study English is fun.", ko:"영어를 공부하는 것은 재미있다.", options:["To","For","Of","In"], answer:"To", explanation:"[초급] 문장의 주어 자리에 쓰인 명사적 용법." },
  { id:1609, topic:"toinf", en:"She hopes ____ a singer.", ko:"그녀는 가수가 되기를 희망한다.", options:["to become","become","becoming","became"], answer:"to become", explanation:"[초급] hope는 to부정사를 목적어로 취합니다." },
  { id:1610, topic:"toinf", en:"Give me something ____ drink.", ko:"마실 것 좀 주세요.", options:["to","for","of","in"], answer:"to", explanation:"[초급] 대명사(something)를 뒤에서 꾸며주는 형용사적 용법." },
  { id:1611, topic:"toinf", en:"He grew up ____ be a doctor.", ko:"그는 자라서 의사가 되었다.", options:["to","for","of","in"], answer:"to", explanation:"[초급] 결과(~해서 ...되다)를 나타내는 부사적 용법." },
  { id:1612, topic:"toinf", en:"I need a chair ____ sit on.", ko:"나는 앉을 의자가 필요하다.", options:["to","for","of","in"], answer:"to", explanation:"[초급] 형용사적 용법. (전치사 on까지 써야 함에 주의)" },
  { id:1613, topic:"toinf", en:"They planned ____ visit the museum.", ko:"그들은 박물관을 방문할 계획을 세웠다.", options:["to","for","of","in"], answer:"to", explanation:"[초급] plan은 to부정사를 목적어로 취합니다." },
  { id:1614, topic:"toinf", en:"She came here ____ help us.", ko:"그녀는 우리를 돕기 위해 여기에 왔다.", options:["to","for","of","in"], answer:"to", explanation:"[초급] 목적(~하기 위해) 부사적 용법." },
  { id:1615, topic:"toinf", en:"I don't know what ____ do.", ko:"나는 무엇을 해야 할지 모르겠다.", options:["to","for","of","in"], answer:"to", explanation:"[초급] 의문사 + to부정사 (what to do = 무엇을 할지)." },
  { id:1616, topic:"toinf", en:"He promised not ____ be late.", ko:"그는 늦지 않겠다고 약속했다.", options:["to","for","of","in"], answer:"to", explanation:"[초급] to부정사의 부정은 not to R입니다." },
  { id:1617, topic:"toinf", en:"I went to the park ____ play soccer.", ko:"나는 축구를 하러 공원에 갔다.", options:["to","for","of","in"], answer:"to", explanation:"[초급] 목적(~하러) 부사적 용법." },
  { id:1618, topic:"toinf", en:"Her wish is ____ travel around the world.", ko:"그녀의 소원은 세계 여행을 하는 것이다.", options:["to","for","of","in"], answer:"to", explanation:"[초급] 보어 자리 명사적 용법." },
  { id:1619, topic:"toinf", en:"Do you have any money ____ spend?", ko:"쓸 돈 좀 있니?", options:["to","for","of","in"], answer:"to", explanation:"[초급] 명사(money) 수식 형용사적 용법." },
  { id:1620, topic:"toinf", en:"I was surprised ____ hear the news.", ko:"그 소식을 듣고 놀랐다.", options:["to","for","of","in"], answer:"to", explanation:"[초급] 감정(surprised)의 원인." },
  // --- [중급: 필수 암기 동사 & 가주어/진주어] (10문제) ---
  { id:1621, topic:"toinf", en:"He refused ____ the money.", ko:"그는 돈을 받는 것을 거절했다.", options:["to accept","accepting","accept","accepted"], answer:"to accept", explanation:"[중급] refuse(거절하다)는 to부정사만 취합니다." },
  { id:1622, topic:"toinf", en:"We agreed ____ together.", ko:"우리는 함께 가기로 동의했다.", options:["to go","going","go","went"], answer:"to go", explanation:"[중급] agree(동의하다)는 to부정사만 취합니다." },
  { id:1623, topic:"toinf", en:"She expects ____ the exam.", ko:"그녀는 시험에 합격할 것을 기대한다.", options:["to pass","passing","pass","passed"], answer:"to pass", explanation:"[중급] expect(기대하다)는 to부정사만 취합니다." },
  { id:1624, topic:"toinf", en:"I managed ____ the heavy box.", ko:"나는 그 무거운 상자를 간신히 옮겼다.", options:["to move","moving","move","moved"], answer:"to move", explanation:"[중급] manage to R (가까스로 ~하다)." },
  { id:1625, topic:"toinf", en:"It is impossible ____ fly.", ko:"나는 것은 불가능하다.", options:["to","for","of","in"], answer:"to", explanation:"[중급] 가주어 It ... 진주어 to부정사 구문." },
  { id:1626, topic:"toinf", en:"It is important ____ study hard.", ko:"열심히 공부하는 것은 중요하다.", options:["to","for","of","in"], answer:"to", explanation:"[중급] 가주어 It ... 진주어 to부정사." },
  { id:1627, topic:"toinf", en:"I learned how ____ swim.", ko:"나는 수영하는 법을 배웠다.", options:["to","for","of","in"], answer:"to", explanation:"[중급] 의문사(how) + to부정사 = ~하는 방법." },
  { id:1628, topic:"toinf", en:"He seems ____ rich.", ko:"그는 부자인 것 같다.", options:["to be","being","be","been"], answer:"to be", explanation:"[중급] seem to R (~인 것 같다)." },
  { id:1629, topic:"toinf", en:"Would you like ____ come?", ko:"오시겠습니까?", options:["to","for","of","in"], answer:"to", explanation:"[중급] Would like to R (~하고 싶다)." },
  { id:1630, topic:"toinf", en:"Remember ____ lock the door.", ko:"문 잠그는 것을 기억해라(잊지 마라).", options:["to","locking","lock","locked"], answer:"to", explanation:"[중급] remember to R (미래: 할 것을 기억하다) vs -ing (과거: 한 것을 기억하다)." },
  // --- [고급: 의미상 주어, 시제, 관용구, 예외] (10문제) ---
  { id:1631, topic:"toinf", en:"It is hard ____ me to solve this.", ko:"내가 이것을 푸는 것은 어렵다.", options:["for","of","to","in"], answer:"for", explanation:"[고급] to부정사의 의미상 주어는 일반적으로 'for + 목적격'을 씁니다." },
  { id:1632, topic:"toinf", en:"It was kind ____ you to help me.", ko:"나를 도와주다니 당신은 친절하군요.", options:["of","for","to","in"], answer:"of", explanation:"[고급] 사람의 성격/태도(kind, nice, wise)를 나타내는 형용사 뒤에는 'of + 목적격'을 씁니다." },
  { id:1633, topic:"toinf", en:"He seems to ____ been rich.", ko:"그는 (과거에) 부자였던 것 같다.", options:["have","has","had","be"], answer:"have", explanation:"[고급] 완료부정사(to have p.p.): 주절보다 더 과거의 일을 나타냅니다." },
  { id:1634, topic:"toinf", en:"I am too tired ____ walk.", ko:"나는 너무 피곤해서 걸을 수 없다.", options:["to","for","that","so"], answer:"to", explanation:"[고급] too ~ to ... (너무 ~해서 ...할 수 없다)." },
  { id:1635, topic:"toinf", en:"He is rich enough ____ buy a car.", ko:"그는 차를 살 만큼 충분히 부자다.", options:["to","for","of","in"], answer:"to", explanation:"[고급] 형용사 + enough + to R (~할 만큼 충분히 ...한)." },
  { id:1636, topic:"toinf", en:"To tell the truth, I don't like it.", ko:"____ 말하자면, 나는 그걸 안 좋아해.", options:["사실대로","거짓말로","솔직히","간단히"], answer:"사실대로", explanation:"[고급] 독립부정사: To tell the truth (사실대로 말하자면)." },
  { id:1637, topic:"toinf", en:"He grew up to ____ 80.", ko:"그는 자라서 80세까지 살았다.", options:["be","being","been","is"], answer:"be", explanation:"[고급] 결과적 용법: 자라서(grew up) 그 결과 80세가 되었다(to be 80)." },
  { id:1638, topic:"toinf", en:"The box is too heavy for me ____ lift.", ko:"그 상자는 내가 들기에 너무 무겁다.", options:["to","for","of","in"], answer:"to", explanation:"[고급] too ... for 의미상주어 ... to R." },
  { id:1639, topic:"toinf", en:"I'm sorry ____ kept you waiting.", ko:"기다리게 해서 미안해.", options:["to have","to has","to had","to be"], answer:"to have", explanation:"[고급] 기다리게 한 것(과거)이 미안한 것(현재)보다 앞서므로 완료부정사 사용." },
  { id:1640, topic:"toinf", en:"She is likely ____ succeed.", ko:"그녀는 성공할 것 같다.", options:["to","for","of","in"], answer:"to", explanation:"[고급] be likely to R (~할 가능성이 있다/할 것 같다)." },
// 16. 동명사 (ID: 1701 ~ 1730) - [번호 정정: 1600단위 -> 1700단위]
  
  // --- [1. 주어 역할: "~하는 것은"] (초급 - 10문제) ---
  { id:1701, topic:"gerund", en:"____ is believing.", ko:"보는 것이 믿는 것이다.", options:["Seeing","See","To see","Saw"], answer:"Seeing", explanation:"[주어] 문장의 맨 앞 주어 자리에 쓰인 동명사입니다." },
  { id:1702, topic:"gerund", en:"____ English is fun.", ko:"영어를 배우는 것은 재미있다.", options:["Learning","Learn","Learns","Learned"], answer:"Learning", explanation:"[주어] 동사가 명사 역할을 하려면 -ing를 붙여야 합니다." },
  { id:1703, topic:"gerund", en:"____ books is good for you.", ko:"책을 읽는 것은 너에게 좋다.", options:["Reading","Read","Reads","To read"], answer:"Reading", explanation:"[주어] Reading books 전체가 주어이며, 동명사 주어는 단수 취급합니다." },
  { id:1704, topic:"gerund", en:"____ early is a good habit.", ko:"일찍 일어나는 것은 좋은 습관이다.", options:["Getting up","Get up","Gets up","Got up"], answer:"Getting up", explanation:"[주어] '일어나는 것'이라는 명사가 필요합니다." },
  { id:1705, topic:"gerund", en:"____ soccer is exciting.", ko:"축구를 하는 것은 신난다.", options:["Playing","Play","Plays","Played"], answer:"Playing", explanation:"[주어] Play(동사)를 주어로 쓰기 위해 -ing를 붙입니다." },
  { id:1706, topic:"gerund", en:"____ vegetables is healthy.", ko:"채소를 먹는 것은 건강에 좋다.", options:["Eating","Eat","Eaten","Ate"], answer:"Eating", explanation:"[주어] 문장의 주어 역할을 하는 동명사 Eating." },
  { id:1707, topic:"gerund", en:"____ photos is my hobby.", ko:"사진을 찍는 것은 나의 취미다.", options:["Taking","Take","Took","Takes"], answer:"Taking", explanation:"[주어] Take photos -> Taking photos (주어화)." },
  { id:1708, topic:"gerund", en:"____ too much TV is bad.", ko:"TV를 너무 많이 보는 것은 나쁘다.", options:["Watching","Watch","Watches","Watched"], answer:"Watching", explanation:"[주어] 동명사 주어는 '~하는 것'으로 해석합니다." },
  { id:1709, topic:"gerund", en:"____ alone is dangerous.", ko:"혼자 걷는 것은 위험하다.", options:["Walking","Walk","Walks","Walked"], answer:"Walking", explanation:"[주어] 문장 맨 앞 동사원형은 명령문이 되므로, 주어로 쓰려면 -ing가 필요합니다." },
  { id:1710, topic:"gerund", en:"____ a diary is helpful.", ko:"일기를 쓰는 것은 도움이 된다.", options:["Keeping","Keep","Keeps","Kept"], answer:"Keeping", explanation:"[주어] keep a diary(일기를 쓰다) -> Keeping a diary." },
  // --- [2. 동사의 목적어 역할: "~하는 것을"] (중급 - 필수 암기 동사) (10문제) ---
  { id:1711, topic:"gerund", en:"I enjoy ____ music.", ko:"나는 음악 듣는 것을 즐긴다.", options:["listening","to listen","listen","listened"], answer:"listening", explanation:"[목적어] enjoy는 동명사(-ing)만 목적어로 취합니다." },
  { id:1712, topic:"gerund", en:"He finished ____ his homework.", ko:"그는 숙제하는 것을 끝냈다.", options:["doing","to do","do","did"], answer:"doing", explanation:"[목적어] finish는 동명사만 목적어로 취합니다." },
  { id:1713, topic:"gerund", en:"Stop ____ noise.", ko:"떠드는 것을 멈춰라.", options:["making","to make","make","made"], answer:"making", explanation:"[목적어] stop -ing: (하던 동작을) 멈추다." },
  { id:1714, topic:"gerund", en:"Do you mind ____ the window?", ko:"창문 좀 열어주시겠어요? (여는 거 꺼리니?)", options:["opening","to open","open","opened"], answer:"opening", explanation:"[목적어] mind(꺼리다)는 동명사를 목적어로 취합니다." },
  { id:1715, topic:"gerund", en:"She gave up ____ the piano.", ko:"그녀는 피아노 치는 것을 포기했다.", options:["playing","to play","play","played"], answer:"playing", explanation:"[목적어] give up(포기하다)은 동명사를 취합니다." },
  { id:1716, topic:"gerund", en:"We practiced ____.", ko:"우리는 춤추는 것을 연습했다.", options:["dancing","to dance","dance","danced"], answer:"dancing", explanation:"[목적어] practice(연습하다)는 동명사를 취합니다." },
  { id:1717, topic:"gerund", en:"He kept ____.", ko:"그는 계속해서 말했다.", options:["talking","to talk","talk","talked"], answer:"talking", explanation:"[목적어] keep -ing: 계속해서 ~하다." },
  { id:1718, topic:"gerund", en:"I avoided ____ him.", ko:"나는 그를 만나는 것을 피했다.", options:["meeting","to meet","meet","met"], answer:"meeting", explanation:"[목적어] avoid(피하다)는 동명사를 취합니다." },
  { id:1719, topic:"gerund", en:"They denied ____ the money.", ko:"그들은 돈을 훔친 것을 부인했다.", options:["stealing","to steal","steal","stole"], answer:"stealing", explanation:"[목적어] deny(부인하다)는 동명사를 취합니다." },
  { id:1720, topic:"gerund", en:"Would you consider ____ us?", ko:"우리와 합류하는 것을 고려해 보시겠어요?", options:["joining","to join","join","joined"], answer:"joining", explanation:"[목적어] consider(고려하다)는 동명사를 취합니다." },
  // --- [3. 전치사의 목적어 & 보어 & 관용구] (중급 - 숙어) (10문제) ---
  { id:1721, topic:"gerund", en:"He is good at ____.", ko:"그는 요리를 잘한다.", options:["cooking","to cook","cook","cooked"], answer:"cooking", explanation:"[전치사] 전치사(at) 뒤에는 명사나 동명사가 와야 합니다." },
  { id:1722, topic:"gerund", en:"Thank you for ____ me.", ko:"도와줘서 고마워.", options:["helping","to help","help","helped"], answer:"helping", explanation:"[전치사] for 뒤에는 동명사(-ing)를 씁니다." },
  { id:1723, topic:"gerund", en:"I am interested in ____ history.", ko:"나는 역사 배우는 것에 관심이 있다.", options:["learning","to learn","learn","learned"], answer:"learning", explanation:"[전치사] in 뒤에는 동명사가 옵니다." },
  { id:1724, topic:"gerund", en:"She is afraid of ____.", ko:"그녀는 수영하는 것을 두려워한다.", options:["swimming","to swim","swim","swam"], answer:"swimming", explanation:"[전치사] of 뒤에는 동명사가 옵니다." },
  { id:1725, topic:"gerund", en:"How about ____ out?", ko:"나가는 게 어때?", options:["going","to go","go","gone"], answer:"going", explanation:"[전치사] How about -ing? (~하는 게 어때?)" },
  { id:1726, topic:"gerund", en:"My hobby is ____ stamps.", ko:"내 취미는 우표를 수집하는 것이다.", options:["collecting","collect","collects","collected"], answer:"collecting", explanation:"[보어] 주어(취미)와 동격인 보어 역할의 동명사입니다." },
  { id:1727, topic:"gerund", en:"I look forward to ____ you.", ko:"너를 만나기를 고대한다.", options:["meeting","meet","to meet","met"], answer:"meeting", explanation:"[관용구] look forward to의 to는 전치사이므로 반드시 -ing를 씁니다." },
  { id:1728, topic:"gerund", en:"He is used to ____ up early.", ko:"그는 일찍 일어나는 데 익숙하다.", options:["getting","get","to get","got"], answer:"getting", explanation:"[관용구] be used to -ing (~에 익숙하다). (used to R과 구별!)" },
  { id:1729, topic:"gerund", en:"Instead of ____ TV, read a book.", ko:"TV를 보는 대신에 책을 읽어라.", options:["watching","watch","to watch","watched"], answer:"watching", explanation:"[전치사] Instead of(~대신에) + 동명사." },
  { id:1730, topic:"gerund", en:"This book is worth ____.", ko:"이 책은 읽을 가치가 있다.", options:["reading","to read","read","reads"], answer:"reading", explanation:"[관용구] be worth -ing (~할 가치가 있다)." },
  // 18. 분사구문 (ID: 1751 ~ 1780)
  
  // --- [초급: 분사구문 기본 형태 익히기] (10문제) ---
  { id:1751, topic:"participle", en:"____ the door, he entered the room.", ko:"문을 열고 그는 방에 들어갔다.", options:["Opening","Opened","Open","To open"], answer:"Opening", explanation:"[초급] 주어(he)가 직접 문을 여는 능동 동작이므로 현재분사 Opening." },
  { id:1752, topic:"participle", en:"____ tired, she went to bed early.", ko:"피곤해서 그녀는 일찍 잠자리에 들었다.", options:["Being","Been","Be","Was"], answer:"Being", explanation:"[초급] Being tired = Because she was tired. 이유를 나타내는 분사구문." },
  { id:1753, topic:"participle", en:"____ a book, he fell asleep.", ko:"책을 읽다가 그는 잠이 들었다.", options:["Reading","Read","Reads","To read"], answer:"Reading", explanation:"[초급] 주어(he)가 읽는 능동 행위 중 잠든 것이므로 현재분사." },
  { id:1754, topic:"participle", en:"____ from the top, the city looked small.", ko:"꼭대기에서 보면, 도시가 작아 보였다.", options:["Seen","Seeing","See","To see"], answer:"Seen", explanation:"[초급] 도시(city)가 보여지는 것(수동)이므로 과거분사 Seen." },
  { id:1755, topic:"participle", en:"____ in English, the letter was hard to read.", ko:"영어로 쓰여서, 그 편지는 읽기 어려웠다.", options:["Written","Writing","Write","Wrote"], answer:"Written", explanation:"[초급] 편지가 쓰여진 것(수동)이므로 과거분사 Written." },
  { id:1756, topic:"participle", en:"____ his homework, he watched TV.", ko:"숙제를 끝내고 그는 TV를 봤다.", options:["Finishing","Finished","Finish","To finish"], answer:"Finishing", explanation:"[초급] 주어(he)가 직접 끝내는 능동 행위이므로 현재분사." },
  { id:1757, topic:"participle", en:"____ along the street, I met an old friend.", ko:"길을 걷다가 나는 오랜 친구를 만났다.", options:["Walking","Walked","Walk","To walk"], answer:"Walking", explanation:"[초급] 주어(I)가 걷는 능동 행위이므로 현재분사." },
  { id:1758, topic:"participle", en:"____ nothing to do, I went for a walk.", ko:"할 일이 없어서 나는 산책을 나갔다.", options:["Having","Had","Have","Has"], answer:"Having", explanation:"[초급] 이유를 나타내는 분사구문. Having nothing = Because I had nothing." },
  { id:1759, topic:"participle", en:"____ to music, she studied.", ko:"음악을 들으면서 그녀는 공부했다.", options:["Listening","Listened","Listen","Listens"], answer:"Listening", explanation:"[초급] 동시 동작(~하면서)을 나타내는 분사구문." },
  { id:1760, topic:"participle", en:"____ the news, she was shocked.", ko:"그 소식을 듣고 그녀는 충격을 받았다.", options:["Hearing","Heard","Hear","Hears"], answer:"Hearing", explanation:"[초급] 주어(she)가 듣는 능동 행위이므로 현재분사." },
  // --- [중급: 완료 분사구문, Being 생략, 부정] (10문제) ---
  { id:1761, topic:"participle", en:"____ finished lunch, I took a nap.", ko:"점심을 다 먹은 후에 나는 낮잠을 잤다.", options:["Having","Being","Have","Had"], answer:"Having", explanation:"[중급] 완료 분사구문: Having p.p. = After I had finished." },
  { id:1762, topic:"participle", en:"____ studied all night, he passed the exam.", ko:"밤새 공부한 후에 그는 시험에 합격했다.", options:["Having","Being","Has","Had"], answer:"Having", explanation:"[중급] 분사구문의 시제가 주절보다 앞서면 Having p.p.를 씁니다." },
  { id:1763, topic:"participle", en:"____ with the result, he smiled.", ko:"결과에 만족하여 그는 미소 지었다.", options:["Satisfied","Satisfying","Satisfy","Satisfies"], answer:"Satisfied", explanation:"[중급] Being satisfied → Being 생략. 주어가 만족을 '느낀(수동)' 것." },
  { id:1764, topic:"participle", en:"____ in 1990, he is now 36.", ko:"1990년에 태어나서 그는 현재 36세이다.", options:["Born","Boring","Being born","Bear"], answer:"Born", explanation:"[중급] Being born in 1990 → Being 생략. 태어남은 수동(be born)." },
  { id:1765, topic:"participle", en:"____ what to say, she kept silent.", ko:"무슨 말을 해야 할지 몰라서 그녀는 침묵했다.", options:["Not knowing","Knowing not","Not known","Don't knowing"], answer:"Not knowing", explanation:"[중급] 분사구문의 부정은 Not + 분사 형태입니다." },
  { id:1766, topic:"participle", en:"____ been to Paris, I can guide you.", ko:"파리에 가본 적이 있어서 내가 안내해 줄 수 있다.", options:["Having","Being","Have","Had"], answer:"Having", explanation:"[중급] Having been to = 경험. 완료 분사구문." },
  { id:1767, topic:"participle", en:"____ by everyone, she felt lonely.", ko:"모두에게 무시당해서 그녀는 외로웠다.", options:["Ignored","Ignoring","Ignore","Ignores"], answer:"Ignored", explanation:"[중급] Being ignored → Being 생략. 주어가 무시당한 것(수동)." },
  { id:1768, topic:"participle", en:"____ not invited, I didn't go.", ko:"초대받지 못해서 나는 가지 않았다.", options:["Not being","Not been","Not having","Being not"], answer:"Not being", explanation:"[중급] 수동 분사구문의 부정: Not being p.p." },
  { id:1769, topic:"participle", en:"____ never seen snow, she was excited.", ko:"눈을 본 적이 없어서 그녀는 신이 났다.", options:["Having","Being","Never","Had"], answer:"Having", explanation:"[중급] Having never seen: 완료 분사구문 + 부정어." },
  { id:1770, topic:"participle", en:"____ left alone, the child began to cry.", ko:"혼자 남겨지자 그 아이는 울기 시작했다.", options:["Being","Having","Been","Was"], answer:"Being", explanation:"[중급] Being left alone: 수동 분사구문. 혼자 남겨진 것." },
  // --- [고급: 독립 분사구문, with 분사, 관용표현] (10문제) ---
  { id:1771, topic:"participle", en:"____ being Sunday, the shop was closed.", ko:"일요일이라서 가게가 문을 닫았다.", options:["It","There","This","That"], answer:"It", explanation:"[고급] 독립 분사구문: 분사의 주어와 주절의 주어가 다를 때 분사 앞에 주어를 남깁니다." },
  { id:1772, topic:"participle", en:"The weather ____ fine, we went on a picnic.", ko:"날씨가 좋아서 우리는 소풍을 갔다.", options:["being","was","is","been"], answer:"being", explanation:"[고급] 독립 분사구문: The weather(분사 주어) ≠ we(주절 주어)." },
  { id:1773, topic:"participle", en:"She sat with her eyes ____.", ko:"그녀는 눈을 감은 채 앉아 있었다.", options:["closed","closing","close","closes"], answer:"closed", explanation:"[고급] with + 목적어 + 과거분사: 눈이 감겨진(수동) 상태." },
  { id:1774, topic:"participle", en:"He spoke with his arms ____.", ko:"그는 팔짱을 낀 채 말했다.", options:["folded","folding","fold","folds"], answer:"folded", explanation:"[고급] with + 목적어 + 과거분사: 팔이 접혀진(수동) 상태." },
  { id:1775, topic:"participle", en:"She ran out with tears ____ down.", ko:"그녀는 눈물을 흘리며 뛰어나갔다.", options:["streaming","streamed","stream","streams"], answer:"streaming", explanation:"[고급] with + 목적어 + 현재분사: 눈물이 흐르는(능동) 상태." },
  { id:1776, topic:"participle", en:"____ speaking of music, do you play guitar?", ko:"음악 얘기가 나온 김에, 기타 치니?", options:["Speaking","Spoken","Speak","To speak"], answer:"Speaking", explanation:"[고급] 관용적 분사구문: Speaking of (~에 대해 말하자면)." },
  { id:1777, topic:"participle", en:"Strictly ____, he is not a teacher.", ko:"엄밀히 말하면, 그는 선생님이 아니다.", options:["speaking","spoken","speak","speaks"], answer:"speaking", explanation:"[고급] 관용적 분사구문: Strictly speaking (엄밀히 말하면)." },
  { id:1778, topic:"participle", en:"____ into account his age, he did well.", ko:"그의 나이를 고려하면, 그는 잘 했다.", options:["Taking","Taken","Take","Takes"], answer:"Taking", explanation:"[고급] 관용적 분사구문: Taking ~ into account (~을 고려하면)." },
  { id:1779, topic:"participle", en:"____ considered, the plan was good.", ko:"모든 것을 고려하면, 그 계획은 좋았다.", options:["All things","All thing","Every things","All"], answer:"All things", explanation:"[고급] 독립 분사구문 관용구: All things considered (모든 것을 고려하면)." },
  { id:1780, topic:"participle", en:"He stood there, ____ at the sky.", ko:"그는 하늘을 바라보며 거기 서 있었다.", options:["looking","looked","look","looks"], answer:"looking", explanation:"[고급] 연속 동작/부대상황: 주어가 서 있으면서(and looked) 하늘을 보는 능동 행위." },
  // 19. 명사 수식 분사 (ID: 1801 ~ 1899)// --- [초급: 명사 앞에서 꾸미기 & 기초 감정분사] (15문제) ---
  { id:1801, topic:"nounParticiple", en:"Look at the ____ baby.", ko:"자고 있는 아기를 봐라.", options:["sleeping","slept","sleep","sleeps"], answer:"sleeping", explanation:"[초급] 아기가 스스로(능동적으로) 자고 있으므로 현재분사(-ing)." },
  { id:1802, topic:"nounParticiple", en:"I have a ____ car.", ko:"나는 중고차(사용된 차)를 가지고 있다.", options:["used","using","use","uses"], answer:"used", explanation:"[초급] 차는 사람에 의해 '사용된(수동)' 것이므로 과거분사(p.p.)." },
  { id:1803, topic:"nounParticiple", en:"Watch out for the ____ dog.", ko:"짖고 있는 개를 조심해라.", options:["barking","barked","bark","barks"], answer:"barking", explanation:"[초급] 개가 직접 짖고 있는(능동/진행) 상태." },
  { id:1804, topic:"nounParticiple", en:"There is a ____ window.", ko:"깨진 창문이 있다.", options:["broken","breaking","break","broke"], answer:"broken", explanation:"[초급] 창문은 무언가에 의해 '깨진(수동)' 상태." },
  { id:1805, topic:"nounParticiple", en:"Falling leaves are beautiful.", ko:"떨어지는(지고 있는) 낙엽은 아름답다.", options:["Falling","Fallen","Fell","Fall"], answer:"Falling", explanation:"[초급] 잎이 지금 떨어지고 있는 '진행'의 의미." },
  { id:1806, topic:"nounParticiple", en:"Do not touch ____ water.", ko:"끓고 있는 물을 만지지 마라.", options:["boiling","boiled","boil","boils"], answer:"boiling", explanation:"[초급] 물이 지금 펄펄 끓고 있는 '진행' 상태." },
  { id:1807, topic:"nounParticiple", en:"I like ____ eggs.", ko:"나는 삶은 달걀을 좋아한다.", options:["boiled","boiling","boil","boils"], answer:"boiled", explanation:"[초급] 이미 다 삶아진(완료/수동) 달걀." },
  { id:1808, topic:"nounParticiple", en:"It was a ____ game.", ko:"그것은 흥미진진한 경기였다.", options:["exciting","excited","excite","excites"], answer:"exciting", explanation:"[초급] 경기가 흥분을 '주는(능동)' 것이므로 exciting." },
  { id:1809, topic:"nounParticiple", en:"The students were ____.", ko:"그 학생들은 신이 났다.", options:["excited","exciting","excite","excites"], answer:"excited", explanation:"[초급] 학생들이 흥분을 '느낀(수동)' 것이므로 excited." },
  { id:1810, topic:"nounParticiple", en:"This is a ____ story.", ko:"이것은 지루한 이야기다.", options:["boring","bored","bore","bores"], answer:"boring", explanation:"[초급] 이야기가 지루함을 '주는' 원인이므로 boring." },
  { id:1811, topic:"nounParticiple", en:"I am ____.", ko:"나는 지루하다(심심하다).", options:["bored","boring","bore","bores"], answer:"bored", explanation:"[초급] 내가 지루함을 '느끼는' 것이므로 bored." },
  { id:1812, topic:"nounParticiple", en:"Look at the ____ sun.", ko:"떠오르는 태양을 봐라.", options:["rising","risen","rise","rose"], answer:"rising", explanation:"[초급] 태양이 스스로 떠오르고 있는(능동/진행) 중." },
  { id:1813, topic:"nounParticiple", en:"He found the ____ treasure.", ko:"그는 숨겨진 보물을 발견했다.", options:["hidden","hiding","hide","hid"], answer:"hidden", explanation:"[초급] 보물은 누군가에 의해 '숨겨진(수동)' 대상." },
  { id:1814, topic:"nounParticiple", en:"She repaired the ____ chair.", ko:"그녀는 부러진 의자를 고쳤다.", options:["broken","breaking","break","broke"], answer:"broken", explanation:"[초급] 의자가 부러짐을 '당한' 상태." },
  { id:1815, topic:"nounParticiple", en:"Who is that ____ girl?", ko:"저 춤추고 있는 소녀는 누구니?", options:["dancing","danced","dance","dances"], answer:"dancing", explanation:"[초급] 소녀가 직접 춤을 추고 있음(능동)." },
  // --- [중급: 명사 뒤에서 꾸미기 (구) & 능동/수동 구별] (15문제) ---
  { id:1816, topic:"nounParticiple", en:"The boy ____ soccer is my son.", ko:"축구를 하고 있는 저 소년은 내 아들이다.", options:["playing","played","play","plays"], answer:"playing", explanation:"[중급] 소년이 축구를 '직접 하는(능동)' 것이므로 현재분사." },
  { id:1817, topic:"nounParticiple", en:"The letter ____ by him arrived.", ko:"그에 의해 쓰여진 편지가 도착했다.", options:["written","writing","wrote","write"], answer:"written", explanation:"[중급] 편지는 '쓰여진(수동)' 것이므로 과거분사. (뒤에 by가 힌트)" },
  { id:1818, topic:"nounParticiple", en:"I know the girl ____ a book.", ko:"나는 책을 읽고 있는 그 소녀를 안다.", options:["reading","read","reads","to read"], answer:"reading", explanation:"[중급] 소녀가 책을 '읽고 있는(능동/진행)' 중." },
  { id:1819, topic:"nounParticiple", en:"Look at the mountain ____ with snow.", ko:"눈으로 덮인 산을 봐라.", options:["covered","covering","cover","covers"], answer:"covered", explanation:"[중급] 산이 눈에 의해 '덮인(수동)' 상태." },
  { id:1820, topic:"nounParticiple", en:"The man ____ a hat is Tom.", ko:"모자를 쓰고 있는 남자는 Tom이다.", options:["wearing","worn","wear","wears"], answer:"wearing", explanation:"[중급] 남자가 모자를 '착용하고 있는(능동)' 상태." },
  { id:1821, topic:"nounParticiple", en:"This is a computer ____ in Korea.", ko:"이것은 한국에서 만들어진 컴퓨터다.", options:["made","making","make","makes"], answer:"made", explanation:"[중급] 컴퓨터는 '만들어진(수동)' 것." },
  { id:1822, topic:"nounParticiple", en:"Do you know the lady ____ to Mom?", ko:"엄마와 이야기하고 있는 저 숙녀분을 아니?", options:["talking","talked","talk","talks"], answer:"talking", explanation:"[중급] 숙녀분이 직접 이야기하고 있음(능동)." },
  { id:1823, topic:"nounParticiple", en:"The languages ____ in Canada are English and French.", ko:"캐나다에서 사용되는 언어는 영어와 불어다.", options:["spoken","speaking","spoke","speak"], answer:"spoken", explanation:"[중급] 언어는 사람들에 의해 '말해지는(수동)' 대상." },
  { id:1824, topic:"nounParticiple", en:"People ____ for the bus are tired.", ko:"버스를 기다리는 사람들은 피곤하다.", options:["waiting","waited","wait","waits"], answer:"waiting", explanation:"[중급] 사람들이 직접 기다리고 있음(능동)." },
  { id:1825, topic:"nounParticiple", en:"The house ____ on the hill is nice.", ko:"언덕 위에 지어진 그 집은 멋지다.", options:["built","building","build","builds"], answer:"built", explanation:"[중급] 집은 '지어진(수동)' 것." },
  { id:1826, topic:"nounParticiple", en:"Anyone ____ to the party can come.", ko:"파티에 초대받은 사람은 누구나 와도 좋다.", options:["invited","inviting","invite","invites"], answer:"invited", explanation:"[중급] 사람은 파티에 '초대된(수동)' 입장." },
  { id:1827, topic:"nounParticiple", en:"The pictures ____ by Picasso are famous.", ko:"피카소에 의해 그려진 그림들은 유명하다.", options:["painted","painting","paint","paints"], answer:"painted", explanation:"[중급] 그림은 화가에 의해 '그려진(수동)' 것." },
  { id:1828, topic:"nounParticiple", en:"There is a cat ____ under the table.", ko:"탁자 아래에 숨어 있는 고양이가 있다.", options:["hiding","hidden","hide","hid"], answer:"hiding", explanation:"[중급] 고양이가 스스로 숨어 있음(능동). (Hidden은 '숨겨진' 물건일 때 씀)" },
  { id:1829, topic:"nounParticiple", en:"The train ____ for Seoul will arrive soon.", ko:"서울로 떠나는(향하는) 기차가 곧 도착할 것이다.", options:["leaving","left","leave","leaves"], answer:"leaving", explanation:"[중급] '떠나다, 향하다'는 사물 주어라도 능동(-ing)을 씁니다." },
  { id:1830, topic:"nounParticiple", en:"Most cars ____ in this factory are exported.", ko:"이 공장에서 생산된 대부분의 차는 수출된다.", options:["produced","producing","produce","produces"], answer:"produced", explanation:"[중급] 차는 공장에서 '생산된(수동)' 제품." },
  // 19. 비교급/최상급 (ID: 1901 ~ 1999) // --- [초급: 규칙 변화 (-er/-est) 및 기초 불규칙] (10문제) ---
  { id:1901, topic:"comparison", en:"He is ____ than me.", ko:"그는 나보다 키가 크다.", options:["taller","tall","tallest","more tall"], answer:"taller", explanation:"[초급] 'A is 형용사+er than B'는 가장 기본적인 비교급 문장입니다." },
  { id:1902, topic:"comparison", en:"Summer is the ____ season.", ko:"여름은 가장 더운 계절이다.", options:["hottest","hotter","hot","most hot"], answer:"hottest", explanation:"[초급] '단모음+단자음'으로 끝나는 단어(hot)는 자음을 하나 더 쓰고 -est를 붙입니다." },
  { id:1903, topic:"comparison", en:"She is ____ than her sister.", ko:"그녀는 그녀의 언니보다 더 예쁘다.", options:["prettier","pretty","prettiest","more pretty"], answer:"prettier", explanation:"[초급] '자음+y'로 끝나는 단어(pretty)는 y를 i로 바꾸고 -er을 붙입니다." },
  { id:1904, topic:"comparison", en:"An elephant is ____ than a dog.", ko:"코끼리는 개보다 더 크다.", options:["bigger","big","biggest","more big"], answer:"bigger", explanation:"[초급] big → bigger (자음 하나 더 추가)." },
  { id:1905, topic:"comparison", en:"This is the ____ pencil.", ko:"이것은 가장 긴 연필이다.", options:["longest","long","longer","most long"], answer:"longest", explanation:"[초급] 최상급 앞에는 정관사 the가 붙고 -est를 씁니다." },
  { id:1906, topic:"comparison", en:"My grades are ____ than yours.", ko:"내 성적은 네 것보다 좋다.", options:["better","good","best","gooder"], answer:"better", explanation:"[초급] good(좋은)의 비교급은 불규칙 변화인 better입니다." },
  { id:1907, topic:"comparison", en:"The weather is ____ today than yesterday.", ko:"오늘은 어제보다 날씨가 더 나쁘다.", options:["worse","bad","worst","bader"], answer:"worse", explanation:"[초급] bad(나쁜)의 비교급은 불규칙 변화인 worse입니다." },
  { id:1908, topic:"comparison", en:"I am ____ than you.", ko:"나는 너보다 나이가 많다.", options:["older","old","oldest","more old"], answer:"older", explanation:"[초급] old의 비교급은 older입니다." },
  { id:1909, topic:"comparison", en:"Winter is ____ than spring.", ko:"겨울은 봄보다 춥다.", options:["colder","cold","coldest","more cold"], answer:"colder", explanation:"[초급] cold의 비교급은 colder입니다." },
  { id:1910, topic:"comparison", en:"He runs ____ than I do.", ko:"그는 나보다 더 빨리 달린다.", options:["faster","fast","fastest","more fast"], answer:"faster", explanation:"[초급] 부사 fast의 비교급도 faster입니다." },
  // --- [중급: 긴 단어(more/most), 강조, 관용구] (10문제) ---
  { id:1911, topic:"comparison", en:"Math is ____ difficult than English.", ko:"수학은 영어보다 더 어렵다.", options:["more","most","very","much"], answer:"more", explanation:"[중급] 3음절 이상의 긴 단어(difficult)는 앞에 more를 붙여 비교급을 만듭니다." },
  { id:1912, topic:"comparison", en:"This is the ____ interesting movie.", ko:"이것은 가장 재미있는 영화다.", options:["most","more","very","much"], answer:"most", explanation:"[중급] 긴 단어(interesting)의 최상급은 앞에 the most를 붙입니다." },
  { id:1913, topic:"comparison", en:"It is ____ better now.", ko:"지금은 훨씬 더 낫다.", options:["much","very","many","so"], answer:"much", explanation:"[중급] 비교급을 강조할 때는 much, even, still, far, a lot을 씁니다. (Very는 불가)" },
  { id:1914, topic:"comparison", en:"She is as ____ as a doll.", ko:"그녀는 인형만큼 예쁘다.", options:["pretty","prettier","prettiest","more pretty"], answer:"pretty", explanation:"[중급] 'as + 원급 + as' (~만큼 ...한) 동등 비교 구문입니다." },
  { id:1915, topic:"comparison", en:"He is one of the ____ soccer players.", ko:"그는 가장 유명한 축구 선수들 중 한 명이다.", options:["most famous","more famous","famous","famousest"], answer:"most famous", explanation:"[중급] 'one of the + 최상급 + 복수명사' 구문입니다." },
  { id:1916, topic:"comparison", en:"I have ____ money than you.", ko:"나는 너보다 돈이 더 적다.", options:["less","little","least","few"], answer:"less", explanation:"[중급] little(양)의 비교급은 less입니다." },
  { id:1917, topic:"comparison", en:"Which do you like ____, apples or bananas?", ko:"사과와 바나나 중 어느 것을 더 좋아하니?", options:["better","best","good","well"], answer:"better", explanation:"[중급] 둘 중 선택을 물을 때는 비교급(better)을 씁니다." },
  { id:1918, topic:"comparison", en:"It is getting ____ and ____.", ko:"점점 더 어두워지고 있다.", options:["darker and darker","dark and dark","more dark","darkest"], answer:"darker and darker", explanation:"[중급] '비교급 + and + 비교급'은 '점점 더 ~해지다'라는 뜻입니다." },
  { id:1919, topic:"comparison", en:"The ____, the better.", ko:"빠르면 빠를수록 좋다.", options:["sooner","soon","soonest","more soon"], answer:"sooner", explanation:"[중급] 'The + 비교급, the + 비교급' (~할수록 더 ...하다) 구문입니다." },
  { id:1920, topic:"comparison", en:"This bag is ____ expensive than that one.", ko:"이 가방은 저것보다 덜 비싸다.", options:["less","little","least","more"], answer:"less", explanation:"[중급] 'less + 원급 + than'은 '~보다 덜 ...한(열등 비교)'입니다." },
  { id:1921, topic:"comparison", en:"She is the ____ student in the class.", ko:"그녀는 반에서 가장 키가 큰 학생이다.", options:["tallest","taller","most tall","tall"], answer:"tallest", explanation:"[고급] 단음절 형용사 최상급: tall → tallest." },
  { id:1922, topic:"comparison", en:"This is by far the ____ movie I've ever seen.", ko:"이것은 단연코 내가 본 최고의 영화이다.", options:["best","better","most good","good"], answer:"best", explanation:"[고급] by far + the 최상급: 단연코 가장 ~한." },
  { id:1923, topic:"comparison", en:"The sooner, the ____.", ko:"빠르면 빠를수록 좋다.", options:["better","best","good","more good"], answer:"better", explanation:"[고급] the 비교급, the 비교급 (~할수록 더 …하다)." },
  { id:1924, topic:"comparison", en:"He is ____ older than me.", ko:"그는 나보다 훨씬 더 나이가 많다.", options:["much","very","so","too"], answer:"much", explanation:"[고급] 비교급 강조: much/even/far/still/a lot + 비교급." },
  { id:1925, topic:"comparison", en:"Seoul is one of the ____ cities in Asia.", ko:"서울은 아시아에서 가장 큰 도시 중 하나이다.", options:["largest","larger","large","most large"], answer:"largest", explanation:"[고급] one of the 최상급 + 복수명사." },
  { id:1926, topic:"comparison", en:"No other boy is ____ than Tom in this school.", ko:"이 학교에서 톰보다 더 키가 큰 소년은 없다.", options:["taller","tallest","as tall","tall"], answer:"taller", explanation:"[고급] No other ~ 비교급 than = 최상급 의미." },
  { id:1927, topic:"comparison", en:"He is not so much a singer ____ an actor.", ko:"그는 가수라기보다는 배우이다.", options:["as","than","like","but"], answer:"as", explanation:"[고급] not so much A as B (A라기보다는 B)." },
  { id:1928, topic:"comparison", en:"She is ____ beautiful than her sister.", ko:"그녀는 언니보다 더 아름답다.", options:["more","most","much","very"], answer:"more", explanation:"[고급] 다음절 형용사 비교급: more + beautiful." },
  { id:1929, topic:"comparison", en:"This is three times ____ large as that.", ko:"이것은 저것보다 세 배 크다.", options:["as","than","more","most"], answer:"as", explanation:"[고급] 배수 표현: 배수 + as 원급 as." },
  { id:1930, topic:"comparison", en:"The problem was ____ difficult than I expected.", ko:"그 문제는 내가 예상했던 것보다 더 어려웠다.", options:["more","most","much","very"], answer:"more", explanation:"[고급] 다음절 형용사: more difficult than." },
  // 20. 사역동사 (ID: 2001 ~ 2099)
  
  // --- [초급: Make/Have/Let 기본 공식 (능동)] (10문제) ---
  { id:2001, topic:"causative", en:"My dad made me ____ the car.", ko:"아빠는 나에게 세차를 시켰다.", options:["wash","to wash","washing","washed"], answer:"wash", explanation:"[초급] 사역동사 make + 사람 + 동사원형." },
  { id:2002, topic:"causative", en:"Let him ____ out.", ko:"그가 나가게 해줘라(허락해라).", options:["go","to go","going","gone"], answer:"go", explanation:"[초급] 사역동사 let + 사람 + 동사원형." },
  { id:2003, topic:"causative", en:"The teacher had us ____ the text.", ko:"선생님은 우리에게 본문을 읽게 했다.", options:["read","to read","reading","reads"], answer:"read", explanation:"[초급] 사역동사 have + 사람 + 동사원형." },
  { id:2004, topic:"causative", en:"Don't make me ____.", ko:"나를 울게 하지 마.", options:["cry","to cry","crying","cried"], answer:"cry", explanation:"[초급] make + 목적어 + 동사원형." },
  { id:2005, topic:"causative", en:"Let me ____ myself.", ko:"제 소개를 하겠습니다(하게 해주세요).", options:["introduce","to introduce","introducing","introduced"], answer:"introduce", explanation:"[초급] Let me + 동사원형 (제가 ~할게요)." },
  { id:2006, topic:"causative", en:"She made her son ____ his room.", ko:"그녀는 아들에게 방 청소를 시켰다.", options:["clean","to clean","cleaning","cleaned"], answer:"clean", explanation:"[초급] make + 사람 + 동사원형." },
  { id:2007, topic:"causative", en:"Please let me ____.", ko:"제가 알게 해주세요(알려주세요).", options:["know","to know","knowing","knew"], answer:"know", explanation:"[초급] 관용구: Let me know." },
  { id:2008, topic:"causative", en:"He had his secretary ____ the email.", ko:"그는 비서에게 이메일을 보내라고 했다.", options:["send","to send","sending","sent"], answer:"send", explanation:"[초급] have + 사람 + 동사원형." },
  { id:2009, topic:"causative", en:"Make him ____ quiet.", ko:"그를 조용히 하게 해라.", options:["be","to be","is","being"], answer:"be", explanation:"[초급] '조용히 하다'는 be quiet이므로 동사원형 be가 옵니다." },
  { id:2010, topic:"causative", en:"Let's ____ pizza.", ko:"우리 피자 먹자.", options:["eat","to eat","eating","ate"], answer:"eat", explanation:"[초급] Let's (=Let us) + 동사원형." },
  // --- [중급: 준사역동사(Get/Help) & 수동 관계(p.p.)] (10문제) ---
  { id:2011, topic:"causative", en:"I got him ____ the window.", ko:"나는 그에게 창문을 닦게 했다(설득해서).", options:["to clean","clean","cleaning","cleaned"], answer:"to clean", explanation:"[중급] get + 사람 + to부정사." },
  { id:2012, topic:"causative", en:"He helped me ____ the box.", ko:"그는 내가 상자 옮기는 것을 도왔다.", options:["carry","carrying","carried","carries"], answer:"carry", explanation:"[중급] help는 동사원형 또는 to부정사(to carry) 둘 다 가능합니다." },
  { id:2013, topic:"causative", en:"I had my hair ____.", ko:"나는 머리를 잘랐다(미용사에게 시켜서).", options:["cut","to cut","cutting","cuts"], answer:"cut", explanation:"[중급] 내 머리카락은 '잘리는(수동)' 대상이므로 p.p. 사용." },
  { id:2014, topic:"causative", en:"She got her car ____.", ko:"그녀는 차를 수리했다(맡겨서).", options:["repaired","repair","to repair","repairing"], answer:"repaired", explanation:"[중급] get + 사물 + p.p. (수동 관계)." },
  { id:2015, topic:"causative", en:"I will help you ____ your homework.", ko:"네가 숙제하는 걸 도와줄게.", options:["do","doing","done","did"], answer:"do", explanation:"[중급] help + 목적어 + 동사원형." },
  { id:2016, topic:"causative", en:"He had his wallet ____.", ko:"그는 지갑을 도난당했다(당하게 되었다).", options:["stolen","steal","to steal","stealing"], answer:"stolen", explanation:"[중급] have + 사물 + p.p.는 '피해를 입다'는 뜻으로도 쓰입니다." },
  { id:2017, topic:"causative", en:"Get the work ____ by 5.", ko:"5시까지 그 일을 끝내 놓으세요.", options:["done","do","to do","doing"], answer:"done", explanation:"[중급] 일(work)은 '행해지는(수동)' 것이므로 p.p." },
  { id:2018, topic:"causative", en:"Can you help me ____ this problem?", ko:"이 문제 푸는 것 좀 도와줄래?", options:["solve","solving","solved","solves"], answer:"solve", explanation:"[중급] help + (to) solve." },
  { id:2019, topic:"causative", en:"I had the package ____.", ko:"나는 소포를 배달시켰다.", options:["delivered","deliver","to deliver","delivering"], answer:"delivered", explanation:"[중급] 소포는 '배달되는(수동)' 것." },
  { id:2020, topic:"causative", en:"Don't let the dog ____ out.", ko:"개가 밖으로 나가게 두지 마라.", options:["go","to go","going","gone"], answer:"go", explanation:"[중급] let + 목적어 + 동사원형 (개는 스스로 나갈 수 있음)." },
  // --- [고급: 자연스러운 일상 회화 & 관용 표현] (10문제) ---
  { id:2021, topic:"causative", en:"What makes you ____ so?", ko:"왜 그렇게 생각하니? (무엇이 너를 그렇게 생각하게 만드니?)", options:["think","to think","thinking","thought"], answer:"think", explanation:"[고급] 회화체: What makes you think so?" },
  { id:2022, topic:"causative", en:"I'll have him ____ you back.", ko:"그에게 다시 전화하라고 할게요.", options:["call","to call","calling","called"], answer:"call", explanation:"[고급] 전화상의 정중한 표현: have + 사람 + call." },
  { id:2023, topic:"causative", en:"Let me ____ a look.", ko:"내가 한번 볼게.", options:["have","to have","having","had"], answer:"have", explanation:"[고급] 관용구: Let me have a look (= Let me see)." },
  { id:2024, topic:"causative", en:"Nothing can make me ____ my mind.", ko:"그 무엇도 내 마음을 바꾸게 할 수 없다.", options:["change","to change","changing","changed"], answer:"change", explanation:"[고급] 강한 의지 표현: make + change." },
  { id:2025, topic:"causative", en:"Let it ____.", ko:"그냥 내버려 둬 (겨울왕국 OST).", options:["go","to go","going","gone"], answer:"go", explanation:"[고급] 관용구: Let it go (잊어버려, 놔둬)." }, 
  // * 2026번은 객관식으로 만들기 애매하여, 더 명확한 문제로 대체합니다.
  { id:2026, topic:"causative", en:"This song makes me ____ to dance.", ko:"이 노래는 나를 춤추고 싶게 만든다.", options:["want","to want","wanting","wanted"], answer:"want", explanation:"[고급] make + me + want (동사원형)." },
  { id:2027, topic:"causative", en:"He got his leg ____ in the game.", ko:"그는 경기 중에 다리가 부러졌다.", options:["broken","break","to break","breaking"], answer:"broken", explanation:"[고급] get + 신체부위 + p.p. (부상을 입다)." },
  { id:2028, topic:"causative", en:"Let's not ____ about it.", ko:"그것에 대해 이야기하지 말자.", options:["talk","to talk","talking","talked"], answer:"talk", explanation:"[고급] 제안의 부정: Let's not + 동사원형." },
  { id:2029, topic:"causative", en:"I'll let you ____ a secret.", ko:"너에게 비밀 하나를 알려줄게(알게 해줄게).", options:["know","to know","knowing","knew"], answer:"know", explanation:"[고급] 회화체: Let you know." },
  { id:2030, topic:"causative", en:"Did you have your picture ____?", ko:"사진 찍었니? (사진이 찍히게 했니?)", options:["taken","take","to take","taking"], answer:"taken", explanation:"[고급] take a picture의 수동형 사역: have picture taken." },
  // 21. 지각동사 (ID: 2101 ~ 2199)
  
  // --- [초급: 지각동사 + 목적어 + 동사원형 (기본 공식)] (10문제) ---
  { id:2101, topic:"perception", en:"I saw him ____ across the street.", ko:"나는 그가 길을 건너는 것을 보았다.", options:["run","to run","ran","runs"], answer:"run", explanation:"[초급] 지각동사 see + 목적어 + 동사원형." },
  { id:2102, topic:"perception", en:"She felt the earth ____.", ko:"그녀는 땅이 흔들리는 것을 느꼈다.", options:["move","to move","moved","moves"], answer:"move", explanation:"[초급] 지각동사 feel + 목적어 + 동사원형." },
  { id:2103, topic:"perception", en:"We heard the girl ____.", ko:"우리는 그 소녀가 노래하는 것을 들었다.", options:["sing","to sing","sang","sung"], answer:"sing", explanation:"[초급] 지각동사 hear + 목적어 + 동사원형." },
  { id:2104, topic:"perception", en:"Watch him ____ the ball.", ko:"그가 공을 차는 것을 잘 봐.", options:["kick","to kick","kicked","kicks"], answer:"kick", explanation:"[초급] 지각동사 watch + 목적어 + 동사원형." },
  { id:2105, topic:"perception", en:"Did you see anyone ____ out?", ko:"누군가 나가는 걸 봤니?", options:["go","to go","went","gone"], answer:"go", explanation:"[초급] 지각동사 see + 목적어 + 동사원형." },
  { id:2106, topic:"perception", en:"I noticed him ____ the room.", ko:"나는 그가 방을 떠나는 것을 알아차렸다.", options:["leave","to leave","left","leaves"], answer:"leave", explanation:"[초급] 지각동사 notice + 목적어 + 동사원형." },
  { id:2107, topic:"perception", en:"Can you hear the birds ____?", ko:"새들이 노래하는 소리가 들리니?", options:["sing","to sing","sang","sung"], answer:"sing", explanation:"[초급] hear + 목적어 + 동사원형." },
  { id:2108, topic:"perception", en:"She saw the boy ____ the book.", ko:"그녀는 그 소년이 책을 떨어뜨리는 것을 보았다.", options:["drop","to drop","dropped","drops"], answer:"drop", explanation:"[초급] see + 목적어 + 동사원형." },
  { id:2109, topic:"perception", en:"I felt something ____ my hand.", ko:"나는 무언가가 내 손을 건드리는 것을 느꼈다.", options:["touch","to touch","touched","touches"], answer:"touch", explanation:"[초급] feel + 목적어 + 동사원형." },
  { id:2110, topic:"perception", en:"Look at the birds ____ high.", ko:"새들이 높이 날아가는 것을 봐라.", options:["fly","to fly","flew","flown"], answer:"fly", explanation:"[초급] look at + 목적어 + 동사원형." },
  // --- [중급: 수동 관계 (목적어가 ~될 때: p.p.)] (10문제) ---
  { id:2111, topic:"perception", en:"I heard my name ____.", ko:"나는 내 이름이 불리는 것을 들었다.", options:["called","call","calling","to call"], answer:"called", explanation:"[중급] 이름은 불리는(수동) 것이므로 p.p.(called)를 씁니다." },
  { id:2112, topic:"perception", en:"He saw the window ____.", ko:"그는 창문이 깨진 것을 보았다.", options:["broken","break","breaking","to break"], answer:"broken", explanation:"[중급] 창문은 깨짐을 당하는(수동) 대상이므로 p.p.(broken)." },
  { id:2113, topic:"perception", en:"She found the money ____.", ko:"그녀는 돈이 도난당한 것을 발견했다.", options:["stolen","steal","stealing","to steal"], answer:"stolen", explanation:"[중급] 돈은 훔쳐지는(수동) 것이므로 p.p.(stolen)." },
  { id:2114, topic:"perception", en:"I felt my arm ____.", ko:"나는 내 팔이 닿아지는(누군가 만지는) 것을 느꼈다.", options:["touched","touch","touching","to touch"], answer:"touched", explanation:"[중급] 팔은 만져지는(수동) 대상이므로 p.p.(touched)." },
  { id:2115, topic:"perception", en:"We saw the tree ____ down.", ko:"우리는 나무가 베어지는 것을 보았다.", options:["cut","cutting","to cut","cuts"], answer:"cut", explanation:"[중급] cut의 과거분사는 cut입니다. 나무는 베어지는 것." },
  { id:2116, topic:"perception", en:"He heard the song ____ by her.", ko:"그는 그 노래가 그녀에 의해 불리는 것을 들었다.", options:["sung","sing","sang","singing"], answer:"sung", explanation:"[중급] 노래는 불려지는(수동) 것이므로 p.p.(sung)." },
  { id:2117, topic:"perception", en:"I watched the car ____.", ko:"나는 차가 수리되는 것을 지켜보았다.", options:["repaired","repair","repairing","to repair"], answer:"repaired", explanation:"[중급] 차는 수리되는(수동) 것이므로 p.p.(repaired)." },
  { id:2118, topic:"perception", en:"She noticed the door ____.", ko:"그녀는 문이 잠긴 것을 알아차렸다.", options:["locked","lock","locking","to lock"], answer:"locked", explanation:"[중급] 문은 잠기는(수동) 대상이므로 p.p.(locked)." },
  { id:2119, topic:"perception", en:"Have you ever seen a ghost ____?", ko:"유령이 잡히는 걸 본 적 있니?", options:["caught","catch","catching","catches"], answer:"caught", explanation:"[중급] 유령이 잡히는(수동) 상황이므로 p.p.(caught)." },
  { id:2120, topic:"perception", en:"I felt myself ____ up.", ko:"나는 내가 들어 올려지는 것을 느꼈다.", options:["lifted","lift","lifting","to lift"], answer:"lifted", explanation:"[중급] 내가 들어 올려짐을 당하는(수동) 것이므로 p.p.(lifted)." },
  // --- [고급: 동사원형 vs 현재분사(-ing)의 뉘앙스 차이] (10문제) ---
  { id:2121, topic:"perception", en:"I saw him ____ in the pool.", ko:"나는 그가 수영장에서 수영하고 있는 것을 보았다. (진행 강조)", options:["swimming","swim","swam","to swim"], answer:"swimming", explanation:"[고급] 수영하고 있는 '중'인 장면을 강조할 때는 -ing를 씁니다." },
  { id:2122, topic:"perception", en:"I heard the dog ____ all night.", ko:"나는 개가 밤새도록 짖는 것을 들었다. (반복/지속)", options:["barking","bark","barked","to bark"], answer:"barking", explanation:"[고급] 밤새 계속 짖고 있었다는 '진행/반복'의 의미는 -ing." },
  { id:2123, topic:"perception", en:"She felt her heart ____ fast.", ko:"그녀는 심장이 빠르게 뛰고 있는 것을 느꼈다.", options:["beating","beat","beaten","to beat"], answer:"beating", explanation:"[고급] 심장이 쿵쿵 뛰고 있는 '진행' 상태는 -ing." },
  { id:2124, topic:"perception", en:"Smell the bread ____.", ko:"빵이 굽히는(구워지고 있는) 냄새를 맡아봐.", options:["baking","bake","baked","to bake"], answer:"baking", explanation:"[고급] 빵이 지금 오븐에서 구워지고 있는 '중'이므로 -ing (자동사적 용법)." },
  { id:2125, topic:"perception", en:"I noticed him ____ at me.", ko:"나는 그가 나를 쳐다보고 있는 것을 알아차렸다.", options:["staring","stare","stared","to stare"], answer:"staring", explanation:"[고급] 쳐다보고 있는 '순간'을 포착했으므로 -ing." },
  { id:2126, topic:"perception", en:"We watched the sun ____.", ko:"우리는 해가 지는 것을 지켜보았다. (지는 과정)", options:["setting","set","to set","sets"], answer:"setting", explanation:"[고급] 해가 지고 있는 '진행 과정'을 묘사할 때는 -ing." },
  { id:2127, topic:"perception", en:"Listen to the rain ____.", ko:"비가 떨어지는 소리를 들어봐.", options:["falling","fall","fell","to fall"], answer:"falling", explanation:"[고급] 비가 내리고 있는 '중'이므로 -ing." },
  { id:2128, topic:"perception", en:"I caught him ____ my diary.", ko:"나는 그가 내 일기장을 읽고 있는 것을 딱 걸렸다(잡았다).", options:["reading","read","to read","reads"], answer:"reading", explanation:"[고급] catch는 현장을 잡는 것이므로 항상 -ing(진행)와 함께 씁니다." },
  { id:2129, topic:"perception", en:"Can you feel the ground ____?", ko:"땅이 흔들리고 있는 게 느껴지니?", options:["shaking","shake","shook","to shake"], answer:"shaking", explanation:"[고급] 지진 등으로 땅이 흔들리고 있는 '중'이므로 -ing." },
  { id:2130, topic:"perception", en:"I saw the bus ____.", ko:"나는 버스가 오고 있는 것을 보았다.", options:["coming","come","came","to come"], answer:"coming", explanation:"[고급] 버스가 다가오고 있는 '진행' 상황이므로 -ing." },
  // 22. 가정법 현재 (ID: 2201 ~ 2299)
  
  // --- [Zero Conditional: 불변의 진리, 과학적 사실, 습관 (If+현재, 주절+현재)] (10문제) ---
  { id:2201, topic:"conditionalPresent", en:"If you heat ice, it ____.", ko:"얼음을 가열하면, 그것은 녹는다.", options:["melts","melted","will melt","melting"], answer:"melts", explanation:"[Zero] 과학적 사실(불변의 진리)은 조건절과 주절 모두 '현재시제'를 씁니다." },
  { id:2202, topic:"conditionalPresent", en:"If you mix red and blue, you ____ purple.", ko:"빨강과 파랑을 섞으면, 보라색을 얻는다.", options:["get","got","will get","getting"], answer:"get", explanation:"[Zero] 일반적인 사실은 현재시제로 표현합니다." },
  { id:2203, topic:"conditionalPresent", en:"If I drink coffee, I ____ sleep.", ko:"나는 커피를 마시면 잠을 못 잔다.", options:["cannot","could not","would not","did not"], answer:"cannot", explanation:"[Zero] 개인적인 습관이나 사실도 현재시제를 씁니다." },
  { id:2204, topic:"conditionalPresent", en:"Plants die if they ____ get water.", ko:"식물은 물을 얻지 못하면 죽는다.", options:["don't","won't","didn't","doesn't"], answer:"don't", explanation:"[Zero] 과학적 사실. 주어(they)가 복수이므로 don't." },
  { id:2205, topic:"conditionalPresent", en:"If you press this button, the machine ____.", ko:"이 버튼을 누르면 기계가 작동한다.", options:["starts","started","will start","start"], answer:"starts", explanation:"[Zero] 기계 조작법 등 정해진 결과는 현재시제." },
  { id:2206, topic:"conditionalPresent", en:"Water ____ if the temperature reaches 100°C.", ko:"온도가 100도에 도달하면 물은 끓는다.", options:["boils","boiling","boiled","will boil"], answer:"boils", explanation:"[Zero] 과학적 법칙은 항상 현재시제." },
  { id:2207, topic:"conditionalPresent", en:"If the sun sets, it ____ dark.", ko:"해가 지면 어두워진다.", options:["gets","got","will get","getting"], answer:"gets", explanation:"[Zero] 자연 현상은 현재시제로 씁니다." },
  { id:2208, topic:"conditionalPresent", en:"If I am hungry, I ____.", ko:"나는 배가 고프면 먹는다.", options:["eat","ate","will eat","eating"], answer:"eat", explanation:"[Zero] 일반적인 습관." },
  { id:2209, topic:"conditionalPresent", en:"Snakes bite if they ____ scared.", ko:"뱀들은 겁을 먹으면 문다.", options:["are","were","will be","been"], answer:"are", explanation:"[Zero] 동물의 일반적인 본능/습성." },
  { id:2210, topic:"conditionalPresent", en:"If you freeze water, it ____ ice.", ko:"물을 얼리면 얼음이 된다.", options:["becomes","became","will become","becoming"], answer:"becomes", explanation:"[Zero] 과학적 사실." },
  // --- [First Conditional: 미래의 가정 & 시간/조건 부사절 (If+현재, 주절+미래)] (20문제) ---
  { id:2211, topic:"conditionalPresent", en:"If it ____ tomorrow, I will stay home.", ko:"내일 비가 오면, 나는 집에 있을 것이다.", options:["rains","will rain","rained","rain"], answer:"rains", explanation:"[First] 조건 부사절(If)에서는 현재시제가 미래를 대신합니다. (will rain 불가)" },
  { id:2212, topic:"conditionalPresent", en:"I will call you when he ____.", ko:"그가 오면 너에게 전화할게.", options:["comes","will come","came","come"], answer:"comes", explanation:"[First] 시간 부사절(When)에서도 현재시제가 미래를 대신합니다." },
  { id:2213, topic:"conditionalPresent", en:"Unless you ____, you will be late.", ko:"서두르지 않으면 늦을 것이다.", options:["hurry","don't hurry","will hurry","hurried"], answer:"hurry", explanation:"[First] Unless(=If not) 절 안에도 현재시제를 씁니다." },
  { id:2214, topic:"conditionalPresent", en:"If I ____ the exam, I will be happy.", ko:"시험에 합격하면 행복할 것이다.", options:["pass","will pass","passed","passing"], answer:"pass", explanation:"[First] 미래에 대한 가정이므로 If절은 현재시제." },
  { id:2215, topic:"conditionalPresent", en:"We will go for a walk if it ____ fine.", ko:"날씨가 좋으면 산책하러 갈 것이다.", options:["is","will be","was","be"], answer:"is", explanation:"[First] 날씨 조건절: 현재형 is 사용." },
  { id:2216, topic:"conditionalPresent", en:"As soon as I ____ home, I will text you.", ko:"집에 도착하자마자 문자 할게.", options:["arrive","will arrive","arrived","arriving"], answer:"arrive", explanation:"[First] As soon as(시간 부사절) + 현재시제." },
  { id:2217, topic:"conditionalPresent", en:"If she ____ not come, we will leave.", ko:"그녀가 오지 않으면 우리는 떠날 것이다.", options:["does","will","is","do"], answer:"does", explanation:"[First] 3인칭 단수 현재 부정은 does not." },
  { id:2218, topic:"conditionalPresent", en:"I will wait until you ____.", ko:"네가 끝날 때까지 기다릴게.", options:["finish","will finish","finished","finishing"], answer:"finish", explanation:"[First] Until(시간 부사절) + 현재시제." },
  { id:2219, topic:"conditionalPresent", en:"If you ____ him, give him this letter.", ko:"그를 보면 이 편지를 전해줘.", options:["see","will see","saw","seen"], answer:"see", explanation:"[First] 명령문이 주절인 경우에도 If절은 현재시제." },
  { id:2220, topic:"conditionalPresent", en:"What will you do if you ____ the bus?", ko:"버스를 놓치면 어떻게 할 거니?", options:["miss","will miss","missed","missing"], answer:"miss", explanation:"[First] 미래 상황 가정이므로 If절은 현재시제." },
  { id:2221, topic:"conditionalPresent", en:"Before you ____, please clean your room.", ko:"나가기 전에 방을 청소해라.", options:["go","will go","went","going"], answer:"go", explanation:"[First] Before(시간 부사절) + 현재시제." },
  { id:2222, topic:"conditionalPresent", en:"If he ____ hard, he will succeed.", ko:"그가 열심히 일한다면(공부한다면) 성공할 것이다.", options:["works","work","will work","worked"], answer:"works", explanation:"[First] 주어가 3인칭 단수(he)이므로 works." },
  { id:2223, topic:"conditionalPresent", en:"You can't go out unless you ____ your lunch.", ko:"점심을 다 먹지 않으면 나갈 수 없다.", options:["finish","don't finish","will finish","finished"], answer:"finish", explanation:"[First] Unless에 부정 의미가 포함되어 있으므로 긍정 동사 finish를 씁니다." },
  { id:2224, topic:"conditionalPresent", en:"If I ____ enough money, I will buy a car.", ko:"돈이 충분하다면 차를 살 것이다.", options:["have","will have","had","has"], answer:"have", explanation:"[First] 미래의 소유 가능성을 나타내는 현재시제 have." },
  { id:2225, topic:"conditionalPresent", en:"After I ____ lunch, I will study.", ko:"점심을 먹은 후에 공부할 것이다.", options:["eat","will eat","ate","eaten"], answer:"eat", explanation:"[First] After(시간 부사절) + 현재시제." },
  { id:2226, topic:"conditionalPresent", en:"If it ____ not rain tomorrow, we will play soccer.", ko:"내일 비가 오지 않는다면 축구를 할 것이다.", options:["does","will","is","do"], answer:"does", explanation:"[First] 내일의 날씨 가정이지만 If절 안이므로 does not rain." },
  { id:2227, topic:"conditionalPresent", en:"We will stay here while he ____.", ko:"그가 자는 동안 우리는 여기에 머물 것이다.", options:["sleeps","will sleep","slept","sleeping"], answer:"sleeps", explanation:"[First] While(시간 부사절) + 현재시제." },
  { id:2228, topic:"conditionalPresent", en:"If you ____ to the party, I will go too.", ko:"네가 파티에 간다면 나도 갈게.", options:["go","will go","went","gone"], answer:"go", explanation:"[First] 상대방의 미래 행동을 가정." },
  { id:2229, topic:"conditionalPresent", en:"Don't open the door until the train ____.", ko:"기차가 멈출 때까지 문을 열지 마라.", options:["stops","will stop","stopped","stop"], answer:"stops", explanation:"[First] 시간 부사절 until + 현재시제 (3인칭 단수 stops)." },
  { id:2230, topic:"conditionalPresent", en:"If anyone ____, tell them I am busy.", ko:"누구든 전화가 오면 내가 바쁘다고 말해줘.", options:["calls","will call","called","call"], answer:"calls", explanation:"[First] 주어 anyone은 단수 취급하므로 calls." },
  // 23. 가정법 과거 (ID: 2301 ~ 2399)
  
  // --- [초급: 기본 공식 (If + 주어 + 과거동사, 주어 + 조동사과거 + 원형)] (10문제) ---
  { id:2301, topic:"conditionalPast", en:"If I ____ rich, I would buy a car.", ko:"내가 부자라면 차를 살 텐데.", options:["were","was","am","have been"], answer:"were", explanation:"[초급] 가정법 과거에서 be동사는 인칭에 상관없이 무조건 'were'를 씁니다." },
  { id:2302, topic:"conditionalPast", en:"If I ____ the answer, I would tell you.", ko:"답을 안다면 너에게 말해줄 텐데.", options:["knew","know","known","knows"], answer:"knew", explanation:"[초급] 현재 사실의 반대는 과거 시제(knew)를 사용합니다." },
  { id:2303, topic:"conditionalPast", en:"If I ____ you, I wouldn't do that.", ko:"내가 너라면 그렇게 안 할 거야.", options:["were","was","am","are"], answer:"were", explanation:"[초급] 'If I were you'는 충고할 때 쓰는 관용적 표현입니다." },
  { id:2304, topic:"conditionalPast", en:"If it ____ snow, we could go skiing.", ko:"눈이 온다면 스키를 타러 갈 수 있을 텐데.", options:["snowed","snows","snowing","will snow"], answer:"snowed", explanation:"[초급] 가정법 과거의 조건절에는 과거 동사(snowed)가 옵니다." },
  { id:2305, topic:"conditionalPast", en:"If she ____ here, she would help us.", ko:"그녀가 여기 있다면 우리를 도울 텐데.", options:["were","is","be","been"], answer:"were", explanation:"[초급] 현재 그녀가 여기 없지만, '있다면'이라고 가정하는 상황입니다." },
  { id:2306, topic:"conditionalPast", en:"If I ____ enough money, I would travel.", ko:"돈이 충분하다면 여행을 갈 텐데.", options:["had","have","has","having"], answer:"had", explanation:"[초급] 현재 돈이 없는 상황의 반대 가정이므로 had를 씁니다." },
  { id:2307, topic:"conditionalPast", en:"We ____ go on a picnic if it were sunny.", ko:"날씨가 맑다면 소풍을 갈 텐데.", options:["would","will","can","shall"], answer:"would", explanation:"[초급] 주절에는 조동사의 과거형(would/could/might)이 옵니다." },
  { id:2308, topic:"conditionalPast", en:"If he ____ busy, he would come.", ko:"그가 바쁘지 않다면 올 텐데.", options:["weren't","isn't","wasn't","not"], answer:"weren't", explanation:"[초급] be동사의 부정은 were not (weren't)입니다." },
  { id:2309, topic:"conditionalPast", en:"What ____ you do if you won the lottery?", ko:"복권에 당첨된다면 무엇을 하겠니?", options:["would","will","can","did"], answer:"would", explanation:"[초급] 의문문에서도 'would + 동사원형' 규칙은 동일합니다." },
  { id:2310, topic:"conditionalPast", en:"If I lived near the sea, I ____ swim every day.", ko:"바다 근처에 산다면 매일 수영할 텐데.", options:["could","can","will","may"], answer:"could", explanation:"[초급] '수영할 수 있을 텐데(능력)'의 의미이므로 could." },
  // --- [중급: I wish / As if / Without 등 특수 구문] (10문제) ---
  { id:2311, topic:"conditionalPast", en:"I wish I ____ fly.", ko:"내가 날 수 있다면 좋을 텐데.", options:["could","can","will","may"], answer:"could", explanation:"[중급] I wish + 가정법 과거: 현재 실현 불가능한 소망." },
  { id:2312, topic:"conditionalPast", en:"I wish I ____ a sister.", ko:"여동생이 있다면 좋을 텐데.", options:["had","have","has","having"], answer:"had", explanation:"[중급] 현재 없지만 있기를 바라는 것이므로 과거형 had." },
  { id:2313, topic:"conditionalPast", en:"He acts as if he ____ my boss.", ko:"그는 마치 나의 상사인 것처럼 행동한다.", options:["were","is","was","has been"], answer:"were", explanation:"[중급] as if + 가정법 과거: 마치 (지금) ~인 것처럼 (사실은 아님)." },
  { id:2314, topic:"conditionalPast", en:"She talks as if she ____ everything.", ko:"그녀는 모든 것을 아는 것처럼 말한다.", options:["knew","knows","known","knowing"], answer:"knew", explanation:"[중급] 사실은 모르지만 아는 척하므로 가정법 과거 knew." },
  { id:2315, topic:"conditionalPast", en:"____ water, we couldn't live.", ko:"물이 없다면 우리는 살 수 없을 것이다.", options:["Without","With","Unless","If"], answer:"Without", explanation:"[중급] Without + 명사: ~이 없다면 (=If it were not for)." },
  { id:2316, topic:"conditionalPast", en:"If it ____ not for the sun, nothing could grow.", ko:"태양이 없다면 아무것도 자랄 수 없을 것이다.", options:["were","is","was","are"], answer:"were", explanation:"[중급] If it were not for: ~이 없다면 (현재 사실 반대)." },
  { id:2317, topic:"conditionalPast", en:"It is high time you ____ to bed.", ko:"네가 잠자리에 들 시간이다(이미 늦었다).", options:["went","go","gone","going"], answer:"went", explanation:"[중급] It is (high) time + 주어 + 과거동사: ~해야 할 시간이다(재촉)." },
  { id:2318, topic:"conditionalPast", en:"I wish I ____ taller.", ko:"키가 더 크면 좋을 텐데.", options:["were","am","was","be"], answer:"were", explanation:"[중급] I wish 가정법에서도 be동사는 were를 씁니다." },
  { id:2319, topic:"conditionalPast", en:"But for your help, I ____ fail.", ko:"너의 도움이 없다면 나는 실패할 것이다.", options:["would","will","can","shall"], answer:"would", explanation:"[중급] But for (=Without) 가정법의 주절에는 조동사 과거형이 옵니다." },
  { id:2320, topic:"conditionalPast", en:"If I ____ speak English well!", ko:"영어를 잘할 수 있다면 좋을 텐데! (감탄문)", options:["could","can","will","may"], answer:"could", explanation:"[중급] If only S + V: I wish와 같은 소망 표현." },
  // --- [종합: 직설법 전환, 문맥 파악 및 심화] (10문제) ---
  { id:2321, topic:"conditionalPast", en:"'If I had time, I would go.' means: ____.", ko:"'시간이 있다면 갈 텐데'의 속뜻은?", options:["I don't have time, so I can't go.","I have time, so I will go.","I didn't have time, so I didn't go.","I will have time."], answer:"I don't have time, so I can't go.", explanation:"[종합] 가정법 과거는 '현재의 반대' 상황을 나타냅니다." },
  { id:2322, topic:"conditionalPast", en:"As I am sick, I cannot go. = If I ____ not sick, I could go.", ko:"아파서 못 간다. = 아프지 않다면 갈 수 있을 텐데.", options:["were","am","was","been"], answer:"were", explanation:"[종합] 직설법(현재, 긍정) -> 가정법(과거, 부정)." },
  { id:2323, topic:"conditionalPast", en:"If I ____ a bird, I would fly to you.", ko:"내가 새라면 너에게 날아갈 텐데.", options:["were","am","was","be"], answer:"were", explanation:"[종합] 실현 불가능한 상상(내가 새가 되는 것)도 가정법 과거를 씁니다." },
  { id:2324, topic:"conditionalPast", en:"If I ____ you were coming, I would bake a cake.", ko:"(지금) 네가 온다는 걸 안다면 케이크를 구울 텐데.", options:["knew","know","known","have known"], answer:"knew", explanation:"[종합] were coming(과거진행형 형태지만 가정법 내에서는 현재 의미)과 어울리는 knew." },
  { id:2325, topic:"conditionalPast", en:"Supposing you ____ a million dollars, what would you do?", ko:"백만 달러가 있다고 가정하면, 뭘 하겠니?", options:["had","have","have had","having"], answer:"had", explanation:"[종합] Supposing = If. 가정법 과거 문장이므로 had." },
  { id:2326, topic:"conditionalPast", en:"She treats me as if I ____ a child.", ko:"그녀는 나를 마치 어린애 취급한다.", options:["were","am","was","be"], answer:"were", explanation:"[종합] 실제로는 어린애가 아니므로(반대 사실) 가정법 과거 were." },
  { id:2327, topic:"conditionalPast", en:"I'm sorry I don't have a car. = I wish I ____ a car.", ko:"차가 없어서 유감이다. = 차가 있다면 좋을 텐데.", options:["had","have","didn't have","had not"], answer:"had", explanation:"[종합] I'm sorry(유감이다) 뒤의 직설법 부정을 가정법 긍정으로 바꿉니다." },
  { id:2328, topic:"conditionalPast", en:"If we ____ a taxi, we would arrive sooner.", ko:"택시를 탄다면 더 빨리 도착할 텐데.", options:["took","take","taken","taking"], answer:"took", explanation:"[종합] 현재 상황에 대한 대안을 가정할 때 과거 동사 took 사용." },
  { id:2329, topic:"conditionalPast", en:"If I ____ his number, I would call him right now.", ko:"그의 번호를 안다면 지금 당장 전화할 텐데.", options:["knew","know","known","knows"], answer:"knew", explanation:"[종합] right now(현재)가 있어도, 가정법(상상)이므로 동사는 과거형 knew." },
  { id:2330, topic:"conditionalPast", en:"He acts as if he ____ the answer.", ko:"그는 마치 답을 아는 것처럼 행동한다.", options:["knew","knows","know","known"], answer:"knew", explanation:"[종합] 주절(acts)이 현재여도, 내용은 '사실은 모르는데 아는 척'하는 것이므로 가정법 과거." },
  // 24. 가정법 과거완료 (ID: 2401 ~ 2499)
  
  // --- [초급: If + had p.p, 주절 + would have p.p. (기본 공식)] (10문제) ---
  { id:2401, topic:"conditionalPastPerfect", en:"If I ____ harder, I would have passed.", ko:"더 열심히 공부했더라면 합격했을 텐데.", options:["had studied","studied","study","have studied"], answer:"had studied", explanation:"[초급] 과거 사실의 반대는 'If + 주어 + had p.p.'를 씁니다." },
  { id:2402, topic:"conditionalPastPerfect", en:"If I had known, I ____ told you.", ko:"알았더라면 너에게 말해줬을 텐데.", options:["would have","will have","would","had"], answer:"would have", explanation:"[초급] 주절의 공식: 조동사 과거형(would) + have p.p." },
  { id:2403, topic:"conditionalPastPerfect", en:"If she ____ the bus, she would have been late.", ko:"그녀가 버스를 놓쳤더라면 늦었을 것이다.", options:["had missed","missed","misses","has missed"], answer:"had missed", explanation:"[초급] '놓쳤었다면(과거)'의 가정은 had missed." },
  { id:2404, topic:"conditionalPastPerfect", en:"We ____ gone if it had rained.", ko:"비가 왔더라면 우리는 가지 않았을 것이다.", options:["wouldn't have","won't have","didn't have","don't have"], answer:"wouldn't have", explanation:"[초급] 가정법 과거완료의 부정 주절: wouldn't have p.p." },
  { id:2405, topic:"conditionalPastPerfect", en:"If I ____ enough money, I could have bought it.", ko:"돈이 충분했더라면 샀을 텐데.", options:["had had","had","have had","have"], answer:"had had", explanation:"[초급] have(가지다)의 과거완료형은 had(조동사) + had(p.p.)입니다." },
  { id:2406, topic:"conditionalPastPerfect", en:"If he had asked me, I ____ helped him.", ko:"그가 부탁했더라면 그를 도왔을 텐데.", options:["would have","will have","can have","did have"], answer:"would have", explanation:"[초급] '도왔을 것이다' = would have helped." },
  { id:2407, topic:"conditionalPastPerfect", en:"If you had seen the movie, you ____ liked it.", ko:"네가 그 영화를 봤다면 좋아했을 거야.", options:["would have","will have","would","had"], answer:"would have", explanation:"[초급] 가정법 과거완료 주절." },
  { id:2408, topic:"conditionalPastPerfect", en:"If I ____ not been sick, I would have gone.", ko:"아프지 않았더라면 갔을 텐데.", options:["had","have","was","did"], answer:"had", explanation:"[초급] be sick의 과거완료: had been sick." },
  { id:2409, topic:"conditionalPastPerfect", en:"They could have won if they ____ practiced.", ko:"연습했더라면 그들이 이길 수 있었을 텐데.", options:["had","have","did","were"], answer:"had", explanation:"[초급] 조건절(If)에는 had p.p.가 옵니다." },
  { id:2410, topic:"conditionalPastPerfect", en:"If I had met him, I would ____ happy.", ko:"그를 만났더라면 행복했을 텐데.", options:["have been","be","had been","was"], answer:"have been", explanation:"[초급] would have + p.p.(been)." },
  // --- [중급: I wish, As if, 혼합 가정법 (시제 주의)] (10문제) ---
  { id:2411, topic:"conditionalPastPerfect", en:"I wish I ____ seen him yesterday.", ko:"어제 그를 봤더라면 좋았을 텐데.", options:["had","have","saw","did"], answer:"had", explanation:"[중급] 과거 일(yesterday)에 대한 유감/후회는 I wish + had p.p." },
  { id:2412, topic:"conditionalPastPerfect", en:"I wish I ____ eaten so much.", ko:"그렇게 많이 먹지 말았어야 했는데.", options:["hadn't","didn't","haven't","won't"], answer:"hadn't", explanation:"[중급] 과거 행동에 대한 후회(부정)." },
  { id:2413, topic:"conditionalPastPerfect", en:"He talks as if he ____ been there.", ko:"그는 마치 (과거에) 거기에 가봤던 것처럼 말한다.", options:["had","has","was","did"], answer:"had", explanation:"[중급] 말하는 시점보다 '이전의 일'을 가정할 때는 as if + had p.p." },
  { id:2414, topic:"conditionalPastPerfect", en:"She looked as if she ____ seen a ghost.", ko:"그녀는 마치 유령을 본 것 같은 표정이었다.", options:["had","has","saw","did"], answer:"had", explanation:"[중급] 보였던 것(과거)보다 본 것(대과거)이 먼저이므로 had seen." },
  { id:2415, topic:"conditionalPastPerfect", en:"I should ____ studied harder.", ko:"나는 더 열심히 공부했어야 했다 (근데 안 했다).", options:["have","had","be","was"], answer:"have", explanation:"[중급] should have p.p.: 과거의 일에 대한 후회." },
  { id:2416, topic:"conditionalPastPerfect", en:"He must ____ been tired.", ko:"그는 피곤했음에 틀림없다.", options:["have","had","be","was"], answer:"have", explanation:"[중급] must have p.p.: 과거 사실에 대한 강한 추측." },
  { id:2417, topic:"conditionalPastPerfect", en:"[Mixed] If I had eaten breakfast, I ____ not be hungry now.", ko:"아침을 먹었더라면, 지금 배고프지 않을 텐데.", options:["would","will","had","did"], answer:"would", explanation:"[중급-혼합] 과거의 원인(had eaten) -> 현재의 결과(would + 원형 + now)." },
  { id:2418, topic:"conditionalPastPerfect", en:"[Mixed] If I had taken the bus, I would ____ here now.", ko:"버스를 탔더라면, 지금 여기 있을 텐데.", options:["be","have been","been","am"], answer:"be", explanation:"[중급-혼합] now가 있으므로 주절은 가정법 과거(would be)를 씁니다." },
  { id:2419, topic:"conditionalPastPerfect", en:"I'm sorry I lost it. = I wish I ____ lost it.", ko:"그걸 잃어버려서 유감이다 = 잃어버리지 않았더라면 좋았을 텐데.", options:["hadn't","didn't","haven't","won't"], answer:"hadn't", explanation:"[중급] 직설법 과거(lost) -> 가정법 과거완료(had not lost)." },
  { id:2420, topic:"conditionalPastPerfect", en:"I regret meeting him. = I wish I ____ met him.", ko:"그를 만난 걸 후회해 = 그를 만나지 않았더라면.", options:["hadn't","didn't","haven't","don't"], answer:"hadn't", explanation:"[중급] 과거 사실(met)의 반대 소망." },
  // --- [고급: 도치(If생략), 전치사구, 특수 구문] (10문제) ---
  { id:2421, topic:"conditionalPastPerfect", en:"____ I known the truth, I would have told you.", ko:"(만약) 내가 진실을 알았더라면, 너에게 말했을 텐데.", options:["Had","If","Did","Were"], answer:"Had", explanation:"[고급] If가 생략되면 주어와 조동사(Had)가 도치됩니다. (Had I known)" },
  { id:2422, topic:"conditionalPastPerfect", en:"____ it not been for your help, I would have failed.", ko:"너의 도움이 없었더라면, 나는 실패했을 것이다.", options:["Had","If","Has","Was"], answer:"Had", explanation:"[고급] If it had not been for -> Had it not been for (도치 구문)." },
  { id:2423, topic:"conditionalPastPerfect", en:"____ your help, I would have failed.", ko:"너의 도움이 없었더라면... (전치사)", options:["Without","Unless","If","Although"], answer:"Without", explanation:"[고급] Without + 명사 = If it had not been for." },
  { id:2424, topic:"conditionalPastPerfect", en:"____ for his advice, I couldn't have succeeded.", ko:"그의 조언이 없었더라면...", options:["But","Except","Only","With"], answer:"But", explanation:"[고급] But for + 명사 = ~이 없었더라면 (가정법 과거완료 대용)." },
  { id:2425, topic:"conditionalPastPerfect", en:"If it ____ not been for the rain, we would have gone.", ko:"비가 오지 않았더라면 갔을 텐데.", options:["had","has","was","is"], answer:"had", explanation:"[고급] If it had not been for (~이 없었더라면) 관용구." },

    // ★★ TTS (Text-to-Speech) 기능 ★★
    function speakEnglish(text) {
        if(!text) return;
        const cleanText = text.replace(/_{2,}/g, 'blank').replace(/Q\d+\.\s*/,'').replace(/Q\.\s*/,'');
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(cleanText);
        utter.lang = 'en-US';
        utter.rate = 0.85;
        utter.pitch = 1;
        const voices = window.speechSynthesis.getVoices();
        const enVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Female')) 
                     || voices.find(v => v.lang.startsWith('en-US'))
                     || voices.find(v => v.lang.startsWith('en'));
        if(enVoice) utter.voice = enVoice;
        window.speechSynthesis.speak(utter);
    }
    if(window.speechSynthesis) {
        window.speechSynthesis.getVoices();
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
    function createTTSButton(text, size) {
        const btn = document.createElement('button');
        btn.innerHTML = '🔊';
        btn.title = '영어 문장 듣기';
        btn.style.cssText = `background:none; border:2px solid #ffd43b; border-radius:50%; width:${size||38}px; height:${size||38}px; cursor:pointer; font-size:${(size||38)*0.45}px; margin-left:10px; vertical-align:middle; transition:0.2s; flex-shrink:0;`;
        btn.onmouseover = () => btn.style.background = '#fff9db';
        btn.onmouseout = () => btn.style.background = 'none';
        btn.onclick = (e) => { e.stopPropagation(); speakEnglish(text); };
        return btn;
    }
