    let qList = [], qIndex = 0, qScore = 0;
    let qWrongList = [];
        quizAllHistory = []; 
    let isFirstTry = true;
    let quizAllHistory = [];

    function startQuiz(topic) {
        qWrongList = [];
        quizAllHistory = []; 
        if(topic === 'random') qList = [...grammarQuestions].sort(()=>0.5-Math.random()).slice(0,10);
        else qList = grammarQuestions.filter(q => q.topic === topic);
        
        if(qList.length === 0) { alert('문제가 없습니다.'); return; }
        
        switchScreen('quiz-container');
        document.getElementById('quiz-select-menu').style.display = 'none';
        document.getElementById('quiz-solve-area').style.display = 'block';
        qIndex = 0; qScore = 0;
        showQuizQuestion();
    }

    function showQuizQuestion() {
        const q = qList[qIndex];
        isFirstTry = true;
        document.getElementById('score-display').innerText = `Score: ${qScore} / ${qList.length}`;
        
        const qTextEl = document.getElementById('quiz-question-text');
        qTextEl.innerHTML = '';
        const qTextSpan = document.createElement('span');
        qTextSpan.innerText = `Q${qIndex+1}. ${q.en}`;
        qTextEl.appendChild(qTextSpan);
        qTextEl.appendChild(createTTSButton(q.en.replace(/_{2,}/g, q.answer)));
        
        if(q.ko) {
            const koDiv = document.createElement('div');
            koDiv.style.cssText = 'font-size:0.9rem; color:#888; margin-top:10px; font-weight:500;';
            koDiv.innerText = '💬 ' + q.ko;
            qTextEl.appendChild(koDiv);
        }
        
        const area = document.getElementById('quiz-options-area');
        area.innerHTML = '';
        
        const fb = document.getElementById('quiz-feedback');
        fb.className = 'feedback';
        fb.innerHTML = '';
        document.getElementById('next-quiz-btn').style.display = 'none';
        
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'quiz-option';
            btn.innerText = opt;
            // 인자 전달 방식 수정 (선택한 옵션 문자열을 전달)
            btn.onclick = () => checkAnswer(opt); 
            area.appendChild(btn);
        });
    }

    function checkAnswer(selectedOpt) {
    const q = qList[qIndex];
    const feedbackEl = document.getElementById('quiz-feedback');
    const optionsArea = document.getElementById('quiz-options-area');
    if (!feedbackEl || feedbackEl.innerHTML !== '') return;
    const buttons = optionsArea.getElementsByTagName('button');
    for (let btn of buttons) {
        btn.disabled = true;
        if (btn.innerText === q.answer) {
            btn.style.borderColor = '#40c057';
            btn.style.backgroundColor = '#d3f9d8';
            btn.style.color = '#2b8a3e';
        } else if (btn.innerText === selectedOpt && selectedOpt !== q.answer) {
            btn.style.borderColor = '#e03131';
            btn.style.backgroundColor = '#ffe3e3';
            btn.style.color = '#e03131';
        } else {
            btn.style.opacity = '0.5';
        }
    }
    const isCorrect = (selectedOpt === q.answer);
    if (isCorrect && isFirstTry) qScore++;
    if (!isCorrect && isFirstTry) qWrongList.push(q);
    if (isFirstTry) quizAllHistory.push({q: q.en, selected: selectedOpt, correct: q.answer, isCorrect: isCorrect, topic: q.topic});
    isFirstTry = false;
    if (isCorrect) {
        feedbackEl.innerHTML = '🎉 정답입니다! <br><span style="font-size:0.9rem; color:#2b8a3e;">' + (q.explanation || '') + '</span>';
        feedbackEl.className = 'feedback correct';
    } else {
        feedbackEl.innerHTML = '❌ 틀렸습니다. 정답은 <strong>' + q.answer + '</strong>입니다.<br><span style="font-size:0.9rem; color:#666;">💡 해설: ' + (q.explanation || '') + '</span>';
        feedbackEl.className = 'feedback wrong';
    }
    document.getElementById('next-quiz-btn').style.display = 'inline-block';
}

    // (nextQuizQuestion, retry 함수들은 기존과 동일하므로 생략하거나 기존 것 유지)
    function nextQuizQuestion() {
        qIndex++;
        if(qIndex < qList.length) showQuizQuestion();
        else {
            const totalAll = quizAllHistory.length;
            const correctAll = quizAllHistory.filter(h => h.isCorrect).length;
            const wrongAll = quizAllHistory.filter(h => !h.isCorrect).length;
            const rate = totalAll > 0 ? Math.round((correctAll/totalAll)*100) : 0;
            document.getElementById('quiz-question-text').innerHTML = `
                <div style="text-align:center;">
                    <div style="font-size:1.5rem; margin-bottom:15px;">👏 모든 문제를 풀었습니다!</div>
                    <div style="font-size:1.2rem; margin-bottom:20px;">이번 점수: <b style="color:#1c7ed6;">${qScore}점 / ${qList.length}문제</b></div>
                </div>`;
            document.getElementById('quiz-options-area').innerHTML = '';
            document.getElementById('quiz-feedback').innerHTML = `<div style="text-align:center;"><button onclick="showQuizSelection()" style="padding:12px 30px; border-radius:30px; border:none; background:#f1f3f5; cursor:pointer; font-weight:bold;">목록으로</button></div>`;
            document.getElementById('next-quiz-btn').style.display = 'none';
        }
    }

    // ==========================================
    // 5. 최종 평가 & 오답 노트 (타이머 + 해설 수정)
    // ==========================================
    let eList = [], eIndex = 0, eScore = 0, eHistory = [], isRetry = false;
    
    let examInterval; 
    
    function startFinalExam() {
        isRetry = false;
        eList = [...grammarQuestions].sort(()=>0.5-Math.random()).slice(0,20);
        if(eList.length === 0) { alert('문제가 부족합니다.'); return; }
        setupExam();
    }
    
    function retryWrongQuestions() {
        const wrongs = eHistory.filter(h => !h.isCorrect);
        if(wrongs.length === 0) { alert('틀린 문제가 없어서 재도전할 수 없어요! 🎉'); return; }
        eList = wrongs.map(w => grammarQuestions.find(q => q.en === w.q));
        isRetry = true;
        setupExam();
    }
    
    function setupExam() {
        eIndex = 0; eScore = 0; eHistory = [];
        if(examInterval) clearInterval(examInterval);
        switchScreen('exam-container');
        document.getElementById('exam-start-screen').style.display = 'none';
        document.getElementById('exam-progress-area').style.display = 'block';
        showExamQuestion();
    }
    
    function showExamQuestion() {
        if (eIndex >= eList.length) { finishExam(); return; }
        const q = eList[eIndex];
        if(examInterval) clearInterval(examInterval);
        let timeLeft = 20;

        const qTextEl = document.getElementById('exam-question-text');
        qTextEl.innerHTML = `<div style="text-align:right;"><span id="exam-timer-display" style="color:#e03131; font-weight:800; font-size:1.2rem;">⏱ ${timeLeft}s</span></div>` +
                            `<span>Q. ${q.en}</span>`;
        qTextEl.appendChild(createTTSButton(q.en.replace(/_{2,}/g, q.answer)));
        
        document.getElementById('exam-current-num').innerText = `${eIndex+1} / ${eList.length}`;
        const area = document.getElementById('exam-options-area');
        area.innerHTML = '';
        
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'exam-option';
            btn.innerText = opt;
            btn.onclick = () => handleExamSelection(opt, q);
            area.appendChild(btn);
        });

        examInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('exam-timer-display').innerText = `⏱ ${timeLeft}s`;
            if(timeLeft <= 0) { clearInterval(examInterval); handleExamSelection(null, q); }
        }, 1000);
    }

    function handleExamSelection(selectedOpt, question) {
        if(examInterval) clearInterval(examInterval);
        const isCorrect = (selectedOpt === question.answer);
        if(isCorrect) eScore++;
        // 기록 시 explanation을 반드시 포함해야 함!
        eHistory.push({
            q: question.en, 
            selected: selectedOpt || "시간 초과", 
            correct: question.answer, 
            isCorrect: isCorrect,
            explanation: question.explanation // 이 줄이 있어야 나중에 해설이 보임
        });
        eIndex++;
        showExamQuestion();
    }
    
    function finishExam() {
    if(examInterval) clearInterval(examInterval);
    switchScreen('history-container');
    document.getElementById('exam-result-view').style.display = 'block';
    document.getElementById('history-list-view').style.display = 'none';
    const finalScore = Math.round((eScore/eList.length)*100);
    document.getElementById('exam-score').innerText = '최종 점수: ' + finalScore + '점 (' + eScore + '/' + eList.length + ')';
    let msg = '';
    if (finalScore >= 90) msg = '🏆 최고! 완벽에 가깝습니다!';
    else if (finalScore >= 70) msg = '👍 잘했어요! 조금만 더 노력하면!';
    else if (finalScore >= 50) msg = '💪 괜찮아요! 다시 도전해보세요!';
    else msg = '😢 더 열심히 공부해봐요!';
    document.getElementById('exam-message').innerText = msg;
    const wrongCount = eHistory.filter(h => !h.isCorrect).length;
    const retryArea = document.getElementById('retry-btn-area');
    if (wrongCount > 0) {
        retryArea.innerHTML = '<button onclick="retryWrongQuestions()" style="padding:12px 30px; background:#fa5252; color:white; border:none; border-radius:30px; font-weight:bold; cursor:pointer;">🔄 틀린 문제 다시 풀기 (' + wrongCount + '개)</button>';
    } else {
        retryArea.innerHTML = '';
    }
    // populate review list
    const reviewList = document.getElementById('exam-review-list');
    if (reviewList) {
        reviewList.innerHTML = '';
        eHistory.forEach((h, i) => {
            const div = document.createElement('div');
            div.style.cssText = 'padding:10px; margin:5px 0; border-radius:8px; background:' + (h.isCorrect ? '#d3f9d8' : '#ffe3e3') + '; font-size:0.9rem;';
            div.innerHTML = '<strong>' + (i+1) + '. ' + h.q + '</strong><br>선택: ' + h.selected + ' | 정답: ' + h.correct + ' ' + (h.isCorrect ? '✅' : '❌');
            reviewList.appendChild(div);
        });
    }
}

    // 6. 동사 퀴즈 (기존과 동일하되 인자 오류만 수정)
    let vCur = null;
    function startVerbQuiz() {
        vCur = verbs[Math.floor(Math.random() * verbs.length)];
        const type = document.getElementById('verbQuizType').value;
        let qText = (type === 'past') ? `[${vCur.base}]의 과거형?` : (type === 'pp' ? `[${vCur.base}]의 과거분사?` : `[${vCur.past}]의 원형?`);
        let wordToSpeak = (type === 'base') ? vCur.past : vCur.base;

        document.getElementById('verbQuizQuestion').innerHTML = "Q. " + qText + 
            ` <button onclick="speakEnglish('${wordToSpeak}')" style="background:none; border:2px solid #ffd43b; border-radius:50%; width:34px; height:34px; cursor:pointer;">🔊</button>`;
        document.getElementById('verbQuizAnswer').value = '';
        document.getElementById('verbQuizResult').innerText = '';
    }

    function checkVerbQuiz() {
        const ans = document.getElementById('verbQuizAnswer').value.trim().toLowerCase();
        const type = document.getElementById('verbQuizType').value;
        let cor = type === 'past' ? vCur.past : (type === 'pp' ? vCur.pp : vCur.base);
        const possible = cor.split('/').map(s => s.trim());
        
        if(possible.includes(ans) && ans !== '') {
            document.getElementById('verbQuizResult').innerHTML = `<span style='color:#2b8a3e'>🎉 정답: ${cor}</span>`;
        } else {
            document.getElementById('verbQuizResult').innerHTML = `<span style='color:#e03131'>❌ 오답! 정답: ${cor}</span>`;
        }
    }

</script>
</body>
